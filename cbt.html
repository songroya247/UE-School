<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chord Composer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --white:#fff;--bg:#f0f0f0;--border:#e2e2e2;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --accent:#1a73e8;--accent-lt:#e8f0fe;
  --green:#1e8a4a;--green-lt:#e6f4ea;
  --red:#c0392b;--red-lt:#fdecea;
  --amber:#e08c00;--amber-lt:#fef3c7;
  --kb:#d1d5db;--ks:0 2px 0 #aaa;
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);overflow:hidden;}

/* ── SHELL ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── TOP BAR ── */
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:10px 14px 8px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10;
}
.topbar-title{font-size:0.8rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-btn{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
  padding:3px 10px;font-size:0.62rem;color:var(--text2);cursor:pointer;white-space:nowrap;
  transition:all 0.1s;
}
.tb-btn:active{background:var(--accent-lt);border-color:var(--accent);color:var(--accent);}
.tb-btn.set{background:var(--white);color:var(--text);border-color:#ccc;}

/* ── DOC AREA ── */
.doc-area{flex:1;overflow-y:auto;background:var(--white);padding:18px 16px 8px;-webkit-overflow-scrolling:touch;}

/* ── BEAT TOKENS DISPLAY ── */
.beats-display{
  font-size:1.15rem;line-height:2.1;min-height:40px;
  cursor:text;word-break:break-word;position:relative;
  padding-bottom:4px;
}

/* individual beat token — tappable */
.bt{
  display:inline-flex;align-items:center;
  border-radius:5px;padding:1px 4px;margin:1px 2px;
  border:1.5px solid transparent;
  cursor:pointer;transition:background 0.1s,border-color 0.1s;
  position:relative;vertical-align:middle;
  touch-action:manipulation;
}
.bt:active{background:#f0f4ff;}
.bt.selected{
  border-color:var(--accent);
  background:var(--accent-lt);
}
.bt.has-error{border-color:var(--red);background:var(--red-lt);}
.bt .bm{color:var(--text);font-weight:600;}
.bt .bs{color:#aaa;font-size:0.9em;}
.bt .bb{color:var(--accent);}
.bt.has-error .bm,.bt.has-error .bb{color:var(--red);}
/* missing part shown as placeholder */
.bt .bmissing{color:#ccc;font-style:italic;}

/* cursor between tokens */
.bt-cursor{
  display:inline-block;width:2px;height:1.1em;
  background:var(--accent);vertical-align:text-bottom;
  margin:0 1px;animation:blink 1s step-end infinite;
  border-radius:1px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* separator dot */
.bt-sep{color:#bbb;margin:0 1px;font-size:0.9em;vertical-align:middle;}

/* ── EDIT MODE INDICATOR ── */
.edit-banner{
  display:none;
  background:var(--accent-lt);border:1px solid var(--accent);
  border-radius:6px;padding:6px 10px;margin-bottom:10px;
  font-size:0.7rem;color:var(--accent);font-weight:500;
  align-items:center;gap:8px;
}
.edit-banner.open{display:flex;}
.eb-beat{font-weight:700;font-size:0.85rem;}
.eb-cancel{margin-left:auto;background:none;border:none;color:var(--accent);font-size:0.75rem;cursor:pointer;font-weight:600;padding:2px 6px;}

/* ── PILLS ── */
.pill-row{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 2px;min-height:28px;}
.pill{
  display:inline-flex;align-items:center;gap:1px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:2px 8px;font-size:0.72rem;font-weight:500;
}
.pill .pm{color:var(--text);}
.pill .ps{color:var(--text3);font-size:0.65rem;}
.pill .pb{color:var(--accent);}
.pill.err{background:var(--red-lt);border-color:var(--red);}
.pill.err .pm,.pill.err .pb{color:var(--red);}
.pill-count{font-size:0.6rem;color:var(--text3);padding:2px 4px;align-self:center;}

/* ── ANALYSE BTN ── */
.analyse-btn{
  display:block;width:100%;background:var(--accent);color:#fff;
  border:none;border-radius:8px;padding:11px;
  font-size:0.8rem;font-weight:600;letter-spacing:0.3px;
  cursor:pointer;margin:10px 0 6px;transition:background 0.15s;
}
.analyse-btn:active{background:#1557b0;}
.analyse-btn:disabled{background:#b0c4e8;cursor:not-allowed;}

/* ── RESULTS ── */
.results-area{margin-top:6px;display:none;}
.results-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0 5px;border-bottom:1.5px solid var(--green);margin-bottom:10px;
}
.results-title{font-size:0.72rem;font-weight:600;color:var(--green);}
.results-sub{font-size:0.6rem;color:var(--text3);}
.btn-auto{font-size:0.62rem;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:500;}

.beat-block{margin-bottom:16px;animation:si 0.2s ease both;}
@keyframes si{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.bb-head{display:flex;align-items:baseline;gap:7px;margin-bottom:6px;}
.bb-tok{font-size:1.15rem;font-weight:700;line-height:1;}
.bb-tok .sl{color:var(--text3);font-weight:400;}
.bb-tok .ba{color:var(--accent);font-weight:400;}
.bb-num{font-size:0.55rem;color:var(--text3);letter-spacing:1px;}
.bb-cnt{font-size:0.55rem;color:var(--green);background:var(--green-lt);border-radius:8px;padding:1px 7px;}

.chord-scroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chord-scroll::-webkit-scrollbar{display:none;}

.ch-card{
  flex-shrink:0;background:var(--white);border:1.5px solid var(--border);
  border-radius:8px;padding:6px 10px;cursor:pointer;min-width:64px;
  transition:all 0.1s;
}
.ch-card:active{transform:scale(0.95);}
.ch-card.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.ch-card.compat{border-color:#70b890;background:var(--green-lt);}
.ch-name{font-size:0.88rem;font-weight:700;line-height:1;}
.ch-type{font-size:0.5rem;color:var(--text3);margin-top:1px;}
.ch-card.sel .ch-type{color:rgba(255,255,255,0.6);}
.ch-notes{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.ch-note{font-size:0.62rem;padding:2px 5px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-weight:500;}
.ch-card.sel .ch-note{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.8);}
.ch-note.nm{border-color:var(--amber);color:var(--amber);background:var(--amber-lt);}
.ch-note.nb{border-color:var(--accent);color:var(--accent);background:var(--accent-lt);}
.ch-card.sel .ch-note.nm{border-color:#fde68a;color:#fde68a;background:rgba(253,230,138,0.15);}
.ch-card.sel .ch-note.nb{border-color:#bfdbfe;color:#bfdbfe;background:rgba(191,219,254,0.15);}

/* prog summary */
.prog-summary{margin-top:12px;padding:10px 12px;background:var(--green-lt);border-radius:8px;border:1px solid #b7dfca;}
.ps-label{font-size:0.58rem;font-weight:600;color:var(--green);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.ps-flow{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-start;}
.ps-node{display:flex;flex-direction:column;align-items:center;gap:1px;}
.ps-beat{font-size:0.4rem;color:var(--text3);}
.ps-arr{display:flex;flex-direction:column;align-items:center;padding-top:9px;}
.ps-arrow{color:var(--text3);font-size:0.65rem;}
.ps-sh.warn{color:var(--red);}
.export-btn{display:block;width:100%;margin-top:8px;background:#fff;border:1px solid #b7dfca;color:var(--green);padding:7px;font-size:0.68rem;font-weight:600;border-radius:6px;cursor:pointer;text-align:center;}
.export-btn:active{background:var(--green);color:#fff;}

/* ── TYPING STATUS STRIP ── */
.kb-status{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:5px 10px 4px;
  display:flex;align-items:center;gap:6px;min-height:28px;
}
.ks-label{font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);}
.ks-pending{
  display:flex;align-items:center;gap:3px;
  font-size:0.95rem;font-weight:600;color:var(--text);
  min-width:60px;
}
.ks-mel{color:var(--text);}
.ks-sl{color:#ccc;}
.ks-bas{color:var(--accent);}
.ks-caret{
  display:inline-block;width:2px;height:0.9em;
  background:var(--accent);border-radius:1px;vertical-align:text-bottom;
  animation:blink 1s step-end infinite;
}
.ks-hint{font-size:0.58rem;color:var(--text3);margin-left:auto;font-style:italic;}

/* ── STALE RESULTS PULSE ── */
/* stale class kept for JS compatibility but no animation */
.analyse-btn.stale{}

/* ── DELETE BADGE on long-press ── */
.bt .bt-del{
  display:none;
  position:absolute;top:-8px;right:-8px;
  width:16px;height:16px;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:0.6rem;line-height:16px;text-align:center;
  cursor:pointer;z-index:5;
  border:none;padding:0;
}
.bt.delete-mode .bt-del{display:block;}
.bt.delete-mode{border-color:var(--red);background:var(--red-lt);}

/* ── BIGGER PROGRESSION SUMMARY ── */
.ps-chord{font-size:1.05rem;font-weight:700;background:#fff;border:1px solid #b7dfca;border-radius:6px;padding:5px 10px;line-height:1;min-width:52px;text-align:center;}
.ps-beat{font-size:0.5rem;color:var(--text3);margin-top:2px;}
.ps-sh{font-size:0.46rem;color:var(--green);white-space:nowrap;}
.ps-arrow{color:var(--text3);font-size:0.75rem;}

/* ── DISSONANCE BADGE ── */
.dis-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:0.44rem;font-weight:600;letter-spacing:0.4px;
  border-radius:3px;padding:2px 5px;margin-top:3px;
  border:1px solid transparent;
}
.dis-consonant{background:#e6f4ea;border-color:#b7dfca;color:#1e8a4a;}
.dis-tension  {background:#fff8e1;border-color:#ffe082;color:#b45309;}
.dis-dischord {background:#fdecea;border-color:#f5a0a0;color:#b03030;}

/* Card border tint by dissonance */
.ch-card.dis-c{border-left:3px solid #1e8a4a;}
.ch-card.dis-t{border-left:3px solid #e08c00;}
.ch-card.dis-d{border-left:3px solid #c0392b;}

/* Legend strip */
.dis-legend{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:4px 0 6px;margin-bottom:4px;
  border-bottom:1px solid var(--border);
}
.dis-legend-item{
  display:flex;align-items:center;gap:4px;
  font-size:0.54rem;color:var(--text3);
}
.dl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dl-green{background:#1e8a4a;}
.dl-amber{background:#e08c00;}
.dl-red  {background:#c0392b;}
.ch-inv{
  font-size:0.42rem;letter-spacing:0.5px;
  background:#f0f4ff;border:1px solid #c0d0f0;
  color:var(--accent);border-radius:2px;
  padding:1px 4px;margin-top:3px;display:inline-block;
}
.ch-card.sel .ch-inv{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);}
.kb-hint{text-align:center;font-size:0.5rem;letter-spacing:1.5px;text-transform:uppercase;color:#6b7280;margin-bottom:4px;}
.kb-row{display:flex;justify-content:center;gap:4px;margin-bottom:4px;}
.kb-row:last-child{margin-bottom:0;}

/* ── BOTTOM ROW: TAB + SPACEBAR ── */
.kb-row-bottom{
  display:flex;
  justify-content:center;
  gap:4px;
  margin-bottom:0;
  padding:2px 4px 0;
}
.k-tab{
  flex:0 0 48px;
  background:#d1d5db;
  color:var(--text2);
  font-size:0.7rem;
  font-weight:700;
  max-width:48px;
  height:38px;
}
.k-tab-back{
  flex:0 0 48px;
  background:#d1d5db;
  color:var(--text2);
  font-size:0.7rem;
  font-weight:700;
  max-width:48px;
  height:38px;
}
.k-space{
  flex:1;
  max-width:none;
  height:38px;
  background:#ffffff;
  border:none;
  border-radius:5px;
  box-shadow:0 2px 0 #aaa;
  position:relative;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-touch-callout:none;
  transition:background 0.06s,box-shadow 0.06s,transform 0.06s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.k-space:active,.k-space.pressed{
  background:#e8e8e8;
  box-shadow:0 0 0 #aaa;
  transform:translateY(1px);
}
.k-space-label{
  font-size:0.52rem;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:#aaa;
  font-weight:500;
}
.k-space-bar{
  width:44%;
  height:2px;
  background:#ccc;
  border-radius:2px;
}
.k-space-sub{
  font-size:0.38rem;
  letter-spacing:1px;
  color:#ccc;
  text-transform:uppercase;
}

/* key base */
.k{
  background:#fff;border:none;border-radius:5px;
  box-shadow:var(--ks);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:0.8rem;font-weight:500;color:var(--text);
  cursor:pointer;height:40px;flex:1;min-width:0;max-width:46px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-touch-callout:none;
  transition:background 0.06s,box-shadow 0.06s,transform 0.06s;
  position:relative;
}
.k:active,.k.pressed{background:#d0d5db;box-shadow:0 0 0 #aaa;transform:translateY(1px);}
.k .ksub{font-size:0.38rem;color:#888;line-height:1;margin-top:1px;}

/* special keys */
.k-slash{background:#e8f0fe;color:var(--accent);font-size:1.1rem;font-weight:700;max-width:40px;}
.k-sep{background:#f3e8ff;color:#7c3aed;max-width:50px;}
.k-del{background:#fee2e2;color:var(--red);font-size:1rem;max-width:46px;}
.k-del:active{background:#fca5a5;}
.k-go{background:var(--accent);color:#fff;font-size:0.65rem;font-weight:700;letter-spacing:0.5px;max-width:60px;}
.k-go:active{background:#1557b0;}
.k-action{background:#d1d5db;color:var(--text2);font-size:0.65rem;max-width:50px;}
.k-done{background:var(--green);color:#fff;font-size:0.65rem;font-weight:700;max-width:54px;}
.k-done:active{background:#155d34;}
.k-sharp{font-size:0.68rem;}

/* edit mode keyboard highlight */
.kb-wrap.edit-mode .k-go{background:#6b21a8;} /* purple when editing */

/* ── UNDO/REDO ── */
.k-undo{background:#e0e7ff;color:#3730a3;font-size:0.75rem;max-width:44px;}
.k-undo:active{background:#c7d2fe;}
.k-undo.disabled{opacity:0.35;pointer-events:none;}

/* ── EDIT FIELD SELECTOR in banner ── */
.eb-fields{display:flex;gap:6px;margin-left:8px;}
.eb-field-btn{
  background:var(--white);border:1.5px solid var(--border);
  border-radius:5px;padding:3px 10px;
  font-size:0.72rem;font-weight:600;cursor:pointer;
  transition:all 0.1s;color:var(--text2);
}
.eb-field-btn.active-mel{border-color:var(--amber);background:#fff8e1;color:var(--amber);}
.eb-field-btn.active-bas{border-color:var(--accent);background:var(--accent-lt);color:var(--accent);}
.eb-field-btn:active{transform:scale(0.95);}

/* ── GENRE FINDER ── */
.genre-section{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;}
.genre-title{font-size:0.72rem;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.genre-title::before{content:'🎵';font-size:0.9rem;}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.genre-card{
  background:var(--white);border:1.5px solid var(--border);
  border-radius:8px;padding:10px 12px;cursor:pointer;
  transition:all 0.12s;
}
.genre-card:active{transform:scale(0.97);}
.genre-card.active{border-color:var(--accent);background:var(--accent-lt);}
.gc-name{font-size:0.78rem;font-weight:700;color:var(--text);}
.gc-desc{font-size:0.56rem;color:var(--text3);margin-top:2px;}
.genre-result{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:12px;margin-top:8px;display:none;
}
.genre-result.open{display:block;}
.gr-header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.gr-key{font-size:1rem;font-weight:700;color:var(--accent);}
.gr-scale{font-size:0.6rem;color:var(--text3);letter-spacing:0.5px;}
.gr-genre{font-size:0.65rem;font-weight:600;color:var(--green);background:var(--green-lt);border-radius:10px;padding:2px 8px;}
.gr-prog-label{font-size:0.58rem;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.gr-prog{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.gr-chord{
  background:var(--bg);border:1px solid var(--border);
  border-radius:5px;padding:5px 9px;
  font-size:0.82rem;font-weight:700;color:var(--text);
}
.gr-chord .grc-degree{font-size:0.45rem;color:var(--text3);display:block;text-align:center;margin-top:1px;}
.gr-chord .grc-dis{font-size:0.42rem;display:block;text-align:center;}
.gr-chord.dis-c .grc-dis{color:var(--green);}
.gr-chord.dis-t .grc-dis{color:var(--amber);}
.gr-chord.dis-d .grc-dis{color:var(--red);}

/* Harmonic function badge */
.hf-badge{
  font-size:0.42rem;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;margin-top:3px;display:inline-block;
  text-align:center;
}
.hf-tonic   {background:#e6f4ea;color:#1e8a4a;border:1px solid #b7dfca;}
.hf-subdom  {background:#fff8e1;color:#b45309;border:1px solid #ffe082;}
.hf-dominant{background:#fdecea;color:#b03030;border:1px solid #f5a0a0;}
.hf-passing {background:#f0f0f0;color:#888;border:1px solid #ddd;}

/* Position label on chord box */
.pos-label{
  font-size:0.4rem;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.0); /* invisible by default */
  margin-bottom:2px;text-align:center;
}
.gr-chord .pos-label{color:var(--text3);}

/* Note pills inside genre chord cards */
.gr-chord-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:4px;}
.gr-note-pill{
  font-family:'Courier New',monospace;
  font-size:0.62rem;font-weight:600;
  padding:2px 5px;border-radius:3px;
  background:var(--bg);border:1px solid var(--border);
  color:var(--text2);
}
.gr-note-pill.is-mel{border-color:var(--amber);color:var(--amber);background:#fff8e1;}
.gr-note-pill.is-bas{border-color:var(--accent);color:var(--accent);background:var(--accent-lt);}
.gr-note-pill.is-both{border-color:var(--green);color:var(--green);background:var(--green-lt);}

/* Alt chip play button */
.gr-alt-chip{
  flex-shrink:0;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap;
  transition:all 0.12s;
  display:flex;align-items:center;gap:6px;
}
.gr-alt-chip:active{background:var(--accent-lt);border-color:var(--accent);}
.gr-alt-chip-info{display:flex;flex-direction:column;gap:1px;}
.gr-alt-chip-play{
  background:var(--accent);color:#fff;
  border:none;border-radius:4px;
  width:22px;height:22px;min-width:22px;
  font-size:0.6rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background 0.1s;
}
.gr-alt-chip-play:active{background:#1557b0;}

/* Melody note in practice overlay */
.pm-melody-row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:6px;

<script>
// ═══════════════ MUSIC ENGINE ═══════════════
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ALIASES={Db:'C#',Eb:'D#',Fb:'E',Gb:'F#',Ab:'G#',Bb:'A#',Cb:'B'};
const resolve=n=>n==='_'?'_':(ALIASES[n]||n);

const CHORD_TYPES=[
  {s:'',l:'Major',i:[0,4,7]},{s:'m',l:'Minor',i:[0,3,7]},
  {s:'dim',l:'Dim',i:[0,3,6]},{s:'aug',l:'Aug',i:[0,4,8]},
  {s:'sus2',l:'Sus2',i:[0,2,7]},{s:'sus4',l:'Sus4',i:[0,5,7]},
  {s:'maj7',l:'Maj7',i:[0,4,7,11]},{s:'7',l:'Dom7',i:[0,4,7,10]},
  {s:'m7',l:'Min7',i:[0,3,7,10]},{s:'m(maj7)',l:'mMaj7',i:[0,3,7,11]},
  {s:'dim7',l:'Dim7',i:[0,3,6,9]},{s:'m7b5',l:'½Dim',i:[0,3,6,10]},
  {s:'6',l:'Maj6',i:[0,4,7,9]},{s:'m6',l:'Min6',i:[0,3,7,9]},
  {s:'maj9',l:'Maj9',i:[0,4,7,11,14]},{s:'9',l:'Dom9',i:[0,4,7,10,14]},
  {s:'m9',l:'Min9',i:[0,3,7,10,14]},{s:'add9',l:'Add9',i:[0,4,7,14]},
  {s:'11',l:'Dom11',i:[0,4,7,10,14,17]},{s:'m11',l:'Min11',i:[0,3,7,10,14,17]},
  {s:'13',l:'Dom13',i:[0,4,7,10,14,17,21]},
];
const ALL_CHORDS=(()=>{
  const out=[];
  for(const root of NOTES){
    const ri=NOTES.indexOf(root);
    for(const t of CHORD_TYPES){
      const notes=t.i.map(x=>NOTES[(ri+x)%12]);
      out.push({name:root+t.s,label:t.l,root,notes,noteSet:new Set(notes)});
    }
  }
  return out;
})();
// Bass note = ROOT of the chord (natural position or inversion)
// Returns chords where: root === bass AND melody note is in the chord
function findChords(mel, bas){
  const m = resolve(mel), b = resolve(bas);

  // Both wildcards → all chords
  if(m==='_' && b==='_') return ALL_CHORDS.map(withDisplay);

  // Bass wildcard → just needs melody note in chord, any root
  if(b==='_') return ALL_CHORDS
    .filter(c => m==='_' || c.noteSet.has(m))
    .map(withDisplay);

  // Bass is the ROOT: only chords whose root === bass AND contain melody
  return ALL_CHORDS
    .filter(c => {
      if(c.root !== b) return false;
      if(m==='_') return true;
      return c.noteSet.has(m);
    })
    .map(withDisplay);
}

// All returned chords have root === bass by construction — no slash notation needed
function withDisplay(chord){ return chord; }

function common(a,b){return[...a.noteSet].filter(n=>b.noteSet.has(n));}

// ═══════════════ DISSONANCE ENGINE ═══════════════
// Measures how the melody note sits against a chord.
// Returns {level:'consonant'|'tension'|'dischord', reason:string, interval:number}
//
// Interval classifications (melody vs root, in semitones 0–11):
//   0  = unison        → consonant
//   1  = min 2nd       → dischord  (harsh clash against root)
//   2  = maj 2nd       → tension   (suspended/added 2nd feel)
//   3  = min 3rd       → consonant (chord tone)
//   4  = maj 3rd       → consonant (chord tone)
//   5  = perfect 4th   → tension   (sus4 territory)
//   6  = tritone       → dischord  (devil's interval)
//   7  = perfect 5th   → consonant (chord tone)
//   8  = min 6th       → tension   (aug chord colour)
//   9  = maj 6th       → consonant (colour tone)
//  10  = min 7th       → tension   (dominant feel, resolved in 7th chords)
//  11  = maj 7th       → tension   (leading tone; dischord if chord is plain major)

const INTERVAL_NAMES={0:'unison',1:'b2nd',2:'2nd',3:'b3rd',4:'3rd',5:'4th',
                       6:'tritone',7:'5th',8:'b6th',9:'6th',10:'b7th',11:'7th'};

function dissonanceScore(melNote, chord){
  const m = resolve(melNote);
  if(m==='_') return {level:'consonant', reason:'wildcard', interval:-1};

  const rootIdx = NOTES.indexOf(chord.root);
  const melIdx  = NOTES.indexOf(m);
  if(rootIdx<0||melIdx<0) return {level:'consonant', reason:'unknown', interval:-1};

  const interval = (melIdx - rootIdx + 12) % 12;
  const intName  = INTERVAL_NAMES[interval] || 'ext';

  // Is the melody note actually a chord tone?
  const isChordTone = chord.noteSet.has(m);

  // Context: does the chord type already "own" the tension?
  const chordName = chord.name;
  const is7th   = /7|maj7|m7|dim7|m7b5|mMaj7/.test(chord.label);
  const is9th   = /9|add9|madd9/.test(chord.label);
  const is11th  = /11/.test(chord.label);
  const isSus   = /sus/.test(chord.label);
  const isDim   = /Dim/.test(chord.label);
  const isAug   = /Aug/.test(chord.label);

  // Rule table
  if(interval === 0) return {level:'consonant', reason:'mel = root (unison)', interval};
  if(interval === 7) return {level:'consonant', reason:'perfect 5th', interval};
  if(interval === 3 || interval === 4) return {level:'consonant', reason:'3rd — chord tone', interval};
  if(interval === 9) return {level:'consonant', reason:'6th — colour tone', interval};

  if(interval === 6){
    // Tritone: dischord unless it's a dim or dom7 where it's structural
    if(isDim || (is7th && !chord.label.includes('maj7')))
      return {level:'tension', reason:'tritone (structural in '+chord.label+')', interval};
    return {level:'dischord', reason:'tritone — clashes with root', interval};
  }

  if(interval === 1)
    return {level:'dischord', reason:'minor 2nd — harsh clash', interval};

  if(interval === 2){
    if(is9th || isSus)
      return {level:'tension', reason:'2nd (fits '+chord.label+')', interval};
    return {level:'tension', reason:'major 2nd — suspended feel', interval};
  }

  if(interval === 5){
    if(isSus)
      return {level:'consonant', reason:'4th (structural in sus4)', interval};
    return {level:'tension', reason:'4th — sus territory', interval};
  }

  if(interval === 8){
    if(isAug)
      return {level:'tension', reason:'aug 5th (structural in '+chord.label+')', interval};
    return {level:'tension', reason:'b6th — chromatic colour', interval};
  }

  if(interval === 10){
    if(is7th||is9th||is11th)
      return {level:'consonant', reason:'b7th (structural in '+chord.label+')', interval};
    return {level:'tension', reason:'b7th — dominant pull', interval};
  }

  if(interval === 11){
    if(chordName.includes('maj7')||chordName.includes('mMaj7'))
      return {level:'consonant', reason:'maj7th (chord tone)', interval};
    return {level:'tension', reason:'maj 7th — leading tone tension', interval};
  }

  return {level:'consonant', reason:intName, interval};
}

// ═══════════════ BEAT MODEL ═══════════════
// beats = [{mel: string|null, bas: string|null}]
// cursor = index in beats array (insert position), or null if editing existing
// editIdx = index of beat being edited, null if appending

const VALID_NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B',
                   'Db','Eb','Gb','Ab','Bb','_'];

let beats = [];          // array of {mel, bas}
let cursorPos = 0;       // insert cursor between beats (0 = before first)
let editIdx = null;      // null = append mode, number = editing that beat
let editField = null;    // 'mel' or 'bas' — which field we're filling when editing
let beatResults = [];
let selections = {};
let meta = {title:'',key:'',tempo:'',time:''};

function isValidNote(n){
  if(!n) return false;
  if(n==='_') return true;
  const cap=n.charAt(0).toUpperCase()+n.slice(1);
  return VALID_NOTES.includes(cap);
}

// ═══════════════ UNDO / REDO ═══════════════
const undoStack = [];  // snapshots of beats[] before each mutation
const redoStack = [];
const MAX_HISTORY = 40;

function snapshot(){
  undoStack.push(JSON.stringify(beats));
  if(undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0; // clear redo on new action
  updateUndoButtons();
}

function doUndo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(beats));
  beats = JSON.parse(undoStack.pop());
  cursorPos = Math.min(cursorPos, beats.length);
  if(editIdx !== null && editIdx >= beats.length) finishEdit();
  markStale(); render(); updateUndoButtons();
  showToast('Undone','');
}

function doRedo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(beats));
  beats = JSON.parse(redoStack.pop());
  cursorPos = Math.min(cursorPos, beats.length);
  markStale(); render(); updateUndoButtons();
  showToast('Redone','');
}

function updateUndoButtons(){
  const u=document.getElementById('undoBtn');
  const r=document.getElementById('redoBtn');
  if(u) u.style.opacity=undoStack.length?'1':'0.35';
  if(r) r.style.opacity=redoStack.length?'1':'0.35';
}

// ═══════════════ KEYBOARD BUILD ═══════════════
function buildKeyboard(){
  // Row 1: natural notes + _ + /
  const r1=document.getElementById('kbRow1');
  ['C','D','E','F','G','A','B'].forEach(n=>r1.appendChild(mk(n,()=>typeNote(n))));
  r1.appendChild(mk('_',()=>typeNote('_'),'k','rest'));
  r1.appendChild(mk('/',()=>typeSlash(),'k k-slash'));

  // Row 2: sharps/flats
  const r2=document.getElementById('kbRow2');
  ['C#','D#','F#','G#','A#'].forEach(n=>r2.appendChild(mk(n,()=>typeNote(n),'k k-sharp')));
  ['Bb','Eb','Ab','Db'].forEach(n=>r2.appendChild(mk(n,()=>typeNote(n),'k k-sharp')));

  // Row 3: actions
  const r3=document.getElementById('kbRow3');
  r3.appendChild(mk('•',()=>typeSep(),'k k-sep','beat'));
  r3.appendChild(mk('⌫',()=>doBackspace(),'k k-del'));
  r3.appendChild(mk('↩',()=>doUndo(),'k k-undo','undo'));
  r3.appendChild(mk('↪',()=>doRedo(),'k k-undo','redo'));
  r3.appendChild(mk('CLR',()=>clearAll(),'k k-action'));
  r3.appendChild(mk('DEMO',()=>loadDemo(),'k k-action'));
  // Row 4: ← tab  →tab  [    spacebar    ]
  const r4=document.getElementById('kbRow4');

  // Backward tab
  r4.appendChild(mk('⇤',()=>typeTabBack(),'k k-tab-back','back'));

  // Forward tab
  r4.appendChild(mk('⇥',()=>typeTab(),'k k-tab','fwd'));

  // Spacebar (wide)
  const spaceBtn=document.createElement('button');
  spaceBtn.className='k-space';
  spaceBtn.innerHTML=
    '<span class="k-space-label">space</span>'+
    '<span class="k-space-bar"></span>'+
    '<span class="k-space-sub">commit beat</span>';
  spaceBtn.addEventListener('touchstart',e=>{e.preventDefault();spaceBtn.classList.add('pressed');typeSpace();},{passive:false});
  spaceBtn.addEventListener('touchend',e=>{e.preventDefault();spaceBtn.classList.remove('pressed');},{passive:false});
  spaceBtn.addEventListener('mousedown',e=>{e.preventDefault();typeSpace();});
  r4.appendChild(spaceBtn);
}

function mk(label,action,cls,sub){
  const b=document.createElement('button');
  b.className='k '+(cls||'');
  b.textContent=label;
  if(sub){const s=document.createElement('span');s.className='ksub';s.textContent=sub;b.appendChild(s);}
  b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('pressed');action();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();b.classList.remove('pressed');},{passive:false});
  b.addEventListener('mousedown',e=>{e.preventDefault();action();});
  return b;
}

// ═══════════════ TYPING LOGIC ═══════════════
// State machine:
// editIdx=null → APPEND mode: building a new beat at cursorPos
//   pendingMel = typed melody so far (before slash)
//   pendingBas = typed bass so far (after slash)
//   slashTyped = has / been typed
// editIdx=N → EDIT mode: editing beats[N]
//   editField = 'mel' | 'bas'

let pendingMel = null;  // string being typed for melody
let pendingBas = null;
let slashTyped = false;

function typeNote(note){
  if(editIdx !== null){
    // EDIT MODE
    snapshot();
    if(editField === 'mel'){
      beats[editIdx].mel = note;
      if(!beats[editIdx].bas || beats[editIdx].bas==='_'){
        editField = 'bas';
        updateEditBanner();
      } else {
        finishEdit();
      }
    } else {
      beats[editIdx].bas = note;
      finishEdit();
    }
    render();
    markStale();
    return;
  }

  // APPEND MODE — auto-advance: first tap = melody, second tap = bass → commit
  if(!slashTyped && pendingMel === null){
    // no melody yet — this is the melody note
    pendingMel = note;
    slashTyped = false;
    updateStatusStrip();
    render();
  } else if(!slashTyped && pendingMel !== null){
    // melody already set, slash not typed — treat this tap as bass (auto-advance)
    pendingBas = note;
    commitPendingBeat();
  } else {
    // slashTyped = true — explicit slash was used, so this is definitely bass
    pendingBas = note;
    commitPendingBeat();
  }
}

function typeSlash(){
  if(editIdx !== null){
    editField = 'bas';
    updateEditBanner();
    render();
    return;
  }
  if(pendingMel !== null){
    slashTyped = true;
    updateStatusStrip();
    render();
  }
}

function typeSep(){
  if(editIdx !== null){ finishEdit(); return; }
  if(slashTyped && pendingBas){
    commitPendingBeat();
  } else if(pendingMel){
    // commit melody-only beat (bass defaults to _ = inferred by engine)
    snapshot();
    beats.splice(cursorPos,0,{mel:pendingMel, bas:'_'});
    cursorPos++;
    resetPending();
    markStale();
    render();
  } else {
    if(cursorPos < beats.length) cursorPos++;
    render();
  }
}

// Space = commit current pending beat (same as •), or if nothing pending, just move past
function typeSpace(){
  if(editIdx !== null){ finishEdit(); return; }
  if(pendingMel){
    // commit whatever is typed so far
    if(slashTyped && pendingBas){
      commitPendingBeat();
    } else {
      // melody only — commit with _ bass
      snapshot();
      beats.splice(cursorPos,0,{mel:pendingMel, bas:'_'});
      cursorPos++;
      resetPending();
      markStale();
      render();
    }
  } else {
    // nothing pending — advance cursor one step (same as tab but softer)
    if(cursorPos < beats.length){ cursorPos++; render(); }
  }
}

// Tab forward = skip cursor one beat forward, wrap at end
function typeTab(){
  if(editIdx !== null){ finishEdit(); return; }
  if(pendingMel){
    if(slashTyped && pendingBas){
      commitPendingBeat();
    } else {
      snapshot();
      beats.splice(cursorPos,0,{mel:pendingMel, bas:'_'});
      cursorPos++;
      resetPending();
      markStale();
      render();
    }
    return;
  }
  if(cursorPos < beats.length){
    cursorPos++;
  } else {
    cursorPos=0;
  }
  render(false);
  showToast('→ beat '+(cursorPos+1),'');
}

// Tab backward = move cursor one beat back, wrap at start
function typeTabBack(){
  if(editIdx !== null){ finishEdit(); return; }
  if(pendingMel){
    // drop pending rather than commit when going backwards
    resetPending();
    render();
  }
  if(cursorPos > 0){
    cursorPos--;
  } else {
    cursorPos=beats.length; // wrap to end
  }
  render(false);
  showToast('← beat '+(cursorPos+1),'');
}

function commitPendingBeat(){
  snapshot();
  const b = {
    mel: pendingMel || '_',
    bas: pendingBas || '_'
  };
  beats.splice(cursorPos, 0, b);
  cursorPos++;
  resetPending();
  markStale();
  render();
}

function resetPending(){
  pendingMel=null; pendingBas=null; slashTyped=false;
  updateStatusStrip();
}

function doBackspace(){
  if(editIdx !== null){
    if(editField==='bas'){
      beats[editIdx].bas=null;
      editField='bas';
    } else {
      beats[editIdx].mel=null;
      editField='mel';
    }
    updateEditBanner();
    markStale();
    render();
    return;
  }
  // APPEND: clear pending first
  if(pendingBas){ pendingBas=null; updateStatusStrip(); render(); return; }
  if(slashTyped){ slashTyped=false; updateStatusStrip(); render(); return; }
  if(pendingMel){ pendingMel=null; updateStatusStrip(); render(); return; }
  // delete the beat just before cursor
  if(cursorPos > 0){
    snapshot();
    cursorPos--;
    beats.splice(cursorPos,1);
    markStale();
    render();
  }
}

// Delete a specific beat by index (from long-press)
function deleteBeat(idx){
  snapshot();
  beats.splice(idx,1);
  if(cursorPos > idx) cursorPos--;
  if(editIdx===idx){ editIdx=null; editField=null; document.getElementById('editBanner').classList.remove('open'); document.getElementById('kbWrap').classList.remove('edit-mode'); }
  else if(editIdx!==null && editIdx>idx) editIdx--;
  markStale();
  render();
}

function markStale(){
  // If results are showing, pulse the GO button to signal they need refresh
  if(document.getElementById('resultsArea').style.display!=='none'){
    document.getElementById('analyseBtn').classList.add('stale');
  }
}

// ── STATUS STRIP ──
function updateStatusStrip(){
  const el=document.getElementById('ksPending');
  const hint=document.getElementById('ksHint');
  if(editIdx!==null){
    const b=beats[editIdx];
    el.innerHTML=`<span class="ks-mel">${b.mel||'?'}</span><span class="ks-sl">/</span><span class="ks-bas">${b.bas||'?'}</span>`;
    hint.textContent=editField==='mel'?'tap melody note':`tap bass note (root)`;
    return;
  }
  if(!pendingMel){
    el.innerHTML='<span class="ks-caret"></span>';
    hint.textContent='tap a melody note · bass is optional';
    return;
  }
  if(!slashTyped){
    el.innerHTML=`<span class="ks-mel">${pendingMel}</span>`;
    hint.textContent='tap • to commit · or / to add bass root';
  } else {
    el.innerHTML=`<span class="ks-mel">${pendingMel}</span><span class="ks-sl">/</span><span class="ks-caret"></span>`;
    hint.textContent='tap bass note (chord root)';
  }
}

function clearAll(){
  snapshot();
  beats=[]; beatResults=[]; selections={};
  cursorPos=0; editIdx=null; editField=null;
  resetPending(); // resetPending calls updateStatusStrip
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('analyseBtn').classList.remove('stale');
  render();
}

// ═══════════════ EDIT EXISTING BEAT ═══════════════
function startEdit(idx){
  // If we have pending typing, commit it first
  if(pendingMel || slashTyped) commitOrDropPending();

  editIdx = idx;
  // Decide which field needs editing
  const b = beats[idx];
  if(!b.mel || b.mel==='_') editField='mel';
  else if(!b.bas || b.bas==='_') editField='bas';
  else editField='mel'; // both present → re-edit melody first

  updateEditBanner();
  render(false); // don't jump scroll when editing existing beat
  showToast(`Editing beat ${idx+1}`, '');
}

function finishEdit(){
  editIdx=null; editField=null;
  document.getElementById('editBanner').classList.remove('open');
  document.getElementById('kbWrap').classList.remove('edit-mode');
  document.getElementById('kbHint').textContent='tap any beat to edit · • to add next beat';
  updateStatusStrip();
  render();
}

function cancelEdit(){ finishEdit(); }

function commitOrDropPending(){
  if(pendingMel && slashTyped && pendingBas){
    commitPendingBeat();
  } else if(pendingMel && slashTyped){
    // melody + slash typed but no bass yet — commit with bass wildcard
    beats.splice(cursorPos,0,{mel:pendingMel, bas:'_'});
    cursorPos++;
    resetPending();
  } else if(pendingMel){
    // melody only — commit with bass wildcard
    beats.splice(cursorPos,0,{mel:pendingMel, bas:'_'});
    cursorPos++;
    resetPending();
  } else {
    resetPending();
  }
}

function switchEditField(field){
  if(editIdx===null) return;
  editField=field;
  updateEditBanner();
}

function updateEditBanner(){
  const banner=document.getElementById('editBanner');
  document.getElementById('ebBeat').textContent=`#${editIdx+1}`;
  banner.classList.add('open');
  document.getElementById('kbWrap').classList.add('edit-mode');
  // Highlight active field button
  const mb=document.getElementById('ebMelBtn');
  const bb=document.getElementById('ebBasBtn');
  mb.className='eb-field-btn'+(editField==='mel'?' active-mel':'');
  bb.className='eb-field-btn'+(editField==='bas'?' active-bas':'');
  document.getElementById('kbHint').textContent=
    editField==='mel'?`Tap new melody note for beat ${editIdx+1}`
                     :`Tap new bass note (root) for beat ${editIdx+1}`;
  updateStatusStrip();
}

// ═══════════════ RENDER ═══════════════
function render(scroll){
  renderBeatsDisplay();
  renderPills();
  updateAnalyseBtn();
  // only scroll to bottom when actively appending, not when editing
  if(scroll !== false && editIdx === null){
    const da=document.getElementById('docArea');
    da.scrollTop=da.scrollHeight;
  }
}

function renderBeatsDisplay(){
  const el=document.getElementById('beatsDisplay');
  el.innerHTML='';

  if(beats.length===0 && !pendingMel){
    el.innerHTML='<span style="color:#ccc;font-style:italic;font-size:1rem">Type your melody…<br><small style="font-size:0.75rem">C • E • G • A  —  bass note optional<br>tap • to commit each note</small></span>';
    return;
  }

  beats.forEach((b,i)=>{
    // cursor before this beat
    if(editIdx===null && cursorPos===i){
      el.appendChild(makeCursor());
      // show pending
      if(pendingMel || slashTyped) el.appendChild(makePendingToken());
    }

    const tok=document.createElement('span');
    tok.className='bt';
    if(editIdx===i) tok.classList.add('selected');
    if((b.mel&&!isValidNote(b.mel))||(b.bas&&!isValidNote(b.bas))) tok.classList.add('has-error');

    const melOk = b.mel && isValidNote(b.mel) && b.mel !== '_';
    const basOk = b.bas && isValidNote(b.bas) && b.bas !== '_';

    const mSpan=document.createElement('span');
    mSpan.className = melOk ? 'bm' : 'bmissing';
    mSpan.textContent = b.mel || '?';

    tok.appendChild(mSpan);

    // Only show slash + bass if bass is set
    if(basOk || (b.bas && b.bas !== '_')){
      const sSpan=document.createElement('span');
      sSpan.className='bs'; sSpan.textContent='/';
      const bSpan=document.createElement('span');
      bSpan.className = basOk ? 'bb' : 'bmissing';
      bSpan.textContent = b.bas || '?';
      tok.appendChild(sSpan); tok.appendChild(bSpan);
    }

    // Delete button (shown on long-press)
    const delBtn=document.createElement('button');
    delBtn.className='bt-del';
    delBtn.textContent='×';
    delBtn.addEventListener('click',e=>{e.stopPropagation();tok.classList.remove('delete-mode');deleteBeat(i);});
    delBtn.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();tok.classList.remove('delete-mode');deleteBeat(i);});
    tok.appendChild(delBtn);

    // Long-press to show delete
    let longPressTimer=null;
    const startLP=()=>{longPressTimer=setTimeout(()=>{tok.classList.add('delete-mode');},420);};
    const cancelLP=()=>{clearTimeout(longPressTimer);};
    tok.addEventListener('touchstart',e=>{cancelLP();startLP();},{passive:true});
    tok.addEventListener('touchend',e=>{cancelLP();});
    tok.addEventListener('touchmove',e=>{cancelLP();},{passive:true});
    tok.addEventListener('mousedown',e=>{cancelLP();startLP();});
    tok.addEventListener('mouseup',cancelLP);
    tok.addEventListener('mouseleave',cancelLP);

    // Tap = edit (only if not in delete mode)
    tok.addEventListener('click',e=>{if(tok.classList.contains('delete-mode')){tok.classList.remove('delete-mode');return;}startEdit(i);});
    tok.addEventListener('touchend',e=>{
      if(tok.classList.contains('delete-mode')) return;
      e.preventDefault();startEdit(i);
    });
    el.appendChild(tok);

    // separator dot between beats
    if(i < beats.length-1){
      const sep=document.createElement('span');
      sep.className='bt-sep'; sep.textContent='•';
      el.appendChild(sep);
    }
  });

  // cursor at end
  if(editIdx===null && cursorPos===beats.length){
    // show pending token if any
    if(pendingMel || slashTyped) el.appendChild(makePendingToken());
    el.appendChild(makeCursor());
  }
}

function makeCursor(){
  const c=document.createElement('span');
  c.className='bt-cursor';
  return c;
}

function makePendingToken(){
  const tok=document.createElement('span');
  tok.className='bt selected';
  tok.style.opacity='0.7';

  const mSpan=document.createElement('span');
  mSpan.className='bm';
  mSpan.textContent=pendingMel||'';

  if(slashTyped){
    const sSpan=document.createElement('span');
    sSpan.className='bs'; sSpan.textContent='/';
    const bSpan=document.createElement('span');
    bSpan.className='bb';
    bSpan.textContent=pendingBas||'';
    tok.appendChild(mSpan); tok.appendChild(sSpan); tok.appendChild(bSpan);
  } else {
    tok.appendChild(mSpan);
  }
  return tok;
}

function renderPills(){
  const row=document.getElementById('pillRow');
  row.innerHTML='';
  // Accept beats with at least a valid melody note (bass optional)
  const valid=beats.filter(b=>b.mel&&isValidNote(b.mel)&&b.mel!=='_');
  if(!valid.length) return;
  valid.forEach(b=>{
    const p=document.createElement('div');
    p.className='pill';
    const hasBas = b.bas && b.bas!=='_' && isValidNote(b.bas);
    if(hasBas){
      p.innerHTML=`<span class="pm">${b.mel}</span><span class="ps">/</span><span class="pb">${b.bas}</span>`;
    } else {
      p.innerHTML=`<span class="pm">${b.mel}</span>`;
    }
    row.appendChild(p);
  });
  const cnt=document.createElement('div');
  cnt.className='pill-count';
  cnt.textContent=valid.length+(valid.length===1?' beat':' beats');
  row.appendChild(cnt);
}

function updateAnalyseBtn(){
  // Bass is optional — just need at least one valid melody note
  const hasMel = beats.some(b => b.mel && isValidNote(b.mel) && b.mel !== '_');
  document.getElementById('analyseBtn').disabled = !hasMel;
}

// ═══════════════ ANALYSIS ═══════════════
function runAnalysis(){
  if(editIdx!==null) finishEdit();
  document.getElementById('analyseBtn').classList.remove('stale');

  // Accept beats that have at least a melody note
  const valid=beats.filter(b=>b.mel && isValidNote(b.mel) && b.mel!=='_');
  if(!valid.length){showToast('Add some melody notes first','warn');return;}

  // Detect key from melody notes (ignore _ bass for key detection)
  const melNotes=valid.map(b=>b.mel);
  const keyInfo=detectKey(melNotes);

  // For each beat: if bass is given use it directly (locked mode)
  // If bass is _ (melody only), infer the best bass from key context
  const genre=GENRES.find(g=>g.id===selectedGenre)||GENRES[0];
  const vocab=buildVocab(keyInfo.root, keyInfo.scale, genre);

  selections={};
  beatResults=valid.map((b,i)=>{
    const hasBass = b.bas && b.bas!=='_' && isValidNote(b.bas);

    if(hasBass){
      // User specified bass — use exact chord finder (bass = root)
      return {
        idx:i, mel:b.mel, bas:b.bas,
        bassLocked:true,
        chords:findChords(b.mel, b.bas)
      };
    } else {
      // Melody only — infer bass from genre vocab
      // Find all genre vocab chords containing this melody note
      const candidates=vocab.filter(entry=>
        b.mel==='_' || entry.chord.noteSet.has(resolve(b.mel))
      );
      // Score them with no prevChord yet (will be updated in chain below)
      return {
        idx:i, mel:b.mel, bas:'_',
        bassLocked:false,
        chords: candidates.map(e=>e.chord),
        _vocab: candidates  // keep degree info for display
      };
    }
  });

  // Build chain: auto-select with voice leading + position-aware function scoring
  let prevChord=null;
  const totalBeats=beatResults.length;
  beatResults.forEach((br,i)=>{
    const pool=br.chords;
    if(!pool.length){ selections[i]=null; return; }

    // Determine position
    let pos;
    if(i===0)                    pos=POS.OPEN;
    else if(i===totalBeats-1)    pos=POS.CLOSE;
    else if(i===totalBeats-2)    pos=POS.PENULT;
    else                         pos=POS.MID;

    if(br._vocab){
      const scored=br._vocab.map(e=>({e, sc:scoreChord(e, br.mel, genre, prevChord, pos, totalBeats)}))
        .sort((a,b)=>b.sc-a.sc);
      selections[i]=scored[0].e.chord.name;
      br.inferredBas=scored[0].e.chord.root;
      br.inferredDegree=scored[0].e.degreeLabel;
      br.harmonicFunc=getHarmonicFunction(scored[0].e.degree, genre.scale);
    } else {
      const scored=pool.map(c=>({c, sc:(prevChord?common(prevChord,c).length*4:0)+
        (dissonanceScore(br.mel,c).level==='consonant'?8:dissonanceScore(br.mel,c).level==='tension'?3:-5)}))
        .sort((a,b)=>b.sc-a.sc);
      selections[i]=scored[0].c.name;
    }
    prevChord=ALL_CHORDS.find(c=>c.name===selections[i])||null;
  });

  document.getElementById('resultsArea').style.display='block';
  document.getElementById('resultsSub').textContent=
    (meta.title||'Untitled')+' · '+valid.length+' beat'+(valid.length!==1?'s':'')+
    ' · key: '+keyInfo.root+' '+keyInfo.scale;

  renderBeatBlocks();
  renderProgSummary();   // also calls updatePracticeBtn internally
  updatePracticeBtn();   // explicit call as safety net
  renderGenreFromAnalysis(keyInfo, genre);
  setTimeout(()=>document.getElementById('resultsArea').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

function renderBeatBlocks(){
  const wrap=document.getElementById('beatBlocksWrap');
  wrap.innerHTML='';
  beatResults.forEach((br,bi)=>{
    const block=document.createElement('div');
    block.className='beat-block';
    block.style.animationDelay=(bi*0.04)+'s';

    const hd=document.createElement('div'); hd.className='bb-head';
    const tok=document.createElement('div'); tok.className='bb-tok';
    // Show inferred bass if melody-only beat
    const displayBas = br.inferredBas || (resolve(br.bas)!=='_' ? br.bas : null);
    if(displayBas){
      tok.innerHTML=`${br.mel}<span class="sl">/</span><span class="ba">${displayBas}</span>`;
    } else {
      tok.innerHTML=`${br.mel}`;
    }
    const num=document.createElement('div'); num.className='bb-num';
    num.textContent=`BEAT ${bi+1}`;
    const rootLbl=document.createElement('div');
    rootLbl.style.cssText='font-size:0.52rem;color:#888;letter-spacing:0.5px;';
    if(displayBas){
      rootLbl.textContent=(br.inferredBas?'inferred':'locked')+' root: '+displayBas;
    } else {
      rootLbl.textContent='root: any';
    }
    hd.appendChild(tok); hd.appendChild(num); hd.appendChild(rootLbl);
    if(br.chords.length){
      const cnt=document.createElement('div');cnt.className='bb-cnt';
      cnt.textContent=br.chords.length+' chord'+(br.chords.length!==1?'s':'');
      hd.appendChild(cnt);
    }
    block.appendChild(hd);

    if(!br.chords.length){
      const none=document.createElement('div');
      none.style.cssText='font-size:0.7rem;color:#9ca3af;font-style:italic;padding:3px 0';
      none.textContent=displayBas
        ? `No ${displayBas}-rooted chord contains ${br.mel}.`
        : `No chords found for ${br.mel}.`;
      block.appendChild(none);
      wrap.appendChild(block);
      return;
    }

    const prevKeys=Object.keys(selections).map(Number).filter(k=>k<bi).sort((a,b)=>b-a);
    const prevChord=prevKeys.length?ALL_CHORDS.find(c=>c.name===selections[prevKeys[0]]):null;
    const compatSet=prevChord?new Set(br.chords.filter(c=>common(prevChord,c).length>0).map(c=>c.name)):new Set();

    // Resolve once — use inferred bass when melody-only
    const mel=resolve(br.mel);
    const bas=br.inferredBas || (resolve(br.bas)!=='_' ? resolve(br.bas) : null);

    // Legend
    const legend=document.createElement('div');
    legend.className='dis-legend';
    legend.innerHTML=
      '<div class="dis-legend-item"><div class="dl-dot dl-green"></div>Consonant</div>'+
      '<div class="dis-legend-item"><div class="dl-dot dl-amber"></div>Tension</div>'+
      '<div class="dis-legend-item"><div class="dl-dot dl-red"></div>Dischord</div>';
    block.appendChild(legend);

    const scroll=document.createElement('div'); scroll.className='chord-scroll';
    br.chords.forEach(chord=>{
      const card=document.createElement('div'); card.className='ch-card';
      if(selections[bi]===chord.name) card.classList.add('sel');
      else if(compatSet.has(chord.name)) card.classList.add('compat');

      // Dissonance — computed before card colouring
      const dis=dissonanceScore(br.mel, chord);
      if(!card.classList.contains('sel')){
        if(dis.level==='consonant')    card.classList.add('dis-c');
        else if(dis.level==='tension') card.classList.add('dis-t');
        else                           card.classList.add('dis-d');
      }

      // Name + type
      const cn=document.createElement('div'); cn.className='ch-name';
      cn.textContent=chord.name;
      const cl=document.createElement('div'); cl.className='ch-type';
      cl.textContent=chord.label;

      // Note pills — mel/bas already resolved above
      const nd=document.createElement('div'); nd.className='ch-notes';
      chord.notes.forEach(n=>{
        const p=document.createElement('span'); p.className='ch-note'; p.textContent=n;
        if(bas && n===bas) p.classList.add('nb');
        if(n===mel && (!bas || n!==bas)) p.classList.add('nm');
        nd.appendChild(p);
      });

      // Dissonance badge
      const db=document.createElement('div');
      db.className='dis-badge dis-'+dis.level;
      const dot=dis.level==='consonant'?'🟢':dis.level==='tension'?'🟡':'🔴';
      db.textContent=dot+' '+dis.reason;

      // Interval label (mel vs root)
      const inv=document.createElement('div'); inv.className='ch-inv';
      if(mel!=='_' && bas){
        const rootIdx=NOTES.indexOf(bas);
        const melIdx=NOTES.indexOf(mel);
        if(rootIdx>=0 && melIdx>=0){
          const interval=(melIdx-rootIdx+12)%12;
          inv.textContent='mel: '+(INTERVAL_NAMES[interval]||'ext')+' above root';
        }
      }

      card.appendChild(cn); card.appendChild(cl); card.appendChild(nd);
      card.appendChild(db);
      if(inv.textContent) card.appendChild(inv);

      card.onclick=()=>{selections[bi]=chord.name;renderBeatBlocks();renderProgSummary();};
      scroll.appendChild(card);
    });
    block.appendChild(scroll);
    wrap.appendChild(block);
  });
}

function renderProgSummary(){
  const flow=document.getElementById('psFlow');
  flow.innerHTML='';
  beatResults.forEach((br,i)=>{
    const node=document.createElement('div'); node.className='ps-node';
    const cn=document.createElement('div');
    cn.className='ps-chord'+(selections[i]?'':' unset');
    const selChord = selections[i] ? br.chords.find(c=>c.name===selections[i]) : null;
    cn.textContent = selChord ? selChord.name : (selections[i]||'—');
    const lbl=document.createElement('div'); lbl.className='ps-beat';
    const displayBas2 = br.inferredBas || (br.bas && br.bas!=='_' ? br.bas : null);
    lbl.textContent = displayBas2 ? `${br.mel}/${displayBas2}` : br.mel;
    node.appendChild(cn); node.appendChild(lbl); flow.appendChild(node);
    if(i<beatResults.length-1){
      const aw=document.createElement('div'); aw.className='ps-arr';
      aw.innerHTML='<div class="ps-arrow">→</div>';
      const sA=selections[i]?ALL_CHORDS.find(c=>c.name===selections[i]):null;
      const sB=selections[i+1]?ALL_CHORDS.find(c=>c.name===selections[i+1]):null;
      if(sA&&sB){
        const sh=document.createElement('div'); sh.className='ps-sh';
        const c=common(sA,sB);
        sh.textContent=c.length?c.join(','):'✗';
        if(!c.length) sh.classList.add('warn');
        aw.appendChild(sh);
      }
      flow.appendChild(aw);
    }
  });
  updatePracticeBtn();
}

function autoSelect(){
  if(!beatResults.length) return;
  let prevIdx=null;
  for(let i=0;i<beatResults.length;i++){
    const pool=beatResults[i].chords;
    if(!pool.length) continue;
    if(prevIdx===null){selections[i]=pool[0].name;prevIdx=i;continue;}
    const prevChord=ALL_CHORDS.find(c=>c.name===selections[prevIdx]);
    if(prevChord){
      const sc=pool.map(c=>({c,sc:common(prevChord,c).length})).sort((a,b)=>b.sc-a.sc);
      selections[i]=sc[0].c.name;
    } else { selections[i]=pool[0].name; }
    prevIdx=i;
  }
  renderBeatBlocks(); renderProgSummary();
  showToast('Best progression selected','ok');
}

function exportProg(){
  if(!beatResults.length){showToast('Run analysis first','warn');return;}
  const h=[meta.title?`SONG: ${meta.title}`:'',meta.key?`KEY: ${meta.key}`:'',meta.tempo?`TEMPO: ${meta.tempo}`:'',meta.time?`TIME: ${meta.time}`:'','─'.repeat(40)].filter(Boolean).join('\n');
  const melody='MELODY: '+beatResults.map(b=>{
    const displayBas = b.inferredBas||(b.bas&&b.bas!=='_'?b.bas:null);
    return displayBas?`${b.mel}/${displayBas}`:b.mel;
  }).join(' • ');
  const lines=beatResults.map((br,i)=>{
    const selChord = selections[i] ? br.chords.find(c=>c.name===selections[i]) : null;
    const ch = selChord || (selections[i]?ALL_CHORDS.find(c=>c.name===selections[i]):null);
    const prev=i>0&&selections[i-1]?ALL_CHORDS.find(c=>c.name===selections[i-1]):null;
    const shared=ch&&prev?` [↔${common(prev,ch).join(',')||'none'}]`:'';
    const dname = selChord ? selChord.name : (selections[i]||'—');
    const rootLabel = br.inferredBas?`inferred:${br.inferredBas}`:
                      (br.bas&&br.bas!=='_'?`locked:${br.bas}`:'any');
    return `B${i+1} ${br.mel} (${rootLabel}) → ${dname}${ch?' ('+ch.notes.join('·')+')'  :''}${shared}`;
  }).join('\n');
  const full=[h,melody,'─'.repeat(40),'PROGRESSION (bass = chord root):',lines].join('\n');
  navigator.clipboard.writeText(full).then(()=>showToast('Copied!','ok')).catch(()=>{const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copied!','ok');});
}

// ═══════════════ GENRE ENGINE ═══════════════
// Methodology: rule-based harmonic grammar per genre
// 1. Detect probable key from melody notes (chromatic frequency scoring)
// 2. Map melody notes to scale degrees in that key
// 3. Score candidate chords by: genre vocabulary + common-note chaining + scale function
// 4. Rank and output top progression per genre

const SCALES = {
  major:      [0,2,4,5,7,9,11],
  minor:      [0,2,3,5,7,8,10],
  dorian:     [0,2,3,5,7,9,10],
  mixolydian: [0,2,4,5,7,9,10],
  blues:      [0,3,5,6,7,10],
  pentatonic: [0,2,4,7,9],
};

// Roman numeral degrees from scale
const DEGREE_LABELS=['I','II','III','IV','V','VI','VII'];

// Genre grammar: chord types allowed, preferred scale, progression patterns
const GENRES = [
  {
    id:'pop', name:'Pop', emoji:'🎤',
    desc:'Major/minor triads, clean resolution',
    scale:'major',
    vocab:['','m','7','maj7','sus2','sus4','add9'],
    patterns:['I IV V vi','I V vi IV','I vi IV V'],
  },
  {
    id:'jazz', name:'Jazz', emoji:'🎷',
    desc:'Extended chords, ii–V–I, chromatic movement',
    scale:'major',
    vocab:['maj7','m7','7','m7b5','dim7','9','maj9','m9','13','add9'],
    patterns:['ii V I','I vi ii V','iii vi ii V I'],
  },
  {
    id:'gospel', name:'Gospel', emoji:'🙏',
    desc:'Rich 7ths, IV chord emphasis, call & response',
    scale:'major',
    vocab:['','m','maj7','7','m7','6','9','add9','sus4'],
    patterns:['I IV I V','I IV V I','I iii IV V'],
  },
  {
    id:'blues', name:'Blues', emoji:'🎸',
    desc:'Dominant 7ths, pentatonic, I–IV–V',
    scale:'blues',
    vocab:['7','m7','9','dim7',''],
    patterns:['I IV I V','I I IV V','I IV V IV'],
  },
  {
    id:'rnb', name:'R&B / Soul', emoji:'🎶',
    desc:'Minor 7ths, 9ths, smooth voice leading',
    scale:'minor',
    vocab:['m7','m9','7','9','maj7','6','m6','add9'],
    patterns:['i VII VI VII','i iv V i','i III VII iv'],
  },
  {
    id:'classical', name:'Classical', emoji:'🎻',
    desc:'Functional harmony, voice leading, inversions',
    scale:'major',
    vocab:['','m','dim','aug','7','maj7','sus4'],
    patterns:['I IV V I','I ii V I','I vi IV V I'],
  },
];

let selectedGenre = 'pop';

function buildGenreGrid(){
  const grid=document.getElementById('genreGrid');
  if(!grid) return;
  grid.innerHTML='';
  GENRES.forEach(g=>{
    const card=document.createElement('div');
    card.className='genre-card'+(g.id===selectedGenre?' active':'');
    card.innerHTML=`<div class="gc-name">${g.emoji} ${g.name}</div><div class="gc-desc">${g.desc}</div>`;
    card.onclick=()=>{selectedGenre=g.id;buildGenreGrid();};
    grid.appendChild(card);
