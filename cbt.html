// Detect most likely key from melody notes
function detectKey(melNotes){
  const valid=melNotes.map(resolve).filter(n=>n!=='_'&&NOTES.includes(n));
  if(!valid.length){ lastDetectedKey={root:'C',scale:'major',score:0}; return lastDetectedKey; }

  let best={root:'C',scale:'major',score:-1};
  for(const scaleName of ['major','minor','dorian','mixolydian']){
    const intervals=SCALES[scaleName];
    for(const root of NOTES){
      const ri=NOTES.indexOf(root);
      const scaleNotes=new Set(intervals.map(i=>NOTES[(ri+i)%12]));
      const score=valid.filter(n=>scaleNotes.has(n)).length;
      if(score>best.score) best={root,scale:scaleName,score};
    }
  }
  lastDetectedKey=best;
  return best;
}

// Build chord vocabulary for a key+genre
function buildVocab(keyRoot, scaleName, genre){
  const ri=NOTES.indexOf(keyRoot);
  const scale=SCALES[scaleName]||SCALES.major;
  const chords=[];
  scale.forEach((interval,degree)=>{
    const chordRoot=NOTES[(ri+interval)%12];
    genre.vocab.forEach(suffix=>{
      const ch=ALL_CHORDS.find(c=>c.root===chordRoot&&c.name===chordRoot+suffix);
      if(ch) chords.push({chord:ch, degree, degreeLabel:DEGREE_LABELS[degree]||'?'});
    });
  });
  return chords;
}

// ═══════════════ HARMONIC FUNCTION ENGINE ═══════════════
// Maps scale degrees to harmonic functions and position rules.
//
// TONIC     (I, vi, iii)  — stability, home. Can open AND close a progression.
// SUBDOM    (IV, ii)      — motion/departure. Mid-progression only.
// DOMINANT  (V, vii°)     — tension, pull toward tonic. Penultimate only; never opens.
//
// Transition rules (from → to):
//   Tonic     → anything       ✅
//   Subdom    → Dominant       ✅ (the classic preparation)
//   Subdom    → Tonic          ✅ (plagal cadence)
//   Subdom    → Subdom         ⚠️ weak
//   Dominant  → Tonic          ✅ (authentic cadence)
//   Dominant  → Subdom         ❌ retrogression (wrong-way)
//   Dominant  → Dominant       ⚠️ extension (ok in jazz/blues)

const FUNC = {
  TONIC:'tonic', SUBDOM:'subdom', DOMINANT:'dominant', PASSING:'passing'
};

// Returns harmonic function for a scale degree (0-indexed from key root)
// Works for both major and minor keys
function getHarmonicFunction(degree, scaleName){
  const isMinor = scaleName==='minor'||scaleName==='dorian';
  // Major key: I=tonic, ii=subdom, iii=tonic, IV=subdom, V=dominant, vi=tonic, vii°=dominant
  // Minor key: i=tonic, ii°=subdom, III=tonic, iv=subdom, V or v=dominant, VI=tonic, VII=dominant
  const funcMap = {
    0: FUNC.TONIC,
    1: FUNC.SUBDOM,
    2: isMinor ? FUNC.TONIC : FUNC.TONIC,   // III in minor = tonic
    3: FUNC.SUBDOM,
    4: FUNC.DOMINANT,
    5: FUNC.TONIC,
    6: FUNC.DOMINANT,
  };
  return funcMap[degree] || FUNC.PASSING;
}

// Position types passed to scoreChord
const POS = { OPEN:'open', MID:'mid', CLOSE:'close', PENULT:'penult' };

// Genre-specific position overrides
const GENRE_OPEN_BIAS = {
  pop:      [0,5],      // I, vi
  jazz:     [0,2,5],    // I, iii, vi
  gospel:   [0,3],      // I, IV (gospel often starts on IV)
  blues:    [0],        // always I (I7)
  rnb:      [0,5],      // i, VI
  classical:[0],        // always I
};
const GENRE_CLOSE_BIAS = {
  pop:      [0],        // resolve to I
  jazz:     [0,5],      // I or vi
  gospel:   [0],        // I
  blues:    [0],        // I
  rnb:      [0,5],      // i or VI
  classical:[0],        // I
};

// Score a chord candidate considering position context
// chordEntry: {chord, degree, degreeLabel}
// melNote: melody note string
// genre: genre object
// prevChord: previous chord object or null
// position: POS.OPEN | POS.MID | POS.CLOSE | POS.PENULT
// totalBeats: total number of beats in progression
function scoreChord(chordEntry, melNote, genre, prevChord, position, totalBeats){
  const {chord, degree} = chordEntry;
  let score = 0;
  const m = resolve(melNote);
  const func = getHarmonicFunction(degree, genre.scale);

  // ── Melody consonance ──
  if(m!=='_' && chord.noteSet.has(m)) score += 10;
  const dis = dissonanceScore(melNote, chord);
  if(dis.level==='consonant')    score += 8;
  else if(dis.level==='tension') score += 3;
  else                           score -= 5;

  // ── Genre vocabulary ──
  const suffix = chord.name.slice(chord.root.length);
  if(genre.vocab.includes(suffix)) score += 6;

  // ── Voice leading — common notes with previous ──
  if(prevChord){
    const cn = common(prevChord, chord);
    score += cn.length * 4;
  }

  // ── POSITION-AWARE HARMONIC FUNCTION SCORING ──
  const openBias  = GENRE_OPEN_BIAS[genre.id]  || [0];
  const closeBias = GENRE_CLOSE_BIAS[genre.id] || [0];

  if(position === POS.OPEN){
    // Opening: strongly prefer Tonic function, genre-specific degrees
    if(func === FUNC.TONIC)    score += 18;
    if(func === FUNC.SUBDOM)   score -= 6;
    if(func === FUNC.DOMINANT) score -= 20; // dominant NEVER opens
    if(openBias.includes(degree)) score += 10;
    // Penalise any chord that "needs resolution" — dominant 7ths especially
    if(suffix.includes('7') && func===FUNC.DOMINANT) score -= 10;

  } else if(position === POS.CLOSE){
    // Closing: must be Tonic (authentic or plagal resolution)
    if(func === FUNC.TONIC)    score += 18;
    if(func === FUNC.SUBDOM)   score -= 8;
    if(func === FUNC.DOMINANT) score -= 16;
    if(closeBias.includes(degree)) score += 10;

  } else if(position === POS.PENULT){
    // Beat before last: ideally Dominant (V) or Subdominant (IV) for cadence
    if(func === FUNC.DOMINANT) score += 14;
    if(func === FUNC.SUBDOM)   score += 8;  // plagal setup
    if(func === FUNC.TONIC)    score -= 4;

  } else {
    // Mid: apply transition rules from previous function
    if(prevChord){
      const prevFunc = getPrevFunc(prevChord, genre);
      if(prevFunc === FUNC.DOMINANT){
        if(func === FUNC.TONIC)    score += 12; // V→I: authentic cadence
        if(func === FUNC.SUBDOM)   score -= 10; // V→IV: retrogression, avoid
        if(func === FUNC.DOMINANT) score += 4;  // V→V: extension, ok
      } else if(prevFunc === FUNC.SUBDOM){
        if(func === FUNC.DOMINANT) score += 10; // IV→V: strong
        if(func === FUNC.TONIC)    score += 6;  // IV→I: plagal
        if(func === FUNC.SUBDOM)   score -= 2;  // IV→IV: weak
      } else if(prevFunc === FUNC.TONIC){
        // Tonic can go anywhere — subtle push toward motion
        if(func === FUNC.SUBDOM || func === FUNC.DOMINANT) score += 4;
      }
    }
    // General midpoint preference: slight favour for forward harmonic motion
    if(func === FUNC.TONIC)    score += 2;
    if(func === FUNC.SUBDOM)   score += 4;
    if(func === FUNC.DOMINANT) score += 3;
  }

  return score;
}

// Get harmonic function of a chord object by detecting its degree in the current key
function getPrevFunc(chord, genre){
  // Find this chord's degree in the current key context
  // We look it up in the genre scale by matching root
  const keyInfo = lastDetectedKey || {root:'C', scale:'major'};
  const ri = NOTES.indexOf(keyInfo.root);
  const scale = SCALES[genre.scale] || SCALES.major;
  const degree = scale.findIndex(interval => NOTES[(ri+interval)%12] === chord.root);
  if(degree < 0) return FUNC.PASSING;
  return getHarmonicFunction(degree, genre.scale);
}

// Store last detected key for getPrevFunc
let lastDetectedKey = null;

// Called from runAnalysis — renders genre results using already-computed beatResults
function renderGenreFromAnalysis(keyInfo, genre){
  // Build result array from existing beatResults + selections
  const result=beatResults.map((br,i)=>{
    const selChord=selections[i]?ALL_CHORDS.find(c=>c.name===selections[i]):null;
    const dis=selChord?dissonanceScore(br.mel,selChord):null;
    // Alts: other chords from this beat's pool, top 3 by score
    const pool=br.chords||[];
    const vocabEntry=br._vocab||pool.map(c=>({chord:c,degree:0,degreeLabel:'?'}));
    const genre2=GENRES.find(g=>g.id===selectedGenre)||GENRES[0];
    const prevSel=i>0&&selections[i-1]?ALL_CHORDS.find(c=>c.name===selections[i-1]):null;
    const altScored=pool
      .filter(c=>c.name!==selections[i])
      .map(c=>{
        const entry=vocabEntry.find(e=>e.chord.name===c.name)||{chord:c,degree:0,degreeLabel:'?'};
        return {name:c.name,sc:scoreChord(entry,br.mel,genre2,prevSel)};
      })
      .sort((a,b)=>b.sc-a.sc)
      .slice(0,3)
      .map(x=>x.name);

    const inferredBas=br.inferredBas||(br.bas&&br.bas!=='_'?br.bas:null);
    return {
      beat:{mel:br.mel, bas:inferredBas||'_'},
      chord:selChord,
      degree:0,
      degreeLabel:br.inferredDegree||'',
      dis,
      alts:altScored
    };
  });
  renderGenreResult(result, keyInfo, genre);
}

function runGenreFinder(){
  const valid=beats.filter(b=>b.mel&&isValidNote(b.mel)&&b.mel!=='_');
  if(!valid.length){showToast('Add melody notes first','warn');return;}

  const genre=GENRES.find(g=>g.id===selectedGenre)||GENRES[0];
  const melNotes=valid.map(b=>b.mel);
  const keyInfo=detectKey(melNotes);
  const vocab=buildVocab(keyInfo.root, keyInfo.scale, genre);

  const result=[];
  let prevChord=null;
  const totalBeats=valid.length;
  valid.forEach((beat,i)=>{
    const mel=resolve(beat.mel);
    const bas=resolve(beat.bas);

    // Determine position
    let pos;
    if(i===0)                   pos=POS.OPEN;
    else if(i===totalBeats-1)   pos=POS.CLOSE;
    else if(i===totalBeats-2)   pos=POS.PENULT;
    else                        pos=POS.MID;

    let candidates=vocab.filter(entry=>{
      if(mel!=='_'&&!entry.chord.noteSet.has(mel)) return false;
      if(bas!=='_'&&entry.chord.root!==bas) return false;
      return true;
    });
    if(!candidates.length&&bas!=='_'){
      candidates=vocab.filter(entry=>mel==='_'||entry.chord.noteSet.has(mel));
    }
    if(!candidates.length){
      result.push({beat,chord:null,degree:'?',degreeLabel:'?',harmonicFunc:null,dis:null,alts:[],pos});
      prevChord=null; return;
    }
    const scored=candidates.map(entry=>({
      entry, score:scoreChord(entry, beat.mel, genre, prevChord, pos, totalBeats)
    })).sort((a,b)=>b.score-a.score);

    const best=scored[0].entry;
    const dis=dissonanceScore(beat.mel, best.chord);
    const hFunc=getHarmonicFunction(best.degree, genre.scale);
    result.push({
      beat, chord:best.chord, degree:best.degree,
      degreeLabel:best.degreeLabel, harmonicFunc:hFunc, dis, pos,
      alts:scored.slice(1,4).map(s=>s.entry.chord.name)
    });
    prevChord=best.chord;
  });

  renderGenreResult(result, keyInfo, genre);
}

function renderGenreResult(result, keyInfo, genre){
  lastGenreResult = result; // store for alt play buttons
  const el=document.getElementById('genreResult');
  el.innerHTML='';
  el.classList.add('open');

  // Header
  const hdr=document.createElement('div'); hdr.className='gr-header';
  hdr.innerHTML=
    `<div class="gr-key">${keyInfo.root} ${keyInfo.scale}</div>`+
    `<div class="gr-scale">${keyInfo.scale} scale</div>`+
    `<div class="gr-genre">${genre.emoji} ${genre.name}</div>`;
  el.appendChild(hdr);

  // Progression label
  const pl=document.createElement('div'); pl.className='gr-prog-label';
  pl.textContent='Suggested Progression';
  el.appendChild(pl);

  // Chord boxes — scrollable row
  const progScroll=document.createElement('div');
  progScroll.style.cssText='display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;align-items:flex-start;';
  progScroll.style.webkitOverflowScrolling='touch';

  result.forEach((r,i)=>{
    const mel=resolve(r.beat.mel);
    const bas=r.beat.bas&&r.beat.bas!=='_'?resolve(r.beat.bas):(r.chord?r.chord.root:null);

    // Chord box
    const box=document.createElement('div');
    box.className='gr-chord'+(r.dis?' dis-'+r.dis.level:'');
    box.style.cssText='flex-shrink:0;min-width:70px;max-width:90px;';

    // Position label
    const posLabel=document.createElement('div');
    posLabel.className='pos-label';
    const posNames={open:'Opening',mid:'Middle',penult:'Pre-close',close:'Closing'};
    posLabel.textContent=posNames[r.pos]||'';
    box.appendChild(posLabel);

    // Chord name
    const nameEl=document.createElement('div');
    nameEl.style.cssText='font-size:0.88rem;font-weight:700;text-align:center;line-height:1;';
    nameEl.textContent=r.chord?r.chord.name:'—';
    box.appendChild(nameEl);

    // Degree + beat label
    const degEl=document.createElement('div');
    degEl.className='grc-degree';
    degEl.textContent=`${r.degreeLabel||'?'} · B${i+1}`;
    box.appendChild(degEl);

    // Harmonic function badge
    if(r.harmonicFunc){
      const hfb=document.createElement('div');
      const funcMap={tonic:'hf-tonic',subdom:'hf-subdom',dominant:'hf-dominant',passing:'hf-passing'};
      const funcLabel={tonic:'Tonic',subdom:'Sub-dom',dominant:'Dominant',passing:'Passing'};
      hfb.className='hf-badge '+(funcMap[r.harmonicFunc]||'hf-passing');
      hfb.textContent=funcLabel[r.harmonicFunc]||r.harmonicFunc;
      box.appendChild(hfb);
    }

    // Note pills
    if(r.chord){
      const notesDiv=document.createElement('div');
      notesDiv.className='gr-chord-notes';
      r.chord.notes.forEach(n=>{
        const p=document.createElement('span');
        p.className='gr-note-pill';
        const isMel=n===mel, isBas=n===bas;
        if(isMel&&isBas) p.classList.add('is-both');
        else if(isMel)   p.classList.add('is-mel');
        else if(isBas)   p.classList.add('is-bas');
        p.textContent=n;
        notesDiv.appendChild(p);
      });
      box.appendChild(notesDiv);
    }

    // Dissonance icon
    if(r.dis){
      const disEl=document.createElement('div');
      disEl.className='grc-dis';
      disEl.textContent=r.dis.level==='consonant'?'🟢':r.dis.level==='tension'?'🟡':'🔴';
      box.appendChild(disEl);
    }

    progScroll.appendChild(box);

    // Arrow between chords
    if(i<result.length-1){
      const arr=document.createElement('div');
      arr.style.cssText='align-self:flex-start;padding-top:14px;color:#bbb;font-size:0.7rem;flex-shrink:0;';
      arr.textContent='→';
      progScroll.appendChild(arr);
    }
  });
  el.appendChild(progScroll);

  // All notes used across progression
  const nu=document.createElement('div'); nu.className='gr-notes-used';
  const usedNotes=[...new Set(result.filter(r=>r.chord).flatMap(r=>r.chord.notes))];
  nu.textContent='All notes: '+usedNotes.join(' · ');
  el.appendChild(nu);

  // Alternates per beat — show chord name + notes
  result.forEach((r,i)=>{
    if(!r.alts||!r.alts.length) return;
    const sec=document.createElement('div'); sec.className='gr-alts';

    const lbl=document.createElement('div'); lbl.className='gr-alts-label';
    const beatLabel=r.beat.bas&&r.beat.bas!=='_'
      ? `${r.beat.mel}/${r.beat.bas}` : r.beat.mel;
    lbl.textContent=`Beat ${i+1} (${beatLabel}) alternatives:`;
    sec.appendChild(lbl);

    const scroll=document.createElement('div'); scroll.className='gr-alt-scroll';
    r.alts.forEach(name=>{
      const altChord=ALL_CHORDS.find(c=>c.name===name);
      const chip=document.createElement('div'); chip.className='gr-alt-chip';

      // Play button
      const playBtn=document.createElement('button');
      playBtn.type='button';
      playBtn.className='gr-alt-chip-play';
      playBtn.textContent='▶';
      playBtn.title='Play with this chord';
      playBtn.addEventListener('touchstart',e=>{
        e.preventDefault();e.stopPropagation();
        openPracticeFromResult(lastGenreResult, i, name);
      },{passive:false});
      playBtn.addEventListener('click',e=>{
        e.stopPropagation();
        openPracticeFromResult(lastGenreResult, i, name);
      });
      chip.appendChild(playBtn);

      // Info
      const chipInfo=document.createElement('div'); chipInfo.className='gr-alt-chip-info';
      const chipName=document.createElement('div'); chipName.className='gr-alt-chip-name';
      chipName.textContent=name;
      chipInfo.appendChild(chipName);
      if(altChord){
        const chipNotes=document.createElement('div'); chipNotes.className='gr-alt-chip-notes';
        chipNotes.textContent=altChord.notes.join(' · ');
        chipInfo.appendChild(chipNotes);
      }
      chip.appendChild(chipInfo);
      scroll.appendChild(chip);
    });
    sec.appendChild(scroll);
    el.appendChild(sec);
  });
}

// ═══════════════ PRACTICE MODE ═══════════════
let pm = {
  chords: [],      // [{name, label, notes, mel, bas}]
  idx: 0,          // current chord index
  playing: false,
  bpm: 60,
  beatsPerChord: 4,
  beatCount: 0,    // current beat within this chord
  ticker: null,    // setInterval handle
  tickerMs: 0,     // ms per beat
  arcTotal: 176,   // svg circumference
};

// Store last rendered genre result so alts can reference the full list
let lastGenreResult = [];

// Open practice with a genre result array, optionally overriding one beat's chord
function openPracticeFromResult(resultArray, overrideBeat, overrideChordName){
  const list = [];
  resultArray.forEach((r, i)=>{
    let chord = r.chord;
    // Apply override for the specified beat
    if(i === overrideBeat && overrideChordName){
      chord = ALL_CHORDS.find(c=>c.name===overrideChordName) || chord;
    }
    if(!chord) return;
    const mel = r.beat.mel;
    const bas = r.beat.bas && r.beat.bas!=='_' ? r.beat.bas : chord.root;
    list.push({
      name:  chord.name,
      label: chord.label,
      notes: chord.notes,
      mel,
      bas,
    });
  });
  if(!list.length){ showToast('No chords to play','warn'); return; }

  pm.chords   = list;
  pm.idx      = overrideBeat !== undefined ? overrideBeat : 0;
  pm.beatCount= 0;
  pm.playing  = false;

  document.getElementById('practiceOverlay').classList.add('open');
  buildPmDots();
  pmRenderChord();
  pmUpdatePlayBtn();
  pmSetArc(0);

  // Re-wire play button touch handler
  const playBtn = document.getElementById('pmPlayBtn');
  const newBtn = playBtn.cloneNode(true); // remove old listeners
  playBtn.parentNode.replaceChild(newBtn, playBtn);
  let pmTouchFired2 = false;
  newBtn.addEventListener('touchstart', e=>{
    e.preventDefault(); pmTouchFired2=true; pmTogglePlay();
  },{passive:false});
  newBtn.addEventListener('click', ()=>{
    if(pmTouchFired2){ pmTouchFired2=false; return; }
    pmTogglePlay();
  });

  document.getElementById('pmBpmVal').textContent   = pm.bpm;
  document.getElementById('pmBeatsVal').textContent = pm.beatsPerChord;
}

function openPractice(){
  // Build from beatResults + selections (main chord finder flow)
  const resultArray = beatResults.map((br,i)=>{
    const name  = selections[i];
    const chord = name ? ALL_CHORDS.find(c=>c.name===name) : null;
    const mel   = br.mel;
    const bas   = br.inferredBas||(br.bas!=='_'?br.bas:(chord?chord.root:'_'));
    return { beat:{mel,bas}, chord };
  }).filter(r=>r.chord);
  if(!resultArray.length){ showToast('No chords selected yet','warn'); return; }
  openPracticeFromResult(resultArray);
}

function closePractice(){
  pmStop();
  document.getElementById('practiceOverlay').classList.remove('open');
}

function buildPmDots(){
  const wrap = document.getElementById('pmDots');
  wrap.innerHTML = '';
  pm.chords.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'pm-dot' + (i===pm.idx?' active':'') + (i<pm.idx?' done':'');
    d.id = 'pmd_'+i;
    wrap.appendChild(d);
  });
}

function pmUpdateDots(){
  pm.chords.forEach((_,i)=>{
    const d = document.getElementById('pmd_'+i);
    if(!d) return;
    d.className = 'pm-dot'+(i===pm.idx?' active':i<pm.idx?' done':'');
  });
}

function pmRenderChord(){
  const c = pm.chords[pm.idx];
  if(!c) return;

  // Animate in
  const main = document.getElementById('pmMain');
  main.style.animation='none';
  void main.offsetHeight;
  main.style.animation='pmFade 0.3s ease';

  document.getElementById('pmChordName').textContent = c.name;
  document.getElementById('pmChordType').textContent = c.label;
  document.getElementById('pmBeatInfo').textContent =
    `Beat ${pm.idx+1} of ${pm.chords.length}`;
  document.getElementById('pmCounter').textContent =
    `${pm.idx+1} / ${pm.chords.length}`;

  // Melody + bass row
  const melRow = document.getElementById('pmMelodyRow');
  melRow.innerHTML = '';
  if(c.mel && c.mel !== '_'){
    const lbl = document.createElement('span');
    lbl.className = 'pm-melody-label';
    lbl.textContent = 'Melody';
    const melNote = document.createElement('span');
    melNote.className = 'pm-melody-note';
    melNote.textContent = c.mel;
    melRow.appendChild(lbl);
    melRow.appendChild(melNote);
    // Bass / root
    if(c.bas && c.bas !== '_' && c.bas !== c.mel){
      const sep = document.createElement('span');
      sep.className = 'pm-melody-sep';
      sep.textContent = '/';
      const basNote = document.createElement('span');
      basNote.className = 'pm-melody-bass';
      basNote.textContent = c.bas;
      melRow.appendChild(sep);
      melRow.appendChild(basNote);
    }
  }

  // Note pills
  const row = document.getElementById('pmNotesRow');
  row.innerHTML='';
  c.notes.forEach(n=>{
    const p = document.createElement('div');
    p.className='pm-note';
    const isMel = c.mel && resolve(c.mel)===n;
    const isBas = c.bas && resolve(c.bas)===n;
    if(isMel&&isBas) p.classList.add('is-both');
    else if(isMel)   p.classList.add('is-mel');
    else if(isBas)   p.classList.add('is-bas');
    p.textContent = n;
    row.appendChild(p);
  });

  pmUpdateDots();
  pmSetArc(0);
  document.getElementById('pmTimerNum').textContent = pm.beatsPerChord;
}

function pmSetArc(fraction){
  // fraction 0→1: how far through current chord (0=start, 1=end)
  const offset = pm.arcTotal * (1 - fraction);
  document.getElementById('pmArc').style.strokeDashoffset = offset;
  const arc = document.getElementById('pmArc');
  if(fraction < 0.5)       arc.style.stroke = '#fff';
  else if(fraction < 0.75) arc.style.stroke = '#fcd34d';
  else                      arc.style.stroke = '#f87171';
}

function pmStart(){
  if(pm.playing) return; // guard against double-fire
  pm.playing = true;
  pm.beatCount = 0;
  pm.tickerMs = Math.round(60000 / pm.bpm);
  pmUpdatePlayBtn();

  pm.ticker = setInterval(()=>{
    pm.beatCount++;
    // Update arc — fraction is progress through current chord
    const fraction = pm.beatCount / pm.beatsPerChord;
    pmSetArc(fraction);
    const remaining = Math.max(0, pm.beatsPerChord - pm.beatCount);
    document.getElementById('pmTimerNum').textContent = remaining || pm.beatsPerChord;

    // Beat flash
    const flash = document.getElementById('pmFlash');
    flash.classList.add('flash');
    setTimeout(()=>flash.classList.remove('flash'), 80);

    // Advance chord when beat count reaches beatsPerChord
    if(pm.beatCount >= pm.beatsPerChord){
      pm.beatCount = 0;
      if(pm.idx < pm.chords.length - 1){
        pm.idx++;
      } else {
        pm.idx = 0; // loop silently — no toast spam
      }
      pmRenderChord();
    }
  }, pm.tickerMs);
}

function pmStop(){
  pm.playing = false;
  clearInterval(pm.ticker);
  pm.ticker = null;
  pmUpdatePlayBtn();
}

function pmTogglePlay(){
  if(pm.playing) pmStop();
  else pmStart();
}

function pmUpdatePlayBtn(){
  const btn=document.getElementById('pmPlayBtn');
  if(pm.playing){
    btn.textContent='⏸';
    btn.style.background='#1e8a4a';
    btn.style.boxShadow='0 0 0 4px rgba(30,138,74,0.3), 0 6px 24px rgba(30,138,74,0.5)';
  } else {
    btn.textContent='▶';
    btn.style.background='#1a73e8';
    btn.style.boxShadow='0 0 0 4px rgba(26,115,232,0.3), 0 6px 24px rgba(26,115,232,0.5)';
  }
}

function pmPrev(){
  pmStop();
  pm.beatCount = 0;
  pm.idx = pm.idx > 0 ? pm.idx-1 : pm.chords.length-1;
  pmRenderChord();
}

function pmNext(){
  pmStop();
  pm.beatCount = 0;
  pm.idx = pm.idx < pm.chords.length-1 ? pm.idx+1 : 0;
  pmRenderChord();
}

function pmAdjBpm(delta){
  pm.bpm = Math.max(20, Math.min(240, pm.bpm + delta));
  document.getElementById('pmBpmVal').textContent = pm.bpm;
  if(pm.playing){ pmStop(); pmStart(); } // restart at new tempo
}

function pmAdjBeats(delta){
  pm.beatsPerChord = Math.max(1, Math.min(16, pm.beatsPerChord + delta));
  document.getElementById('pmBeatsVal').textContent = pm.beatsPerChord;
  pm.beatCount = 0;
  pmSetArc(0);
  document.getElementById('pmTimerNum').textContent = pm.beatsPerChord;
}

// Enable/disable practice button based on whether selections exist
function updatePracticeBtn(){
  const btn = document.getElementById('practiceBtn');
  if(!btn) return;
  const hasChords = beatResults.length>0 &&
    Object.values(selections).some(v=>!!v);
  btn.disabled = !hasChords;
}

// ═══════════════ INIT ═══════════════
buildKeyboard();
buildGenreGrid();
updateStatusStrip();
updateUndoButtons();
render();
</script>

<!-- PRACTICE MODE OVERLAY -->
<div class="practice-overlay" id="practiceOverlay">
  <div class="pm-beat-flash" id="pmFlash"></div>
  <div class="pm-topbar">
    <button class="pm-close" onclick="closePractice()">✕</button>
    <div class="pm-title">Practice Mode</div>
    <div class="pm-counter" id="pmCounter">1 / 1</div>
  </div>
  <div class="pm-dots" id="pmDots"></div>
  <div class="pm-main" id="pmMain">
    <div class="pm-beat-info" id="pmBeatInfo"></div>
    <div class="pm-melody-row" id="pmMelodyRow"></div>
    <div class="pm-chord-name" id="pmChordName">—</div>
    <div class="pm-chord-type" id="pmChordType"></div>
    <div class="pm-notes-row" id="pmNotesRow"></div>
    <div class="pm-timer-wrap" id="pmTimerWrap">
      <svg class="pm-timer-svg" width="64" height="64" viewBox="0 0 64 64">
        <circle class="pm-timer-bg" cx="32" cy="32" r="28"/>
        <circle class="pm-timer-arc" id="pmArc" cx="32" cy="32" r="28"
          stroke-dasharray="176" stroke-dashoffset="0"/>
      </svg>
      <div class="pm-timer-num" id="pmTimerNum">—</div>
    </div>
  </div>
  <div class="pm-controls">
    <div class="pm-btn-row">
      <button type="button" class="pm-btn" onclick="pmPrev()">⏮</button>
      <button type="button" class="pm-btn pm-play" id="pmPlayBtn" onclick="pmTogglePlay()">▶</button>
      <button type="button" class="pm-btn" onclick="pmNext()">⏭</button>
    </div>
    <div class="pm-settings">
      <div class="pm-setting">
        <div class="pm-setting-label">BPM</div>
        <div class="pm-setting-row">
          <button type="button" class="pm-adj" onclick="pmAdjBpm(-10)">−</button>
          <div class="pm-val" id="pmBpmVal">60</div>
          <button type="button" class="pm-adj" onclick="pmAdjBpm(10)">+</button>
        </div>
      </div>
      <div class="pm-setting">
        <div class="pm-setting-label">Beats / Chord</div>
        <div class="pm-setting-row">
          <button type="button" class="pm-adj" onclick="pmAdjBeats(-1)">−</button>
          <div class="pm-val" id="pmBeatsVal">4</div>
          <button type="button" class="pm-adj" onclick="pmAdjBeats(1)">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
