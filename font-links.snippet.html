<!--
  ════════════════════════════════════════════════════════════════════
  UE SCHOOL — FONT LOADING SNIPPET  (paste inside <head> on EVERY page)
  ════════════════════════════════════════════════════════════════════

  WHY THIS MATTERS:
  CSS @import blocks rendering — the browser must download main.css,
  parse it, THEN start downloading fonts. On slow Nigerian mobile
  networks this causes a Flash Of Invisible Text (FOIT) or ugly
  fallback flash (FOUT).

  This <link> approach tells the browser to fetch fonts IN PARALLEL
  with everything else, so fonts are usually ready before first paint.

  HOW TO USE:
  Paste these lines BEFORE <link rel="stylesheet" href="css/main.css">
  in every .html file (index.html, dashboard.html, login.html, etc.)
  ════════════════════════════════════════════════════════════════════
-->

<!-- Step 1: Open a fast connection to Google Fonts CDN early -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Step 2: Load the fonts non-blocking (display=swap = show system font immediately, swap when ready) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">

<!--
  FONTS USED:
  • Syne (600/700/800)         → headings, logo, display text
  • Plus Jakarta Sans (300–700 + italic 400) → body text, UI labels
  • DM Mono (400/500)         → code, math, statistics, timers

  FALLBACK CHAIN (if Google Fonts fails — e.g. offline/slow network):
  Headings → Segoe UI (Windows) / system-ui (Android Chrome)
  Body     → Segoe UI / system-ui / -apple-system (iOS Safari)
  Mono     → Consolas (Windows) / Courier New (universal)
  All three have emoji font fallbacks built into CSS variables in main.css.
-->
