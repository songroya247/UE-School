<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Guides &mdash; UE School</title>

<!-- Auth gatekeeper (same pattern as dashboard.html) -->
<script>
(function(){
  var hasSession = false;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
        var raw = JSON.parse(localStorage.getItem(k) || '{}');
        if (raw && raw.access_token && (raw.expires_at || 0) > Math.floor(Date.now()/1000)) {
          hasSession = true;
        }
        break;
      }
    }
  } catch(e) {}
  if (!hasSession) {
    window.location.replace('login.html?next=study-guides.html');
    throw new Error('[UE] No session');
  }
})();
</script>

<link rel="stylesheet" href="css/main.css">
<style>
body{background:var(--bg)}
.sg-wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.sg-hero{background:linear-gradient(135deg,#1a56ff,#6366f1);color:#fff;border-radius:16px;padding:32px;margin-bottom:32px}
.sg-hero h1{font-family:var(--font-head);font-size:2rem;margin-bottom:8px}
.sg-hero p{opacity:.9;font-size:.95rem;max-width:560px;line-height:1.5}
.sg-section{margin-bottom:36px}
.sg-section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sg-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#1a56ff,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem}
.sg-section h2{font-family:var(--font-head);font-size:1.4rem;margin:0}
.sg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sg-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit}
.sg-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(26,86,255,.12);border-color:var(--accent)}
.sg-card-icon{font-size:1.6rem;margin-bottom:8px}
.sg-card-title{font-weight:700;font-size:.95rem;margin-bottom:4px;line-height:1.3}
.sg-card-meta{font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:10px}
.sg-card-cta{margin-top:10px;font-size:.82rem;font-weight:700;color:var(--accent)}
.sg-empty{background:#fff;border:1px dashed var(--border);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.sg-back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-size:.85rem}
.sg-back:hover{color:var(--accent)}
</style>
</head>
<body>

<div class="sg-wrap">
  <a class="sg-back" href="dashboard.html">&larr; Back to Dashboard</a>

  <div class="sg-hero">
    <h1>PDF Study Guides</h1>
    <p>Curriculum-aligned summary notes for every subject in your study plan.
       Download once, study anywhere — works offline on phones, tablets, and
       printable for class.</p>
  </div>

  <div id="sg-content">
    <div class="sg-empty">Loading your guides…</div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>

<script>
const SUBJECT_META = {
  mathematics: { icon: '\u{1F4D0}', label: 'Mathematics' },
  english:     { icon: '\u{1F4D6}', label: 'English Language' },
  physics:     { icon: '\u269B',    label: 'Physics' },
  chemistry:   { icon: '\u{1F9EA}', label: 'Chemistry' },
  biology:     { icon: '\u{1F33F}', label: 'Biology' },
  economics:   { icon: '\u{1F4C8}', label: 'Economics' },
  government:  { icon: '\u{1F3DB}', label: 'Government' },
  literature:  { icon: '\u{1F4DA}', label: 'Literature' },
  geography:   { icon: '\u{1F30D}', label: 'Geography' },
  commerce:    { icon: '\u{1F3EA}', label: 'Commerce' },
  accounts:    { icon: '\u{1F4BC}', label: 'Accounts' },
  crk:         { icon: '\u271D',    label: 'CRK' },
};

/* ── tiny attr escaper so titles/paths can't break the markup ─── */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

(async function () {
  const auth = await AUTH_GUARD.init();
  if (!auth) return;
  const profile = auth.profile;
  const guides  = (window.UE_CONFIG && window.UE_CONFIG.STUDY_GUIDES) || {};
  const BUCKET  = (window.UE_CONFIG && window.UE_CONFIG.STUDY_GUIDES_BUCKET) || 'study-guides';

  // Show ALL subjects we have guides for, but mark the user's own subjects
  // as "Your Subjects" first.
  const mySubjects   = profile.exam_subjects || [];
  const allSubjects  = Array.from(new Set([
    ...mySubjects,
    ...Object.keys(guides),
  ]));

  const container = document.getElementById('sg-content');

  function renderSection(title, subjects) {
    if (!subjects.length) return '';
    let inner = '';
    subjects.forEach(subj => {
      const list = guides[subj] || [];
      const meta = SUBJECT_META[subj] || { label: subj, icon: '\u{1F4DA}' };
      if (!list.length) return;
      inner += `<div class="sg-section">
        <div class="sg-section-head">
          <div class="sg-icon">${meta.icon}</div>
          <h2>${esc(meta.label)}</h2>
        </div>
        <div class="sg-grid">` +
        list.map(g => `<a class="sg-card" href="#"
              data-path="${esc(g.path || '')}"
              data-file="${esc(g.file || '')}">
          <div class="sg-card-icon">\u{1F4D1}</div>
          <div class="sg-card-title">${esc(g.title)}</div>
          <div class="sg-card-meta">PDF \u00B7 ${esc(g.size || '—')}</div>
          <div class="sg-card-cta">Download \u2193</div>
        </a>`).join('') +
        `</div></div>`;
    });
    if (!inner) return '';
    return `<div style="font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${esc(title)}</div>` + inner;
  }

  const mineHtml  = renderSection('Your Subjects', mySubjects);
  const otherHtml = renderSection('Other Subjects', allSubjects.filter(s => !mySubjects.includes(s)));

  if (!mineHtml && !otherHtml) {
    container.innerHTML = '<div class="sg-empty">No study guides published yet — check back soon.</div>';
  } else {
    container.innerHTML = mineHtml + otherHtml;
  }

  /* ── click → fetch a 60-second signed URL ──────────────────────
     The bucket is private + RLS-locked to active premium accounts.
     A non-premium user therefore gets a graceful "subscription
     required" message instead of a 403 dump. */
  container.addEventListener('click', async function (ev) {
    const card = ev.target.closest('.sg-card');
    if (!card) return;
    ev.preventDefault();

    // ── Free-tier gate ────────────────────────────────────────────
    // Non-premium users get UE_CONFIG.FREE_SAMPLE.GUIDES_PER_ACCOUNT
    // PDF preview(s). Once spent, the next click bounces them to the
    // pricing page rather than firing the (doomed) signed-URL call,
    // which would otherwise return a 403 from RLS.
    if (window.AUTH_GUARD && !AUTH_GUARD.canSampleFeature('guide')) {
      AUTH_GUARD.bouncePremium(
        'You\'ve already opened your free PDF guide. Upgrade to UE Premium to download every guide.'
      );
      return;
    }

    const path = card.dataset.path || '';
    const file = card.dataset.file || '';

    // Legacy: a fully-qualified public URL bypasses the storage call.
    if (!path && file) {
      window.open(file, '_blank', 'noopener');
      return;
    }
    if (!path) {
      if (typeof toast === 'function') toast('No file linked to this guide yet.');
      return;
    }

    const ctaEl = card.querySelector('.sg-card-cta');
    const original = ctaEl ? ctaEl.textContent : '';
    if (ctaEl) ctaEl.textContent = 'Preparing…';

    try {
      const { data, error } = await window.sb
        .storage.from(BUCKET)
        .createSignedUrl(path, 60);

      if (error || !data || !data.signedUrl) throw (error || new Error('No URL returned'));
      // Spend a free-sample credit only after the URL was issued OK.
      if (window.AUTH_GUARD) AUTH_GUARD.recordSampleUse('guide');
      window.open(data.signedUrl, '_blank', 'noopener');
    } catch (e) {
      console.error('[study-guides] signed URL failed:', e);
      const msg = ((e && e.message) || '').toLowerCase();
      let userMsg;
      if (msg.indexOf('not found') !== -1 || msg.indexOf('object') !== -1) {
        userMsg = "That guide hasn't been uploaded yet — please check back soon.";
      } else if (msg.indexOf('row') !== -1 || msg.indexOf('policy') !== -1 ||
                 msg.indexOf('permission') !== -1 || msg.indexOf('forbidden') !== -1) {
        userMsg = 'An active subscription is required to download study guides.';
      } else {
        userMsg = "Couldn't open this guide. Please try again in a moment.";
      }
      if (typeof toast === 'function') toast(userMsg);
      else alert(userMsg);
    } finally {
      if (ctaEl) ctaEl.textContent = original;
    }
  });
})();
</script>
</body>
</html>
