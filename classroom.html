<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var LOGIN='login.html';
  var page=window.location.pathname.split('/').pop()||'';
  var h=window.location.hash||'',s=window.location.search||'';
  if(h.indexOf('access_token=')!==-1||h.indexOf('type=')!==-1||/[?&](code|token_hash|token)=/.test(s))return;
  var ok=false;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')!==-1){var v=localStorage.getItem(k);if(v&&v.length>10){ok=true;break;}}}}catch(e){}
  if(!ok)window.location.replace(LOGIN+'?next='+encodeURIComponent(page));
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom &mdash; UE School</title>
<script src="js/config.js"></script>
<script src="js/head-gatekeeper.js?v=3"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ── Reset ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f7fc;
  --surface:#ffffff;
  --surface2:#eef2ff;
  --border:#e4eaf6;
  --border2:#c9d8f8;
  --accent:#2563eb;
  --accent-dim:rgba(37,99,235,.09);
  --accent-mid:rgba(37,99,235,.2);
  --text:#0b1730;
  --text2:#374265;
  --muted:#6b7696;
  --radius:10px;
  --radius-lg:15px;
  --sidebar-w:270px;
  --header-h:56px;
}

html{height:100%;font-size:15px}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  height:100vh;display:flex;flex-direction:column;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── Expired banner ─────────────────────────────────────────── */
#defaulter-banner{
  background:linear-gradient(90deg,#7c2d12,#b45309,#7c2d12);
  background-size:200%;animation:bshift 5s linear infinite;
  color:#fef3c7;font-size:.74rem;font-weight:500;
  text-align:center;padding:7px 16px;flex-shrink:0;display:none
}
@keyframes bshift{0%{background-position:0%}100%{background-position:200%}}
#defaulter-banner a{color:#fde68a;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(253,230,138,.4);margin-left:6px}

/* ── Header ─────────────────────────────────────────────────── */
header{
  height:var(--header-h);flex-shrink:0;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  position:relative;z-index:50;
}
.h-icon-btn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);font-size:1.2rem;text-decoration:none;
  transition:background .15s,border-color .15s;cursor:pointer;flex-shrink:0
}
.h-icon-btn:hover{background:var(--border2)}
.logo{
  font-size:.88rem;font-weight:800;letter-spacing:-.025em;
  text-decoration:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--text) 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.h-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

/* Subject tabs */
.tabs{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  font-family:inherit;font-size:.74rem;font-weight:500;
  color:var(--muted);background:transparent;border:none;
  padding:6px 12px;border-radius:7px;cursor:pointer;
  white-space:nowrap;transition:all .15s;flex-shrink:0
}
.tab-btn:hover{color:var(--text);background:var(--surface2)}
.tab-btn.active{
  background:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 2px 10px rgba(37,99,235,.28)
}

#sb-toggle{display:none}

/* ── Page layout ─────────────────────────────────────────────── */
.layout{flex:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;min-height:0}

/* ── Sidebar ─────────────────────────────────────────────────── */
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.sb-head{
  padding:15px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(160deg,#f7f9ff,#eef2ff)
}
.sb-subject{font-size:.98rem;font-weight:700;letter-spacing:-.02em;color:var(--text);margin-bottom:3px}
.sb-count{font-size:.71rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.sb-count::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
#topic-list{flex:1;overflow-y:auto;padding:7px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#topic-list::-webkit-scrollbar{width:3px}
#topic-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.t-item{
  display:flex;align-items:center;gap:8px;width:100%;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 10px;text-align:left;cursor:pointer;
  color:var(--text2);font-family:inherit;font-size:.79rem;font-weight:400;
  margin-bottom:2px;position:relative;transition:all .15s
}
.t-item:hover:not(.locked){background:var(--surface2);border-color:var(--border)}
.t-item.active{
  background:var(--accent-dim);border-color:var(--accent-mid);
  color:var(--accent);font-weight:600
}
.t-item.active::before{
  content:'';position:absolute;left:0;top:22%;bottom:22%;
  width:3px;background:var(--accent);border-radius:0 3px 3px 0
}
.t-item.locked{opacity:.42;cursor:not-allowed}
.t-num{
  font-size:.63rem;font-weight:700;color:var(--muted);
  min-width:22px;text-align:center;background:var(--surface2);
  border:1px solid var(--border);border-radius:5px;padding:1px 5px;flex-shrink:0
}
.t-item.active .t-num{background:var(--accent);border-color:var(--accent);color:#fff}
.t-title{flex:1;line-height:1.4}
.t-pro{font-size:.65rem;color:var(--muted);margin-left:auto;flex-shrink:0}

.sb-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(8,18,48,.32);backdrop-filter:blur(2px);
  z-index:100;opacity:0;transition:opacity .2s;pointer-events:none
}
.sb-overlay.open{opacity:1;pointer-events:auto}

/* ── Main ────────────────────────────────────────────────────── */
.main{
  overflow-y:auto;background:var(--bg);
  scrollbar-width:thin;scrollbar-color:var(--border) transparent
}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ────────────────────────────────────────────────────────────────
   VIDEO CONTAINER
   ─────────────────────────────────────────────────────────────────
   The #video-box element is the key component. JS switches between
   three CSS classes to adjust the container height correctly:

   .mode-placeholder  — 16∶9 aspect-ratio; shows the "click to play" UI
   .mode-youtube      — 16∶9 aspect-ratio; YouTube embeds fit perfectly
   .mode-drive        — padding-bottom:calc(56.25% + 44px), height:0
                        Google Drive's /preview player has a bottom
                        toolbar (~44px). Using pure 16∶9 clips it off.
                        This padding-bottom trick gives 16∶9 content
                        height + 44px extra for Drive's toolbar, so
                        the full player — including controls — is visible.

   All child elements use position:absolute;inset:0 to fill the box.
─────────────────────────────────────────────────────────────────── */
.video-outer{position:sticky;top:0;z-index:40;background:var(--bg)}

#video-floating-hint{
  display:none;padding:8px 0 0;
  text-align:center;font-size:.73rem;font-weight:500;
  color:var(--accent);gap:6px;align-items:center;justify-content:center
}
#video-floating-hint.show{display:flex}

#video-box{
  width:100%;background:#050c1e;overflow:hidden;
  position:relative;display:block
}
/* YouTube: exact 16∶9 */
#video-box.mode-youtube{
  aspect-ratio:16/9;height:auto;padding-bottom:0
}
/* GDrive: 16∶9 + 44px for Drive's bottom toolbar */
#video-box.mode-drive{
  aspect-ratio:unset;height:0;
  padding-bottom:calc(56.25% + 44px)
}
/* Placeholder: 16∶9 */
#video-box.mode-placeholder{
  aspect-ratio:16/9;height:auto;padding-bottom:0
}
/* iframe always fills the container absolutely */
#video-box iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;z-index:3;display:block
}

/* ── Floating mini-player ────────────────────────────────────── */
#video-box.floating{
  position:fixed !important;
  bottom:20px !important;right:16px !important;
  top:auto !important;left:auto !important;
  width:285px !important;
  aspect-ratio:16/9 !important;
  height:auto !important;
  padding-bottom:0 !important;
  z-index:9999 !important;
  border-radius:14px !important;
  overflow:hidden !important;
  box-shadow:0 10px 48px rgba(0,0,0,.65),0 0 0 1px rgba(100,140,255,.22) !important
}
.float-bar{
  display:none;position:absolute;top:0;left:0;right:0;height:30px;z-index:12;
  background:linear-gradient(180deg,rgba(5,12,30,.88),transparent);
  border-radius:14px 14px 0 0;align-items:center;justify-content:space-between;padding:0 10px
}
#video-box.floating .float-bar{display:flex}
.float-close{background:none;border:none;color:rgba(255,255,255,.55);font-size:.8rem;cursor:pointer;padding:2px 5px;border-radius:4px;line-height:1}
.float-close:hover{color:#fff;background:rgba(255,255,255,.1)}
.float-lbl{font-size:.56rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase}

/* Drive arrow-icon blocker */
#v-blocker{position:absolute;top:0;right:0;width:80px;height:56px;z-index:10;pointer-events:all;cursor:default;background:transparent}

/* Skeleton */
.v-skel{
  position:absolute;inset:0;z-index:5;
  background:linear-gradient(90deg,#07101f 25%,#0e1c38 50%,#07101f 75%);
  background-size:200% 100%;animation:sk 1.6s infinite;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px
}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.v-skel-ring{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(100,140,255,.15);border-top-color:#5b8aff;
  animation:spin .85s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.v-skel-txt{font-size:.71rem;color:rgba(255,255,255,.28);letter-spacing:.08em}

/* Placeholder visuals */
.v-empty{
  position:absolute;inset:0;z-index:4;
  background:radial-gradient(ellipse 85% 75% at 50% 40%,#0f2050,#050c1e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px
}
.v-play-btn{
  width:70px;height:70px;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,rgba(91,138,255,.85),rgba(75,110,210,.75));
  display:flex;align-items:center;justify-content:center;
  font-size:1.65rem;color:#fff;padding-left:5px;
  box-shadow:0 0 0 14px rgba(91,138,255,.1),0 8px 28px rgba(91,138,255,.4);
  transition:transform .2s,box-shadow .2s
}
.v-play-btn:hover{transform:scale(1.09);box-shadow:0 0 0 20px rgba(91,138,255,.07),0 12px 36px rgba(91,138,255,.5)}
.v-empty-txt{font-size:.78rem;color:rgba(255,255,255,.28);letter-spacing:.04em}

/* Tier badge */
.vbadge{
  position:absolute;bottom:12px;left:12px;z-index:8;pointer-events:none;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;backdrop-filter:blur(8px)
}
.vbadge.foundation{background:rgba(251,146,60,.18);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
.vbadge.standard  {background:rgba(91,138,255,.18); color:#5b8aff; border:1px solid rgba(91,138,255,.3)}
.vbadge.mastery   {background:rgba(167,139,250,.18);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}

/* ── Lesson panel ────────────────────────────────────────────── */
.panel{max-width:750px;margin:0 auto;padding:22px 26px 44px}

/* Tier pills */
.tier-row{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tier-pill{
  font-family:inherit;font-size:.71rem;font-weight:600;
  padding:5px 14px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface);
  color:var(--text2);transition:all .15s
}
.tier-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.tier-pill.active.foundation{background:rgba(251,146,60,.1);color:#c2410c;border-color:rgba(251,146,60,.35)}
.tier-pill.active.standard  {background:var(--accent-dim);color:var(--accent);border-color:var(--accent-mid)}
.tier-pill.active.mastery   {background:rgba(139,92,246,.1);color:#6d28d9;border-color:rgba(139,92,246,.3)}
.tier-tagline{font-size:.71rem;color:var(--muted);margin-left:2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Meta */
.meta-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.topic-chip{
  background:var(--accent-dim);color:var(--accent);
  font-size:.67rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;border:1px solid var(--accent-mid)
}
.dur-chip{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.dur-chip::before{content:'◷';font-size:.8rem}
.lesson-title{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.2;margin-bottom:18px}

/* Buttons */
.btn-row{display:flex;gap:9px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.btn{
  font-family:inherit;font-size:.81rem;font-weight:600;border:none;border-radius:9px;
  cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:7px;
  text-decoration:none;padding:9px 19px
}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 3px 14px rgba(79,130,255,.25)}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 7px 22px rgba(79,130,255,.38)}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}

/* Content */
#lesson-content p{font-size:.93rem;line-height:1.85;color:var(--text2);margin-bottom:18px}
#lesson-content h3{font-size:1.02rem;font-weight:700;letter-spacing:-.02em;color:var(--text);margin:6px 0 12px}
#lesson-content ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
#lesson-content ul li{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:10px 13px;color:var(--text2);font-size:.87rem;line-height:1.6;transition:border-color .15s
}
#lesson-content ul li:hover{border-color:var(--border2)}
#lesson-content ul li .bullet{color:var(--accent);font-size:1rem;margin-top:1px;flex-shrink:0}

/* Formula box */
.formula-box{
  background:linear-gradient(135deg,rgba(219,234,254,.85),rgba(191,219,254,.55));
  border:1px solid rgba(37,99,235,.16);border-radius:var(--radius-lg);
  padding:17px 19px;margin-bottom:24px;position:relative;overflow:hidden
}
.formula-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.formula-lbl{font-size:.63rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.formula-lbl::before{content:'f(x)';background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.18);color:var(--accent);font-family:'DM Mono','Courier New',monospace;font-size:.66rem;padding:1px 6px;border-radius:4px}
.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.formula-item{background:rgba(255,255,255,.7);border:1px solid rgba(37,99,235,.1);border-radius:8px;padding:10px 13px;font-size:.88rem;color:var(--text);font-family:'DM Mono','Courier New',monospace}

/* Quiz */
#quiz-section{padding-top:26px;border-top:1px solid var(--border)}
.quiz-h{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.quiz-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:20px;box-shadow:0 2px 14px rgba(37,99,235,.06)}
.quiz-meta{font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:13px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.06em}
.quiz-dots{display:flex;gap:5px}
.qdot{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);transition:all .3s}
.qdot.done{background:var(--accent);border-color:var(--accent)}
.qdot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#quiz-question{font-size:.98rem;font-weight:700;margin-bottom:16px;color:var(--text);line-height:1.55;letter-spacing:-.01em}
#quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  background:var(--surface2);border:1px solid var(--border2);border-radius:9px;
  padding:10px 13px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:.83rem;color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:8px
}
.opt:hover{background:var(--surface);border-color:var(--accent-mid);color:var(--text);transform:translateY(-1px)}
.opt.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.opt-ltr{font-size:.67rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 6px;flex-shrink:0}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(11,23,48,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(100,140,255,.18);color:#fff;
  font-family:inherit;font-size:.8rem;font-weight:500;
  padding:11px 20px;border-radius:28px;
  box-shadow:0 6px 28px rgba(37,99,235,.18);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  z-index:9999;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Responsive ──────────────────────────────────────────────── */
@media(max-width:700px){
  body{height:auto !important;overflow:visible !important;overflow-x:hidden}
  .layout{grid-template-columns:1fr;overflow:visible !important}
  .main{overflow-y:visible !important}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:272px;z-index:110;
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 32px rgba(37,99,235,.1)
  }
  .sidebar.drawer-open{transform:translateX(0)}
  .sb-overlay{display:block}
  #sb-toggle{display:flex !important}
  .panel{padding:16px 15px 44px}
  .formula-grid{grid-template-columns:1fr}
  #quiz-options{grid-template-columns:1fr}
  .btn-row{flex-wrap:wrap;gap:8px}
  .lesson-title{font-size:1.2rem}
  #video-box.floating{width:252px !important;bottom:66px !important;right:10px !important}
}
@media(max-width:400px){.tab-btn{padding:5px 9px;font-size:.7rem}}
</style>
</head>
<body style="visibility:hidden">
<noscript><div style="padding:40px;text-align:center;font-family:system-ui"><h2>JavaScript Required</h2><p>Please enable JavaScript. <a href="login.html">Log in</a>.</p></div></noscript>

<div id="defaulter-banner">Your subscription has expired. <a href="pricing.html">Renew Now &rarr;</a></div>

<header>
  <button id="sb-toggle" class="h-icon-btn" title="Topics" onclick="CLASSROOM.toggleSidebar()">&#x2630;</button>
  <a href="dashboard.html" class="h-icon-btn" title="Back" onclick="try{sessionStorage.setItem('ue_from_classroom','1')}catch(e){}">&#8249;</a>
  <a href="index.html" class="logo">UE School</a>
  <div class="h-sep"></div>
  <div class="tabs" id="subject-tabs">
    <button class="tab-btn active" data-subject="mathematics" onclick="CLASSROOM.switchSubject('mathematics',this)">Mathematics</button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-subject" id="sb-subject">Mathematics</div>
      <div class="sb-count" id="sb-count">Loading&hellip;</div>
    </div>
    <div id="topic-list">
      <div style="padding:22px 14px;text-align:center;color:var(--muted);font-size:.81rem">Loading topics&hellip;</div>
    </div>
  </aside>

  <main class="main">

    <div class="video-outer" id="video-outer">
      <div id="video-floating-hint">&#x25B6;&nbsp; Video playing below</div>

      <!--
        #video-box class is managed by classroom.js.
        mode-placeholder → 16:9, shows play button UI
        mode-youtube     → 16:9, YouTube iframe fills container perfectly
        mode-drive       → height:0 + padding-bottom:calc(56.25% + 44px)
                           Adds 44px for GDrive's bottom toolbar so it
                           is fully visible and not clipped.
      -->
      <div id="video-box" class="mode-placeholder">

        <div class="float-bar">
          <span class="float-lbl">Now Playing</span>
          <button class="float-close" onclick="CLASSROOM.stopFloat()">&#x2715;</button>
        </div>

        <!-- Loading skeleton (shown while iframe loads) -->
        <div class="v-skel" id="v-skel" style="display:none">
          <div class="v-skel-ring"></div>
          <div class="v-skel-txt">Loading video&hellip;</div>
        </div>

        <!-- Placeholder (no video selected) -->
        <div class="v-empty" id="v-empty">
          <div class="v-play-btn" onclick="CLASSROOM.playVideo(null)">&#x25B6;</div>
          <div class="v-empty-txt">Select a topic to begin</div>
        </div>

        <!-- Tier badge -->
        <div class="vbadge standard" id="vbadge" style="display:none"></div>
      </div>
    </div>

    <div class="panel">

      <!-- Tier selector pills (hidden until a video loads) -->
      <div class="tier-row" id="tier-row" style="display:none">
        <button class="tier-pill foundation" data-tier="foundation" onclick="CLASSROOM.selectTier('foundation')">Foundation</button>
        <button class="tier-pill standard active" data-tier="standard"  onclick="CLASSROOM.selectTier('standard')">Standard</button>
        <button class="tier-pill mastery"    data-tier="mastery"    onclick="CLASSROOM.selectTier('mastery')">Mastery</button>
        <span class="tier-tagline" id="tier-tagline"></span>
      </div>

      <div class="meta-row">
        <span class="topic-chip" id="topic-chip">Topic</span>
        <span class="dur-chip"   id="dur-chip">&mdash; mins</span>
      </div>
      <h1 class="lesson-title" id="lesson-title">Select a topic</h1>

      <div class="btn-row">
        <a href="cbt.html" class="btn btn-primary" id="practice-btn">&#x1F4DD;&nbsp;Practice Questions</a>
        <button class="btn btn-ghost" onclick="CLASSROOM.nextLesson()">Next &rarr;</button>
        <button class="btn btn-ghost" onclick="CLASSROOM.prevLesson()" style="padding:9px 13px">&larr; Prev</button>
      </div>

      <div id="lesson-content">
        <p style="color:var(--muted)">Select a topic from the sidebar to begin.</p>
      </div>

      <div id="quiz-section" style="display:none">
        <h2 class="quiz-h">Quick Check</h2>
        <div class="quiz-card">
          <div class="quiz-meta">
            <span>Q&nbsp;<span id="q-num">1</span>&nbsp;/&nbsp;<span id="q-total">3</span></span>
            <div class="quiz-dots" id="quiz-dots"></div>
          </div>
          <h3 id="quiz-question"></h3>
          <div id="quiz-options"></div>
        </div>
        <div id="quiz-feedback" style="display:none"></div>
      </div>

    </div>
  </main>
</div>

<div id="toast"></div>
<div class="sb-overlay" id="sb-overlay" onclick="CLASSROOM.closeSidebar()"></div>

<!--
  SCRIPT LOAD ORDER — CRITICAL, DO NOT REORDER
  1. supabase.min.js      → window.supabase
  2. auth.js              → window.sb
  3. auth-guard.js        → AUTH_GUARD
  4–7. Skill Chamber deps (storage, skill_questions, curriculum, intervention_modal)
  8. gdrive-video.js      → GDRIVE_VIDEO  ← must be before gsheet-curriculum
  9. gsheet-curriculum.js → GSHEET_CURRICULUM
  10. classroom.js        → CLASSROOM  (this rewrite)
  11. skill_chamber.js    → monkey-patches CLASSROOM.loadTopic
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>
<script src="js/storage.js"></script>
<script src="js/skill_questions.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/intervention_modal.js"></script>
<script src="js/gdrive-video.js"></script>
<script src="js/gsheet-curriculum.js"></script>
<script src="js/classroom.js"></script>
<script src="js/skill_chamber.js"></script>

<script>
function toast(msg, dur) {
  dur = dur || 2800;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, dur);
}

document.addEventListener('DOMContentLoaded', async function() {
  var results = await Promise.all([
    AUTH_GUARD.init(),
    (async function(){
      if (!window.GSHEET_CURRICULUM || !GSHEET_CURRICULUM.isEnabled()) return;
      try { await GSHEET_CURRICULUM.init(); }
      catch(e) { console.error('[classroom.html] GSHEET_CURRICULUM.init() threw:', e); }
    })()
  ]);

  var authData = results[0];
  if (!authData) return;

  CLASSROOM.mergeSheetIntoCurriculum();
  window._ueProfile = authData.profile;
  await CLASSROOM.init(authData);

  /* Floating video — activates when video-outer scrolls out of view */
  var outer = document.getElementById('video-outer');
  if (outer && window.IntersectionObserver) {
    new IntersectionObserver(function(entries) {
      var vb = document.getElementById('video-box');
      var hint = document.getElementById('video-floating-hint');
      var hasVideo = vb && vb.querySelector('iframe');
      if (!hasVideo) return;
      var gone = !entries[0].isIntersecting;
      if (gone) {
        vb.classList.add('floating');
        if (hint) hint.classList.add('show');
      } else {
        vb.classList.remove('floating');
        if (hint) hint.classList.remove('show');
      }
    }, { threshold: 0, rootMargin: '-' + getComputedStyle(document.documentElement).getPropertyValue('--header-h').trim() + ' 0px 0px 0px' }).observe(outer);
  }
});
</script>
</body>
</html>
