<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var L='login.html',page=window.location.pathname.split('/').pop()||'';
  var h=window.location.hash||'',s=window.location.search||'';
  if(h.indexOf('access_token=')>-1||h.indexOf('type=')>-1||/[?&](code|token_hash|token)=/.test(s))return;
  var ok=false;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>-1){var v=localStorage.getItem(k);if(v&&v.length>10){ok=true;break;}}}}catch(e){}
  if(!ok)window.location.replace(L+'?next='+encodeURIComponent(page));
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom &mdash; UE School</title>
<script src="js/config.js"></script>
<script src="js/head-gatekeeper.js?v=3"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fc;--surf:#fff;--surf2:#eef3ff;
  --bdr:#e4eaf6;--bdr2:#c9d8f8;
  --accent:#2563eb;--adim:rgba(37,99,235,.09);--amid:rgba(37,99,235,.22);
  --txt:#0b1730;--txt2:#374265;--muted:#6b7696;
  --r:10px;--rlg:15px;--sw:270px;--hh:56px;
}
html{height:100%;font-size:15px}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);
  height:100vh;display:flex;flex-direction:column;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ── Expired banner ── */
#exp-banner{
  background:linear-gradient(90deg,#7c2d12,#b45309);
  color:#fef3c7;font-size:.74rem;font-weight:500;
  text-align:center;padding:7px 16px;flex-shrink:0;display:none
}
#exp-banner a{color:#fde68a;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(253,230,138,.4);margin-left:6px}

/* ── Header ── */
header{
  height:var(--hh);flex-shrink:0;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 14px;gap:9px;position:relative;z-index:50
}
.h-btn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--bdr);
  color:var(--txt2);font-size:1.2rem;text-decoration:none;
  transition:background .15s;cursor:pointer;flex-shrink:0;font-family:inherit
}
.h-btn:hover{background:var(--bdr2)}
.logo{font-size:.88rem;font-weight:800;letter-spacing:-.025em;text-decoration:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--txt) 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hsep{width:1px;height:18px;background:var(--bdr);flex-shrink:0}
.tabs{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  font-family:inherit;font-size:.73rem;font-weight:500;
  color:var(--muted);background:transparent;border:none;
  padding:6px 12px;border-radius:7px;cursor:pointer;
  white-space:nowrap;transition:all .15s;flex-shrink:0
}
.tab-btn:hover{color:var(--txt);background:var(--surf2)}
.tab-btn.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(37,99,235,.28)}
#sb-tog{display:none}

/* ── Layout ── */
.layout{flex:1;display:grid;grid-template-columns:var(--sw) 1fr;overflow:hidden;min-height:0}

/* ── Sidebar ── */
.sidebar{background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.sb-hd{padding:14px 15px;border-bottom:1px solid var(--bdr);background:linear-gradient(160deg,#f7f9ff,#eef2ff)}
.sb-subj{font-size:.97rem;font-weight:700;letter-spacing:-.02em;color:var(--txt);margin-bottom:3px}
.sb-cnt{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.sb-cnt::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
#topic-list{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
#topic-list::-webkit-scrollbar{width:3px}
#topic-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.ti{
  display:flex;align-items:center;gap:8px;width:100%;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 10px;text-align:left;cursor:pointer;
  color:var(--txt2);font-family:inherit;font-size:.79rem;font-weight:400;
  margin-bottom:2px;position:relative;transition:all .15s
}
.ti:hover:not(.locked){background:var(--surf2);border-color:var(--bdr)}
.ti.active{background:var(--adim);border-color:var(--amid);color:var(--accent);font-weight:600}
.ti.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.ti.locked{opacity:.42;cursor:not-allowed}
.ti-n{font-size:.63rem;font-weight:700;color:var(--muted);min-width:22px;text-align:center;background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;padding:1px 5px;flex-shrink:0}
.ti.active .ti-n{background:var(--accent);border-color:var(--accent);color:#fff}
.ti-t{flex:1;line-height:1.4}
.ti-p{font-size:.64rem;color:var(--muted);margin-left:auto;flex-shrink:0}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(8,18,48,.32);backdrop-filter:blur(2px);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.sb-ov.open{opacity:1;pointer-events:auto}

/* ── Main ── */
.main{overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}

/* ═══════════════════════════════════════════════════════════
   VIDEO PLAYER
   ═══════════════════════════════════════════════════════════
   DESIGN: data-state attribute controls which child is visible.
   Only ONE child is ever shown at a time — impossible to overlap.

   data-state="empty"   → #vp-empty shows  (placeholder UI)
   data-state="loading" → #vp-spin shows  (spinner)
   data-state="playing" → iframe shows    (actual video)

   Both YouTube and Google Drive use the same aspect-ratio:16/9
   container. Drive's controls overlay the video (like YouTube).
   This is simpler and more reliable than height:0 + padding-bottom
   (which breaks with box-sizing:border-box in some browsers).
   ═══════════════════════════════════════════════════════════ */

.vp-outer{position:sticky;top:0;z-index:40;background:var(--bg)}

/* Mini-player hint (when scrolled past video) */
#vp-hint{
  display:none;padding:7px 0;
  text-align:center;font-size:.72rem;font-weight:500;
  color:var(--accent);gap:6px;align-items:center;justify-content:center
}
#vp-hint.show{display:flex}

/* ── The video box ── */
#vp{
  width:100%;
  aspect-ratio:16/9;   /* same for all sources: YT + Drive */
  background:#050c1e;
  position:relative;
  overflow:hidden;
  display:block;
}

/* ── State machine: hide everything, then selectively show ── */
#vp-empty,
#vp-spin,
#vp > iframe{
  position:absolute;inset:0;width:100%;height:100%;
}

/* Default: hide all children */
#vp-empty { display:none; }
#vp-spin  { display:none; }
#vp > iframe { display:none; border:none; height:calc(100% + 40px); }

/* State overrides */
#vp[data-state="empty"]   #vp-empty { display:flex; }
#vp[data-state="loading"] #vp-spin  { display:flex; }
#vp[data-state="playing"] > iframe  { display:block; }

/* ── Empty (placeholder) ── */
#vp-empty{
  background:radial-gradient(ellipse 85% 70% at 50% 40%,#0f2050,#050c1e);
  flex-direction:column;align-items:center;justify-content:center;gap:16px
}
.vp-ring{
  width:68px;height:68px;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,rgba(91,138,255,.85),rgba(60,90,210,.75));
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;color:#fff;padding-left:4px;
  box-shadow:0 0 0 14px rgba(91,138,255,.1),0 8px 28px rgba(91,138,255,.4);
  transition:transform .2s,box-shadow .2s
}
.vp-ring:hover{transform:scale(1.09)}
.vp-hint-txt{font-size:.78rem;color:rgba(255,255,255,.28);letter-spacing:.04em}

/* ── Loading spinner ── */
#vp-spin{
  background:#050c1e;
  flex-direction:column;align-items:center;justify-content:center;gap:14px
}
.vp-spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(91,138,255,.15);
  border-top-color:#5b8aff;
  animation:spin .85s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.vp-loading-txt{font-size:.72rem;color:rgba(255,255,255,.3);letter-spacing:.07em}

/* ── Floating mini-player ── */
#vp.floating{
  position:fixed !important;
  bottom:18px !important;right:14px !important;
  top:auto !important;left:auto !important;
  width:270px !important;
  aspect-ratio:16/9 !important;
  z-index:9999 !important;
  border-radius:13px !important;
  overflow:hidden !important;
  box-shadow:0 10px 50px rgba(0,0,0,.65),0 0 0 1px rgba(100,140,255,.2) !important
}
#vp-float-bar{
  display:none;position:absolute;
  top:0;left:0;right:0;height:28px;z-index:5;
  background:linear-gradient(180deg,rgba(5,12,30,.88),transparent);
  border-radius:13px 13px 0 0;
  align-items:center;justify-content:space-between;padding:0 9px
}
#vp.floating #vp-float-bar{display:flex}
.fp-close{background:none;border:none;color:rgba(255,255,255,.55);font-size:.8rem;cursor:pointer;padding:2px 5px;border-radius:4px;line-height:1;font-family:inherit}
.fp-close:hover{color:#fff;background:rgba(255,255,255,.1)}
.fp-lbl{font-size:.56rem;color:rgba(255,255,255,.28);letter-spacing:.08em;text-transform:uppercase}

/* Overlays inside video (z-index above iframe) */
#vp-wm,#vp-blk{position:absolute;z-index:4;pointer-events:none}
#vp-wm{inset:0;overflow:hidden}
#vp-blk{top:0;right:0;width:80px;height:52px;background:transparent;pointer-events:all;cursor:default}

/* Tier badge */
#vp-badge{
  display:none;position:absolute;bottom:11px;left:11px;z-index:4;pointer-events:none;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;backdrop-filter:blur(8px)
}
#vp-badge.foundation{background:rgba(251,146,60,.2);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
#vp-badge.standard  {background:rgba(91,138,255,.2);color:#5b8aff;border:1px solid rgba(91,138,255,.3)}
#vp-badge.mastery   {background:rgba(167,139,250,.2);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}

/* ── Lesson panel ── */
.panel{max-width:740px;margin:0 auto;padding:20px 24px 44px}
.tier-row{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tier-pill{
  font-family:inherit;font-size:.71rem;font-weight:600;
  padding:5px 14px;border-radius:20px;cursor:pointer;
  border:1px solid var(--bdr2);background:var(--surf);color:var(--txt2);transition:all .15s
}
.tier-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--adim)}
.tier-pill.active.foundation{background:rgba(251,146,60,.1);color:#c2410c;border-color:rgba(251,146,60,.35)}
.tier-pill.active.standard  {background:var(--adim);color:var(--accent);border-color:var(--amid)}
.tier-pill.active.mastery   {background:rgba(139,92,246,.1);color:#6d28d9;border-color:rgba(139,92,246,.3)}
.tier-tag{font-size:.71rem;color:var(--muted);margin-left:2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.topic-chip{background:var(--adim);color:var(--accent);font-size:.67rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid var(--amid)}
.dur-chip{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.dur-chip::before{content:'◷';font-size:.8rem}
.lesson-title{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;color:var(--txt);line-height:1.2;margin-bottom:17px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--bdr);margin-bottom:22px}
.btn{font-family:inherit;font-size:.8rem;font-weight:600;border:none;border-radius:9px;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:7px;text-decoration:none;padding:9px 18px}
.btn-p{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 3px 14px rgba(79,130,255,.24)}
.btn-p:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-g{background:var(--surf);color:var(--txt2);border:1px solid var(--bdr2)}
.btn-g:hover{background:var(--surf2);color:var(--txt)}
#lesson-content p{font-size:.93rem;line-height:1.85;color:var(--txt2);margin-bottom:17px}
#lesson-content h3{font-size:1rem;font-weight:700;letter-spacing:-.02em;color:var(--txt);margin:6px 0 11px}
#lesson-content ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
#lesson-content ul li{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:10px 13px;color:var(--txt2);font-size:.87rem;line-height:1.6;transition:border-color .15s}
#lesson-content ul li:hover{border-color:var(--bdr2)}
#lesson-content ul li .blt{color:var(--accent);font-size:1rem;margin-top:1px;flex-shrink:0}
.fbox{background:linear-gradient(135deg,rgba(219,234,254,.85),rgba(191,219,254,.55));border:1px solid rgba(37,99,235,.16);border-radius:var(--rlg);padding:16px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.fbox::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.fbox-lbl{font-size:.62rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.fbox-lbl::before{content:'f(x)';background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.18);color:var(--accent);font-family:'DM Mono','Courier New',monospace;font-size:.66rem;padding:1px 6px;border-radius:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fitem{background:rgba(255,255,255,.7);border:1px solid rgba(37,99,235,.1);border-radius:8px;padding:10px 13px;font-size:.88rem;color:var(--txt);font-family:'DM Mono','Courier New',monospace}
#quiz-section{padding-top:24px;border-top:1px solid var(--bdr)}
.qh{font-size:1.04rem;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.qcard{background:var(--surf);border:1px solid var(--bdr2);border-radius:var(--rlg);padding:19px;box-shadow:0 2px 14px rgba(37,99,235,.05)}
.qmeta{font-size:.67rem;font-weight:700;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.qdots{display:flex;gap:5px}
.qdot{width:7px;height:7px;border-radius:50%;background:var(--surf2);border:1px solid var(--bdr2);transition:all .3s}
.qdot.done{background:var(--accent);border-color:var(--accent)}
.qdot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#quiz-q{font-size:.97rem;font-weight:700;margin-bottom:15px;color:var(--txt);line-height:1.55;letter-spacing:-.01em}
#quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--surf2);border:1px solid var(--bdr2);border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;font-family:inherit;font-size:.83rem;color:var(--txt2);transition:all .15s;display:flex;align-items:center;gap:8px}
.opt:hover{background:var(--surf);border-color:var(--amid);color:var(--txt);transform:translateY(-1px)}
.opt.sel{border-color:var(--accent);background:var(--adim);color:var(--accent)}
.opt-l{font-size:.66rem;font-weight:700;color:var(--muted);background:var(--surf);border:1px solid var(--bdr);border-radius:5px;padding:1px 6px;flex-shrink:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(11,23,48,.92);backdrop-filter:blur(14px);border:1px solid rgba(100,140,255,.18);color:#fff;font-family:inherit;font-size:.8rem;font-weight:500;padding:11px 20px;border-radius:28px;box-shadow:0 6px 28px rgba(37,99,235,.18);opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Responsive ── */
@media(max-width:700px){
  body{height:auto !important;overflow:visible !important;overflow-x:hidden}
  .layout{grid-template-columns:1fr;overflow:visible !important}
  .main{overflow-y:visible !important}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:272px;z-index:110;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 32px rgba(37,99,235,.1)}
  .sidebar.open{transform:translateX(0)}
  .sb-ov{display:block}
  #sb-tog{display:flex !important}
  .panel{padding:16px 15px 44px}
  .fgrid{grid-template-columns:1fr}
  #quiz-opts{grid-template-columns:1fr}
  .btn-row{flex-wrap:wrap;gap:8px}
  .lesson-title{font-size:1.2rem}
  #vp.floating{width:245px !important;bottom:62px !important;right:10px !important}
}
@media(max-width:400px){.tab-btn{padding:5px 8px;font-size:.69rem}}
</style>
</head>
<body style="visibility:hidden">
<noscript><div style="padding:40px;text-align:center;font-family:system-ui"><h2>JavaScript Required</h2><p>Enable JS to use UE School. <a href="login.html">Log in</a>.</p></div></noscript>

<div id="exp-banner">Your subscription has expired. <a href="pricing.html">Renew Now &rarr;</a></div>

<header>
  <button id="sb-tog" class="h-btn" onclick="CLASSROOM.toggleSidebar()">&#9776;</button>
  <a href="dashboard.html" class="h-btn" onclick="try{sessionStorage.setItem('ue_from_classroom','1')}catch(e){}">&#8249;</a>
  <a href="index.html" class="logo">UE School</a>
  <div class="hsep"></div>
  <div class="tabs" id="subject-tabs">
    <button class="tab-btn active" data-subject="mathematics" onclick="CLASSROOM.switchSubject('mathematics',this)">Mathematics</button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sb-hd">
      <div class="sb-subj" id="sb-subj">Mathematics</div>
      <div class="sb-cnt"  id="sb-cnt">Loading&hellip;</div>
    </div>
    <div id="topic-list">
      <div style="padding:22px 14px;text-align:center;color:var(--muted);font-size:.81rem">Loading&hellip;</div>
    </div>
  </aside>

  <main class="main">

    <!-- ═══ VIDEO PLAYER ═══════════════════════════════════════════ -->
    <div class="vp-outer" id="vp-outer">
      <div id="vp-hint">&#9654;&nbsp;Video is playing below &mdash; scroll up to see it</div>

      <!--
        #vp uses data-state to control which child is visible:
          "empty"   → placeholder
          "loading" → spinner
          "playing" → iframe
        Exactly ONE child is visible at a time — no overlapping possible.
      -->
      <div id="vp" data-state="empty">

        <!-- Float bar (mini-player controls) -->
        <div id="vp-float-bar">
          <span class="fp-lbl">Now Playing</span>
          <button class="fp-close" onclick="CLASSROOM.stopFloat()">&#x2715;</button>
        </div>

        <!-- State: empty ────────────────────────────── -->
        <div id="vp-empty">
          <div class="vp-ring" onclick="CLASSROOM.playVideo(null)">&#9654;</div>
          <div class="vp-hint-txt">Select a topic to begin</div>
        </div>

        <!-- State: loading ──────────────────────────── -->
        <div id="vp-spin">
          <div class="vp-spinner"></div>
          <div class="vp-loading-txt">Loading video&hellip;</div>
        </div>

        <!-- State: playing ──────────────────────────── -->
        <!-- iframe injected/removed here by JS         -->

        <!-- Overlays (always above iframe, z-index:4) -->
        <div id="vp-wm"></div>      <!-- watermark -->
        <div id="vp-blk"></div>     <!-- GDrive arrow blocker -->
        <div id="vp-badge"></div>   <!-- tier badge -->

      </div><!-- /#vp -->
    </div>
    <!-- ═══════════════════════════════════════════════════════════ -->

    <div class="panel">

      <div class="tier-row" id="tier-row" style="display:none">

<!--
  CRITICAL LOAD ORDER — DO NOT REORDER
  1. supabase       → window.supabase
  2. auth.js        → window.sb
  3. auth-guard.js  → AUTH_GUARD
  4-7. Skill Chamber deps (storage, skill_questions, curriculum, intervention_modal)
  8. gdrive-video.js  MUST be before gsheet-curriculum
  9. gsheet-curriculum.js → GSHEET_CURRICULUM
  10. classroom.js  → CLASSROOM  (this file)
  11. skill_chamber.js → monkey-patches CLASSROOM.loadTopic
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>
<script src="js/storage.js"></script>
<script src="js/skill_questions.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/intervention_modal.js"></script>
<script src="js/gdrive-video.js"></script>
<script src="js/gsheet-curriculum.js"></script>
<script src="js/classroom.js"></script>
<script src="js/skill_chamber.js"></script>

<script>
function toast(msg, dur) {
  dur = dur || 2800;
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, dur);
}

document.addEventListener('DOMContentLoaded', async function() {
  var results = await Promise.all([
    AUTH_GUARD.init(),
    (async function(){
      if (!window.GSHEET_CURRICULUM || !GSHEET_CURRICULUM.isEnabled()) return;
      try { await GSHEET_CURRICULUM.init(); }
      catch(e) { console.error('[classroom] sheet init threw:', e); }
    })()
  ]);

  var authData = results[0];
  if (!authData) return;

  CLASSROOM.mergeSheetIntoCurriculum();
  window._ueProfile = authData.profile;
  await CLASSROOM.init(authData);

  /* Mini-player: activates when #vp-outer scrolls out of view */
  var outer = document.getElementById('vp-outer');
  if (outer && window.IntersectionObserver) {
    new IntersectionObserver(function(entries) {
      var vp   = document.getElementById('vp');
      var hint = document.getElementById('vp-hint');
      var playing = vp && vp.dataset.state === 'playing';
      if (!playing) return;
      var gone = !entries[0].isIntersecting;
      if (gone) { vp.classList.add('floating'); if(hint) hint.classList.add('show'); }
      else       { vp.classList.remove('floating'); if(hint) hint.classList.remove('show'); }
    }, { threshold: 0, rootMargin: '-56px 0px 0px 0px' }).observe(outer);
  }
});
</script>
