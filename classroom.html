<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var LOGIN = 'login.html';
  var page  = window.location.pathname.split('/').pop() || '';
  var h = window.location.hash || '', s = window.location.search || '';
  if (h.indexOf('access_token=') !== -1 || h.indexOf('type=') !== -1 ||
      /[?&](code|token_hash|token)=/.test(s)) return;
  var hasSession = false;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
        var val = localStorage.getItem(k);
        if (val && val.length > 10) { hasSession = true; break; }
      }
    }
  } catch(e) {}
  if (!hasSession) {
    window.location.replace(LOGIN + '?next=' + encodeURIComponent(page));
  }
})();
</script>

  <style>
:root{
  --bg:#f0f4ff;--surface:#fff;--surface2:#e8f0fe;--surface3:#d6e4fd;
  --border:rgba(79,142,255,.12);--border2:rgba(79,142,255,.22);
  --accent:#2563eb;--accent2:#0ea5e9;--accent3:#f97316;
  --muted:#6b7280;--muted2:#4b5563;--text:#0f1c3f;--text2:#1e3a6e;
  --font-head:'DM Sans','Segoe UI',system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;--font-body:'DM Sans',"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",sans-serif;
  --radius:12px;--radius-lg:18px;--glow:0 0 40px rgba(37,99,235,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background-image:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(37,99,235,.08) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 110%,rgba(14,165,233,.06) 0%,transparent 60%)}

#defaulter-banner{background:linear-gradient(90deg,#7c2d12,#9a3412,#7c2d12);background-size:200% 100%;animation:bannerShift 4s linear infinite;color:#fde8d0;font-family:var(--font-body);font-size:.78rem;font-weight:500;letter-spacing:.02em;text-align:center;padding:8px 20px;flex-shrink:0;display:none}
#defaulter-banner a{color:#fed7aa;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(253,215,170,.4);margin-left:6px;transition:color .2s}
#defaulter-banner a:hover{color:#fff}
@keyframes bannerShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}

header{flex-shrink:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:relative;z-index:50}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.3),transparent)}
.nav-inner{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav-left{display:flex;align-items:center;gap:14px}
.btn-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:1.3rem;line-height:1;text-decoration:none;transition:background .2s,border-color .2s,transform .15s;cursor:pointer}
.btn-icon:hover{background:var(--surface3);border-color:rgba(79,142,255,.3);transform:translateX(-2px)}
.nav-logo{font-family:'DM Sans','Segoe UI',system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:.95rem;font-weight:800;letter-spacing:-.02em;text-transform:none;text-decoration:none;color:var(--text);background:linear-gradient(135deg,#0f1c3f 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.subject-tabs{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px}
.subject-tab{font-family:var(--font-body);font-size:.78rem;font-weight:500;color:var(--muted2);background:transparent;border:none;padding:6px 14px;border-radius:7px;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.01em}
.subject-tab:hover{color:var(--text);background:var(--surface3)}
.subject-tab.active{background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(37,99,235,.08));color:#1d4ed8;border:1px solid rgba(37,99,235,.3);font-weight:600}

.classroom-layout{flex:1;display:grid;grid-template-columns:280px 1fr;overflow:hidden;min-height:0}

.classroom-sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:20px 18px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.sidebar-head h2{font-family:var(--font-head);font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:var(--text);margin-bottom:4px}
.sidebar-meta{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sidebar-meta::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
#topic-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
#topic-list::-webkit-scrollbar{width:4px}
#topic-list::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
.topic-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;transition:all .2s;color:var(--text2);font-family:var(--font-body);font-size:.82rem;font-weight:400;margin-bottom:3px;position:relative}
.topic-item:hover:not(.locked){background:var(--surface2);border-color:var(--border2);color:var(--text)}
.topic-item.active{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(37,99,235,.05));border-color:rgba(37,99,235,.3);color:#1d4ed8;font-weight:600}
.topic-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:0 3px 3px 0;box-shadow:0 0 8px var(--accent)}
.topic-item.locked{opacity:.5;cursor:not-allowed}
.topic-text{flex:1}

.classroom-main{overflow-y:auto;padding:0 0 28px;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
.classroom-main::-webkit-scrollbar{width:5px}
.classroom-main::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
.content-inner{max-width:760px;margin:0 auto;animation:fadeUp .5s ease both;padding:28px 32px 0}
.video-outer{width:100%;animation:fadeUp .5s ease both;position:sticky;top:0;z-index:40;background:var(--bg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.video-area{width:100%;aspect-ratio:16/9;background:#0a0f1e;border-radius:0;border:none;border-bottom:1px solid rgba(79,142,255,.18);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 4px 24px rgba(0,0,0,.5);transition:all .35s cubic-bezier(.4,0,.2,1)}
.video-area:hover{box-shadow:0 12px 60px rgba(0,0,0,.7),0 0 40px rgba(79,142,255,.15)}
.video-area.floating{
  position:fixed !important;
  bottom:20px !important;
  right:16px !important;
  top:auto !important;
  left:auto !important;
  width:280px !important;
  aspect-ratio:16/9 !important;
  z-index:9999 !important;
  border-radius:12px !important;
  box-shadow:0 8px 40px rgba(0,0,0,.7),0 0 0 1px rgba(79,142,255,.3) !important;
  cursor:default !important;
  transition:none !important;
  will-change:transform !important;
}
.video-float-bar{display:none;position:absolute;top:0;left:0;right:0;height:28px;background:linear-gradient(180deg,rgba(10,15,30,.95),transparent);z-index:12;align-items:center;justify-content:space-between;padding:0 8px;border-radius:12px 12px 0 0}
.video-area.floating .video-float-bar{display:flex}
.video-float-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:.85rem;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}
.video-float-close:hover{background:rgba(255,255,255,.1);color:#fff}
.video-float-label{font-size:.6rem;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}
.video-placeholder-box{width:100%;aspect-ratio:16/9;background:rgba(79,142,255,.04);border:2px dashed rgba(79,142,255,.15);border-radius:var(--radius-lg);display:none;align-items:center;justify-content:center;color:rgba(79,142,255,.4);font-size:.8rem;letter-spacing:.06em}
.video-placeholder-box.visible{display:flex}
@media(max-width:720px){
  .video-area.floating{
    width:260px !important;
    bottom:72px !important;
    right:10px !important;
  }
}
/* Drive "open in new tab" blocker */
.video-drive-cover{position:absolute;top:0;right:0;width:120px;height:80px;z-index:10;background:transparent;pointer-events:all}
/* Loading skeleton shimmer */
.video-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,#0d1428 25%,#162040 50%,#0d1428 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.video-skeleton-spinner{width:36px;height:36px;border:3px solid rgba(79,142,255,.2);border-top-color:#4f8eff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.video-skeleton-text{font-size:.75rem;color:rgba(255,255,255,.3);letter-spacing:.08em}
/* Tier badge */
.video-tier-badge{position:absolute;top:12px;left:12px;z-index:8;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;backdrop-filter:blur(8px)}
.tier-foundation{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
.tier-standard{background:rgba(79,142,255,.15);color:#4f8eff;border:1px solid rgba(79,142,255,.3)}
.tier-mastery{background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}
.video-bg{position:absolute;inset:0;background:linear-gradient(135deg,#c7d9f8,#dbeafe,#bfdbfe);background-size:300% 300%;animation:videoBgShift 8s ease infinite}
@keyframes videoBgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.video-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);background-size:40px 40px}
.video-play-btn{position:relative;z-index:2;width:72px;height:72px;background:linear-gradient(135deg,rgba(79,142,255,.9),rgba(99,102,241,.8));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;box-shadow:0 0 0 12px rgba(79,142,255,.12),0 8px 24px rgba(79,142,255,.4);transition:transform .25s,box-shadow .25s;padding-left:5px}
.video-area:hover .video-play-btn{transform:scale(1.1);box-shadow:0 0 0 18px rgba(79,142,255,.1),0 12px 32px rgba(79,142,255,.5)}
.video-play-btn::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(79,142,255,.3);animation:pulse-ring 2.5s ease-out infinite}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.video-duration{position:absolute;bottom:14px;right:16px;z-index:3;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);color:var(--text2);font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);letter-spacing:.04em}
.video-locked{position:absolute;inset:0;z-index:5;background:rgba(240,244,255,.92);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.video-locked h3{font-family:var(--font-head);font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.video-locked p{color:rgba(15,28,63,.55);margin-bottom:22px;font-size:.9rem}

.lesson-meta-row{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.topic-tag{background:rgba(37,99,235,.1);color:#1d4ed8;font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(37,99,235,.2);letter-spacing:.05em;text-transform:uppercase}
.lesson-duration{color:var(--muted);font-size:.78rem;display:flex;align-items:center;gap:5px}
.lesson-duration::before{content:'◷';color:var(--muted2);font-size:.85rem}
.topic-title{font-family:var(--font-body);font-size:1.6rem;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:16px;letter-spacing:-.025em}

.btn-row{display:flex;gap:12px;padding-bottom:26px;border-bottom:1px solid var(--border);margin-bottom:28px}
.btn{font-family:var(--font-body);font-size:.85rem;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em;text-decoration:none}
.btn-lg{padding:11px 24px;font-size:.9rem}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 20px rgba(79,142,255,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(79,142,255,.45);filter:brightness(1.08)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-outline:hover{background:var(--surface2);color:var(--text)}

#lesson-content p{font-size:1rem;line-height:1.85;color:var(--text2);margin-bottom:24px}
#lesson-content h3{font-family:var(--font-head);font-size:1.2rem;font-weight:800;letter-spacing:-.025em;color:var(--text);margin-bottom:16px;margin-top:8px}
#lesson-content ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
#lesson-content ul li{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text2);font-size:.92rem;line-height:1.6;transition:border-color .2s,background .2s}
#lesson-content ul li:hover{border-color:rgba(79,142,255,.25);background:var(--surface3)}
#lesson-content ul li .bullet{color:var(--accent);font-size:1.1rem;margin-top:1px;flex-shrink:0}

.formula-box{background:linear-gradient(135deg,rgba(219,234,254,.9),rgba(191,219,254,.7));border:1px solid rgba(37,99,235,.2);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 24px rgba(37,99,235,.08)}
.formula-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.formula-box-label{text-transform:uppercase;font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.formula-box-label::before{content:'fx';background:rgba(79,142,255,.15);border:1px solid rgba(79,142,255,.25);color:var(--accent);font-family:var(--font-head);font-size:.7rem;padding:2px 7px;border-radius:5px}
.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formula-item{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:9px;padding:12px 16px;font-size:.95rem;color:var(--text);font-family:'DM Mono','Courier New',monospace;letter-spacing:.02em;transition:background .2s,border-color .2s}
.formula-item:hover{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.25)}

#quiz-section{padding-top:32px;border-top:1px solid var(--border)}
.card-body{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;box-shadow:0 4px 24px rgba(37,99,235,.07)}
#quiz-q-num-row{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.06em}
.quiz-dots{display:flex;gap:5px}
.quiz-dot{width:7px;height:7px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);transition:background .3s}
.quiz-dot.done{background:var(--accent2);border-color:var(--accent2)}
.quiz-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent)}
#quiz-question{font-size:1.05rem;font-weight:700;margin-bottom:22px;color:var(--text);line-height:1.55;font-family:var(--font-head);letter-spacing:-.01em}
#quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drill-option{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:13px 16px;text-align:left;cursor:pointer;font-family:var(--font-body);font-size:.88rem;color:var(--text2);font-weight:400;transition:all .2s;display:flex;align-items:center;gap:10px}
.drill-option:hover{background:var(--surface3);border-color:rgba(79,142,255,.35);color:var(--text);transform:translateY(-1px)}
.drill-option.selected{border-color:rgba(37,99,235,.5);background:rgba(37,99,235,.1);color:#1d4ed8}
.opt-label{font-family:var(--font-head);font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface3);border-radius:5px;padding:2px 7px;flex-shrink:0;letter-spacing:.03em}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,28,63,.92);backdrop-filter:blur(16px);border:1px solid var(--border2);color:#fff;font-family:var(--font-body);font-size:.85rem;font-weight:500;padding:12px 22px;border-radius:30px;box-shadow:0 8px 32px rgba(37,99,235,.25);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#sidebar-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:1.1rem;cursor:pointer;transition:background .2s}
#sidebar-toggle:hover{background:var(--surface3)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,28,63,.35);backdrop-filter:blur(3px);z-index:100;opacity:0;transition:opacity .25s}
.sidebar-overlay.open{opacity:1}

@media(max-width:720px){
  body{height:auto!important;overflow:visible!important;overflow-x:hidden}
  .classroom-layout{grid-template-columns:1fr;overflow:visible!important;min-height:0}
  .classroom-main{overflow-y:visible!important;padding:0 0 60px}
  .content-inner{padding:16px 16px 0}
  .classroom-sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:110;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 32px rgba(37,99,235,.12)}
  .classroom-sidebar.drawer-open{transform:translateX(0)}
  .sidebar-overlay{display:block;pointer-events:none}
  .sidebar-overlay.open{pointer-events:auto}
  #sidebar-toggle{display:flex}
  .topic-title{font-size:1.15rem}
  .subject-tabs{gap:2px;overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 120px)}
  .subject-tabs::-webkit-scrollbar{display:none}
  .subject-tab{padding:5px 10px;font-size:.72rem;white-space:nowrap}
  .formula-grid{grid-template-columns:1fr}
  #quiz-options{grid-template-columns:1fr}
  .btn-row{flex-wrap:wrap;gap:10px}
  .btn-lg{padding:10px 18px;font-size:.85rem}
  .nav-inner{padding:0 12px}
  .content-inner{max-width:100%}
  #defaulter-banner{font-size:.72rem;padding:7px 14px}
}
@media(max-width:400px){
  .subject-tab{padding:5px 8px;font-size:.68rem}
  .topic-title{font-size:1.15rem}
}

<!--
  ═══════════════════════════════════════════════════════════════════════
  ⚠️  CRITICAL PATH — SCRIPT LOADING ORDER FOR GSHEETS → VIDEO PIPELINE
  ═══════════════════════════════════════════════════════════════════════

  The scripts below MUST load in exactly this order.  Each script
  depends on globals or functions registered by earlier scripts.

  DO NOT reorder, remove, combine, or defer any of these tags.
  DO NOT add async or defer attributes — the load order is synchronous
  by design to guarantee globals exist when later scripts execute.

  DEPENDENCY GRAPH:
  ─────────────────
  supabase.min.js   → registers window.supabase (client library)
       ↓
  auth.js           → creates window.sb = supabase.createClient(...)
       ↓
  auth-guard.js     → registers AUTH_GUARD; reads window.sb + UE_CONFIG
       ↓
  ┌── storage.js           ┐
  ├── skill_questions.js   ├── Skill Chamber dependency chain:
  ├── curriculum.js        │   each reads the previous module's globals.
  └── intervention_modal.js┘   Load order within this group also matters.
       ↓
  gsheet-curriculum.js  → registers GSHEET_CURRICULUM; reads UE_CONFIG.
                           Must load BEFORE classroom.js because classroom.js
                           does NOT call GSHEET_CURRICULUM.init() internally (classroom.html handles it).
       ↓
  gdrive-video.js       → registers GDRIVE_VIDEO.embedUrl().
                           Must load BEFORE classroom.js AND before
                           gsheet-curriculum.js runs at runtime
                           (gsheet-curriculum uses it during normaliseVideoUrl).
       ↓
  classroom.js          → registers CLASSROOM; reads AUTH_GUARD, GSHEET_CURRICULUM,
                           GDRIVE_VIDEO, window.sb, CURRICULUM, TOPIC_BLUEPRINT.
                           This is the FINAL CONSUMER of the pipeline.
       ↓
  skill_chamber.js      → monkey-patches CLASSROOM.loadTopic.
                           Must load AFTER classroom.js so CLASSROOM exists.

  ═══════════════════════════════════════════════════════════════════════
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>

<!-- Skill Chamber dependencies — load order within this group matters -->
<script src="js/storage.js"></script>
<script src="js/skill_questions.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/intervention_modal.js"></script>

<!--
  ⚠️  LOAD ORDER IS CRITICAL — DO NOT REORDER THESE TWO TAGS.

  gdrive-video.js MUST load BEFORE gsheet-curriculum.js.
  gsheet-curriculum.js calls GDRIVE_VIDEO.embedUrl() inside
  normaliseVideoUrl(), which runs during GSHEET_CURRICULUM.init().
  init() is async and called from DOMContentLoaded — so by the time
  it executes, all scripts have parsed.  But keeping gdrive-video.js
  first is the safe, correct ordering and removes any edge-case risk.
-->
<script src="js/gdrive-video.js"></script>
<script src="js/gsheet-curriculum.js"></script>
<script src="js/classroom.js"></script>

<!--
  ⚠️  skill_chamber.js MUST come after classroom.js.
  It wraps (monkey-patches) CLASSROOM.loadTopic.
  If loaded before classroom.js, CLASSROOM is undefined and the patch fails.
-->
<script src="js/skill_chamber.js"></script>

<script>
function toast(msg, dur = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ═══════════════════════════════════════════════════════════════════
   CLASSROOM — INIT SEQUENCE
   ─────────────────────────────────────────────────────────────────
   Auth + sheet fetch run in parallel (Promise.all) to minimise
   the time between page load and first sidebar render.

   After both resolve:
     1. mergeSheetIntoCurriculum() — sheet topics → CURRICULUM
     2. window._ueProfile           — set for video watermark
     3. CLASSROOM.init()            — render sidebar + first video
═══════════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', async () => {
  /* ── Step 1: Auth + sheet fetch run in parallel ──────────────────
     Both are independent network requests.  We only need auth to
     succeed; sheet failure is non-fatal (classroom still works on
     built-in curriculum and we surface a warning in the sidebar). */
  const [authData] = await Promise.all([
    AUTH_GUARD.init(),
    (async () => {
      if (!window.GSHEET_CURRICULUM || !GSHEET_CURRICULUM.isEnabled()) return;
      try {
        await GSHEET_CURRICULUM.init();
      } catch (e) {
        // init() itself catches all errors internally, but wrap as a
        // safety net so a thrown error never aborts the Promise.all.
        console.error('[classroom.html] GSHEET_CURRICULUM.init() threw unexpectedly:', e);
      }
    })(),
  ]);

  /* Auth failed — AUTH_GUARD already redirected to login.html. */
  if (!authData) return;

  /* ── Step 2: Merge sheet topics into CURRICULUM ──────────────────
     Sheet data (if any) is now in window.TOPIC_BLUEPRINT.
     mergeSheetIntoCurriculum() injects it into CLASSROOM.CURRICULUM
     so renderSidebar() finds the topics immediately. */
  CLASSROOM.mergeSheetIntoCurriculum();

  /* ── Step 3: Surface any sheet load errors in the sidebar ────────
     This gives operators a clear, visible message in the classroom UI
     instead of silent "Loading topics…" that never resolves. */
  if (window.GSHEET_CURRICULUM) {
    const sheetError = GSHEET_CURRICULUM.getLastError && GSHEET_CURRICULUM.getLastError();
    if (sheetError) {
      // Inject a visible warning banner just below the nav
      const banner = document.createElement('div');
      banner.id = 'sheet-error-banner';
      banner.style.cssText = [
        'background:rgba(239,68,68,.08)',
        'border-bottom:1px solid rgba(239,68,68,.25)',
        'color:#b91c1c',
        'font-size:.78rem',
        'font-weight:500',
        'padding:8px 20px',
        'display:flex',
        'align-items:center',
        'gap:8px',
        'flex-shrink:0',
      ].join(';');
      banner.innerHTML = `<span style="font-size:1rem">⚠️</span>
        <span>Lesson sheet could not load — showing built-in content.
        <strong>Operator:</strong> ${sheetError.split('\n')[0]}
        <button onclick="this.closest('#sheet-error-banner').remove()"
          style="margin-left:10px;background:none;border:none;color:inherit;cursor:pointer;font-weight:700">✕</button>
        </span>`;
      // Insert after the header element
      const header = document.querySelector('header');
      if (header && header.nextSibling) {
        header.parentNode.insertBefore(banner, header.nextSibling);
      }
      console.warn('[classroom.html] Sheet load errors:\n' + sheetError);
    }
  }

  /* ── Step 4: Store profile for video watermark ───────────────────
     injectIframe() reads window._ueProfile to display the student
     name watermark.  Must be set before CLASSROOM.init() renders. */
  if (authData.profile) window._ueProfile = authData.profile;

  /* ── Step 5: Render sidebar and first lesson ──────────────────── */
  await CLASSROOM.init(authData);

  // Step 5: Float video when scrolled out of view
  // Uses a stable sentinel div — NOT the placeholder — to avoid observer loop blinking
  const videoArea   = document.getElementById('video-area');
  const placeholder = document.getElementById('video-placeholder-box');
  const sentinel    = document.getElementById('video-sentinel');

  if (videoArea && sentinel && 'IntersectionObserver' in window) {
    let isFloating = false;
    const videoOuter = document.getElementById('video-outer');

    function activateFloat() {
      if (isFloating) return;
      isFloating = true;
      // Lock container height so page doesn't collapse/fold
      if (videoOuter) {
        videoOuter.style.minHeight = videoOuter.getBoundingClientRect().height + 'px';
      }
      // Suppress any CSS transition so the video doesn't animate/slide
      videoArea.style.cssText = 'transition:none';
      videoArea.classList.add('floating');
      // Reinforce position via inline styles — overrides any cascade or leftover drag styles
      videoArea.style.position  = 'fixed';
      videoArea.style.bottom    = (window.innerWidth <= 720 ? '72' : '20') + 'px';
      videoArea.style.right     = (window.innerWidth <= 720 ? '10' : '16') + 'px';
      videoArea.style.top       = 'auto';
      videoArea.style.left      = 'auto';
      videoArea.style.width     = (window.innerWidth <= 720 ? '260' : '280') + 'px';
      videoArea.style.transition = '';
      if (placeholder) placeholder.classList.add('visible');
      enableDrag(videoArea); // enable drag-to-reposition once floating
    }

    function deactivateFloat() {
      if (!isFloating) return;
      isFloating = false;
      // Wipe ALL inline styles so the element returns to its natural in-flow styling
      videoArea.removeAttribute('style');
      videoArea.classList.remove('floating');
      if (placeholder) placeholder.classList.remove('visible');
      if (videoOuter) videoOuter.style.minHeight = '';
    }

    const obs = new IntersectionObserver((entries) => {
      const visible = entries[0].isIntersecting;
      if (!videoArea.querySelector('iframe')) return;
      if (!visible) activateFloat();
      else deactivateFloat();
    }, { threshold: 0.15, rootMargin: '0px' });

    obs.observe(sentinel);
  }
});

function enableDrag(el) {
  // Drag is desktop-only — on touch devices, pointer events from
  // scrolling would accidentally move the floating video.
  if (el._dragEnabled) return;
  el._dragEnabled = true;
  let sX, sY, oX, oY, dragging = false;

  el.addEventListener('pointerdown', e => {
    // Skip: touch input (would fight with scroll), iframes, close button
    if (e.pointerType === 'touch') return;
    if (e.target.closest('iframe') || e.target.closest('.video-float-close')) return;
    sX = e.clientX; sY = e.clientY;
    const r = el.getBoundingClientRect();
    oX = r.left; oY = r.top;
    dragging = false;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - sX, dy = e.clientY - sY;
    // Only start drag after a small threshold to avoid accidental moves
    if (!dragging && Math.hypot(dx, dy) < 6) return;
    dragging = true;
    el.style.transition = 'none';
    el.style.left   = Math.max(0, oX + dx) + 'px';
    el.style.top    = Math.max(0, oY + dy) + 'px';
    el.style.right  = 'auto';
    el.style.bottom = 'auto';
  });

  el.addEventListener('pointerup', () => {
    dragging = false;
    el.style.transition = '';
  });
}
</script>
