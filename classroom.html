<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var LOGIN = 'login.html';
  var page  = window.location.pathname.split('/').pop() || '';
  var h = window.location.hash || '', s = window.location.search || '';
  if (h.indexOf('access_token=') !== -1 || h.indexOf('type=') !== -1 ||
      /[?&](code|token_hash|token)=/.test(s)) return;
  var hasSession = false;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
        var val = localStorage.getItem(k);
        if (val && val.length > 10) { hasSession = true; break; }
      }
    }
  } catch(e) {}
  if (!hasSession) {
    window.location.replace(LOGIN + '?next=' + encodeURIComponent(page));
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom &mdash; UE School</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette — deeper navy + electric cobalt + warm amber accent */
  --bg:#f5f7ff;
  --surface:#ffffff;
  --surface2:#eef2ff;
  --surface3:#dde5ff;
  --border:rgba(67,97,238,.10);
  --border2:rgba(67,97,238,.20);
  --accent:#4361ee;
  --accent2:#4cc9f0;
  --accent3:#f4a261;
  --muted:#8892b0;
  --muted2:#5a6785;
  --text:#0d1b3e;
  --text2:#1a305f;
  --font-head:'Syne',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --font-body:'DM Sans',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --radius:12px;
  --radius-lg:18px;
  --glow:0 0 48px rgba(67,97,238,.14);
  --sidebar-w:272px;
  --header-h:58px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color:var(--text);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased}
body{
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 45% at 8% -5%, rgba(67,97,238,.09) 0%,transparent 65%),
    radial-gradient(ellipse 55% 35% at 92% 105%, rgba(76,201,240,.07) 0%,transparent 65%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(67,97,238,.03) 0%,transparent 80%);
}

/* ── Defaulter banner ── */
#defaulter-banner{
  background:linear-gradient(90deg,#6d1f00,#8b2800,#6d1f00);
  background-size:200% 100%;animation:bannerShift 4s linear infinite;
  color:#fde8d0;font-family:var(--font-body);font-size:.78rem;font-weight:500;
  letter-spacing:.02em;text-align:center;padding:8px 20px;flex-shrink:0;display:none;
}
#defaulter-banner a{color:#fdc99a;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(253,201,154,.35);margin-left:6px;transition:color .2s}
#defaulter-banner a:hover{color:#fff}
@keyframes bannerShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}

/* ── Header ── */
header{
  flex-shrink:0;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:50;
  box-shadow:0 1px 0 rgba(67,97,238,.06),0 4px 20px rgba(13,27,62,.04);
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(67,97,238,.4) 40%,rgba(76,201,240,.3) 60%,transparent 100%);
}
.nav-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav-left{display:flex;align-items:center;gap:12px}

.btn-icon{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font-size:1.3rem;line-height:1;text-decoration:none;
  transition:background .18s,border-color .18s,transform .15s,box-shadow .18s;cursor:pointer;
}
.btn-icon:hover{background:var(--surface3);border-color:rgba(67,97,238,.32);transform:translateX(-2px);box-shadow:0 2px 10px rgba(67,97,238,.12)}

.nav-logo{
  font-family:'Inter',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:.9rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  text-decoration:none;
  background:linear-gradient(125deg,#0d1b3e 0%,var(--accent) 70%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── Subject tabs ── */
.subject-tabs{
  display:flex;align-items:center;gap:3px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:3px;
}
.subject-tab{
  font-family:var(--font-body);font-size:.77rem;font-weight:500;
  color:var(--muted2);background:transparent;border:none;
  padding:6px 16px;border-radius:8px;cursor:pointer;
  transition:all .18s;white-space:nowrap;letter-spacing:.01em;
}
.subject-tab:hover{color:var(--text);background:var(--surface3)}
.subject-tab.active{
  background:#fff;color:var(--accent);font-weight:700;
  border:1px solid rgba(67,97,238,.25);
  box-shadow:0 1px 6px rgba(67,97,238,.14),0 2px 12px rgba(67,97,238,.08);
}

/* ── Layout ── */
.classroom-layout{flex:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;min-height:0}

/* ── Sidebar ── */
.classroom-sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:2px 0 16px rgba(13,27,62,.04);
}
.sidebar-head{
  padding:18px 16px 15px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(160deg,rgba(67,97,238,.05) 0%,rgba(255,255,255,0) 80%);
  position:relative;
}
.sidebar-head::after{
  content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(67,97,238,.15),transparent);
}
.sidebar-head h2{
  font-family:var(--font-head);font-size:1.1rem;font-weight:700;
  color:var(--text);margin-bottom:5px;letter-spacing:-.01em;
}
.sidebar-meta{
  font-size:.73rem;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.sidebar-meta::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent2);box-shadow:0 0 7px var(--accent2);flex-shrink:0;
}

#topic-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent}
#topic-list::-webkit-scrollbar{width:3px}
#topic-list::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}

.topic-item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:transparent;border:1px solid transparent;
  border-radius:10px;padding:9px 11px;
  text-align:left;cursor:pointer;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  color:var(--muted2);font-family:var(--font-body);
  font-size:.81rem;font-weight:400;margin-bottom:2px;position:relative;
}
.topic-item:hover:not(.locked){
  background:var(--surface2);border-color:var(--border2);
  color:var(--text);transform:translateX(2px);
}
.topic-item.active{
  background:linear-gradient(135deg,rgba(67,97,238,.11) 0%,rgba(67,97,238,.04) 100%);
  border-color:rgba(67,97,238,.28);color:var(--accent);font-weight:600;
  box-shadow:0 2px 12px rgba(67,97,238,.1);
}
.topic-item.active::before{
  content:'';position:absolute;left:0;top:20%;bottom:20%;
  width:3px;background:var(--accent);border-radius:0 3px 3px 0;
  box-shadow:0 0 10px rgba(67,97,238,.6);
}
.topic-item.locked{opacity:.45;cursor:not-allowed}
.topic-text{flex:1;line-height:1.35}

/* ── Main content area ── */
.classroom-main{
  overflow-y:auto;padding:0 0 40px;background:var(--bg);
  scrollbar-width:thin;scrollbar-color:var(--surface3) transparent;
}
.classroom-main::-webkit-scrollbar{width:4px}
.classroom-main::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}

.content-inner{max-width:760px;margin:0 auto;animation:fadeUp .45s ease both;padding:28px 32px 0}
.video-outer{width:100%;animation:fadeUp .45s ease both;position:sticky;top:0;z-index:40;background:var(--bg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Video area ── */
.video-area{
  width:100%;aspect-ratio:16/9;
  background:#060d1f;
  border-radius:0;border:none;
  border-bottom:1px solid rgba(67,97,238,.16);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;cursor:pointer;
  box-shadow:0 6px 32px rgba(0,0,0,.55),0 1px 0 rgba(67,97,238,.12) inset;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.video-area:hover{box-shadow:0 14px 64px rgba(0,0,0,.7),0 0 48px rgba(67,97,238,.18)}
.video-area.floating{
  position:fixed !important;bottom:20px !important;right:16px !important;
  top:auto !important;left:auto !important;width:280px !important;aspect-ratio:16/9 !important;
  z-index:9999 !important;border-radius:14px !important;
  box-shadow:0 10px 48px rgba(0,0,0,.75),0 0 0 1px rgba(67,97,238,.35) !important;
  cursor:default !important;transition:none !important;will-change:transform !important;
}
.video-float-bar{
  display:none;position:absolute;top:0;left:0;right:0;height:30px;
  background:linear-gradient(180deg,rgba(6,13,31,.96),transparent);
  z-index:12;align-items:center;justify-content:space-between;
  padding:0 10px;border-radius:14px 14px 0 0;
}
.video-area.floating .video-float-bar{display:flex}
.video-float-close{background:none;border:none;color:rgba(255,255,255,.65);font-size:.85rem;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}
.video-float-close:hover{background:rgba(255,255,255,.12);color:#fff}
.video-float-label{font-size:.58rem;color:rgba(255,255,255,.38);letter-spacing:.08em;text-transform:uppercase}
.video-placeholder-box{
  width:100%;aspect-ratio:16/9;
  background:rgba(67,97,238,.03);border:2px dashed rgba(67,97,238,.14);
  border-radius:var(--radius-lg);display:none;align-items:center;justify-content:center;
  color:rgba(67,97,238,.38);font-size:.8rem;letter-spacing:.06em;
}
.video-placeholder-box.visible{display:flex}
@media(max-width:720px){
  .video-area.floating{width:260px !important;bottom:72px !important;right:10px !important;}
}

/* Drive cover */
.video-drive-cover{position:absolute;top:0;right:0;width:72px;height:56px;z-index:10;background:transparent;pointer-events:all}

/* Skeleton */
.video-skeleton{
  position:absolute;inset:0;
  background:linear-gradient(90deg,#08102a 25%,#0f1f42 50%,#08102a 75%);
  background-size:200% 100%;animation:shimmer 1.7s infinite;
  z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.video-skeleton-spinner{
  width:38px;height:38px;
  border:2.5px solid rgba(67,97,238,.22);border-top-color:#4361ee;
  border-radius:50%;animation:spin .85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.video-skeleton-text{font-size:.73rem;color:rgba(255,255,255,.28);letter-spacing:.09em}

/* Tier badge */
.video-tier-badge{position:absolute;top:12px;left:12px;z-index:8;font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;backdrop-filter:blur(10px)}
.tier-foundation{background:rgba(244,162,97,.14);color:#f4a261;border:1px solid rgba(244,162,97,.3)}
.tier-standard{background:rgba(67,97,238,.15);color:#5f7cee;border:1px solid rgba(67,97,238,.3)}
.tier-mastery{background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}

/* Video placeholder bg */
.video-bg{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#0d1f4a,#1a2f6b,#0a1635);
  background-size:300% 300%;animation:videoBgShift 9s ease infinite;
}
@keyframes videoBgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.video-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(67,97,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(67,97,238,.06) 1px,transparent 1px);
  background-size:44px 44px;
}

/* Play button */
.video-play-btn{
  position:relative;z-index:2;
  width:72px;height:72px;
  background:linear-gradient(135deg,rgba(67,97,238,.95),rgba(99,102,241,.85));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.55rem;color:#fff;padding-left:5px;
  box-shadow:0 0 0 14px rgba(67,97,238,.1),0 8px 28px rgba(67,97,238,.45);
  transition:transform .22s,box-shadow .22s;
}
.video-area:hover .video-play-btn{transform:scale(1.1);box-shadow:0 0 0 20px rgba(67,97,238,.09),0 12px 36px rgba(67,97,238,.55)}
.video-play-btn::before{
  content:'';position:absolute;inset:-14px;border-radius:50%;
  border:1.5px solid rgba(67,97,238,.32);
  animation:pulse-ring 2.6s ease-out infinite;
}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.65}100%{transform:scale(1.65);opacity:0}}

/* Duration badge */
.video-duration{
  position:absolute;bottom:12px;right:14px;z-index:3;
  background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
  color:var(--text2);font-size:.7rem;font-weight:700;
  padding:3px 9px;border-radius:6px;border:1px solid var(--border2);letter-spacing:.04em;
}

/* Locked overlay */
.video-locked{
  position:absolute;inset:0;z-index:5;
  background:rgba(245,247,255,.94);backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.video-locked h3{font-family:var(--font-head);font-size:1.55rem;font-weight:800;margin-bottom:8px}
.video-locked p{color:rgba(13,27,62,.5);margin-bottom:22px;font-size:.9rem}

/* ── Lesson metadata ── */
.lesson-meta-row{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.topic-tag{
  background:rgba(67,97,238,.09);color:var(--accent);
  font-size:.7rem;font-weight:700;padding:4px 12px;
  border-radius:20px;border:1px solid rgba(67,97,238,.2);
  letter-spacing:.06em;text-transform:uppercase;
}
.lesson-duration{color:var(--muted);font-size:.77rem;display:flex;align-items:center;gap:5px}
.lesson-duration::before{content:'◷';color:var(--muted2);font-size:.85rem}

.topic-title{
  font-family:var(--font-head);font-size:2.1rem;font-weight:800;
  color:var(--text);line-height:1.15;margin-bottom:22px;letter-spacing:-.025em;
}

/* ── CTA Buttons ── */
.btn-row{
  display:flex;gap:10px;padding-bottom:26px;
  border-bottom:1px solid var(--border);margin-bottom:28px;
}
.btn{
  font-family:var(--font-body);font-size:.85rem;font-weight:600;
  border:none;border-radius:10px;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:7px;
  letter-spacing:.01em;text-decoration:none;
}
.btn-lg{padding:10px 22px;font-size:.88rem}
.btn-primary{
  background:linear-gradient(135deg,#4361ee,#5f7cee);
  color:#fff;box-shadow:0 4px 20px rgba(67,97,238,.32);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(67,97,238,.48);filter:brightness(1.07)}
.btn-outline{
  background:transparent;color:var(--text2);
  border:1px solid var(--border2);
}
.btn-outline:hover{background:var(--surface2);color:var(--accent);border-color:rgba(67,97,238,.28)}

/* ── Lesson content ── */
#lesson-content p{font-size:1rem;line-height:1.9;color:var(--text2);margin-bottom:22px}
#lesson-content h3{font-family:var(--font-head);font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:14px;margin-top:6px}
#lesson-content ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
#lesson-content ul li{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 15px;
  color:var(--text2);font-size:.91rem;line-height:1.62;
  transition:border-color .18s,background .18s,box-shadow .18s;
  box-shadow:0 1px 4px rgba(13,27,62,.04);
}
#lesson-content ul li:hover{border-color:rgba(67,97,238,.22);background:var(--surface2);box-shadow:0 3px 12px rgba(67,97,238,.08)}
#lesson-content ul li .bullet{color:var(--accent);font-size:1.1rem;margin-top:1px;flex-shrink:0}

/* ── Formula box ── */
.formula-box{
  background:linear-gradient(140deg,rgba(221,229,255,.95) 0%,rgba(198,212,255,.75) 100%);
  border:1px solid rgba(67,97,238,.18);border-radius:var(--radius-lg);
  padding:20px 22px;margin-bottom:28px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 24px rgba(67,97,238,.1);
}
.formula-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),rgba(76,201,240,.6),transparent);
}
.formula-box-label{
  text-transform:uppercase;font-size:.67rem;font-weight:700;
  color:var(--accent);letter-spacing:.1em;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.formula-box-label::before{
  content:'fx';background:rgba(67,97,238,.12);border:1px solid rgba(67,97,238,.22);
  color:var(--accent);font-family:var(--font-head);font-size:.68rem;
  padding:2px 7px;border-radius:5px;
}
.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formula-item{
  background:rgba(255,255,255,.75);border:1px solid var(--border);
  border-radius:9px;padding:11px 15px;font-size:.93rem;color:var(--text);
  font-family:'DM Mono','Courier New',monospace;letter-spacing:.02em;
  transition:background .18s,border-color .18s,box-shadow .18s;
}
.formula-item:hover{background:rgba(67,97,238,.07);border-color:rgba(67,97,238,.22);box-shadow:0 2px 8px rgba(67,97,238,.1)}

/* ── Quick Check quiz ── */
#quiz-section{padding-top:32px;border-top:1px solid var(--border)}
.card-body{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);padding:24px;
  box-shadow:0 4px 24px rgba(67,97,238,.07),0 1px 0 rgba(67,97,238,.04) inset;
}
#quiz-q-num-row{
  font-size:.7rem;font-weight:700;color:var(--muted);
  margin-bottom:14px;display:flex;align-items:center;gap:10px;
  text-transform:uppercase;letter-spacing:.07em;
}
.quiz-dots{display:flex;gap:5px}
.quiz-dot{width:7px;height:7px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);transition:background .28s,box-shadow .28s}
.quiz-dot.done{background:var(--accent2);border-color:var(--accent2)}
.quiz-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 7px rgba(67,97,238,.6)}
#quiz-question{font-size:1.07rem;font-weight:700;margin-bottom:20px;color:var(--text);line-height:1.5;font-family:var(--font-head)}
#quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.drill-option{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;padding:12px 15px;text-align:left;cursor:pointer;
  font-family:var(--font-body);font-size:.87rem;color:var(--text2);font-weight:400;
  transition:all .18s;display:flex;align-items:center;gap:10px;
}
.drill-option:hover{background:var(--surface3);border-color:rgba(67,97,238,.32);color:var(--text);transform:translateY(-1px);box-shadow:0 3px 10px rgba(67,97,238,.1)}
.drill-option.selected{border-color:rgba(67,97,238,.5);background:rgba(67,97,238,.09);color:var(--accent)}
.opt-label{
  font-family:var(--font-head);font-size:.7rem;font-weight:700;
  color:var(--muted);background:var(--surface3);
  border-radius:5px;padding:2px 7px;flex-shrink:0;letter-spacing:.04em;
  transition:background .18s,color .18s;
}
.drill-option.selected .opt-label{background:rgba(67,97,238,.14);color:var(--accent)}

/* ── Toast ── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(10,18,50,.93);backdrop-filter:blur(18px);
  border:1px solid rgba(67,97,238,.28);color:#fff;
  font-family:var(--font-body);font-size:.84rem;font-weight:500;
  padding:11px 22px;border-radius:30px;
  box-shadow:0 8px 36px rgba(67,97,238,.28);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  z-index:9999;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Mobile sidebar toggle ── */
#sidebar-toggle{
  display:none;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font-size:1.1rem;cursor:pointer;transition:background .18s;
}
#sidebar-toggle:hover{background:var(--surface3)}
.sidebar-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(10,18,50,.3);backdrop-filter:blur(4px);
  z-index:100;opacity:0;transition:opacity .25s;
}
.sidebar-overlay.open{opacity:1}

/* ── Responsive ── */
@media(max-width:720px){
  body{height:auto!important;overflow:visible!important;overflow-x:hidden}
  .classroom-layout{grid-template-columns:1fr;overflow:visible!important;min-height:0}

  .classroom-sidebar{

<!--
  ═══════════════════════════════════════════════════════════════════════
  ⚠️  CRITICAL PATH — SCRIPT LOADING ORDER FOR GSHEETS → VIDEO PIPELINE
  ═══════════════════════════════════════════════════════════════════════

  The scripts below MUST load in exactly this order.  Each script
  depends on globals or functions registered by earlier scripts.

  DO NOT reorder, remove, combine, or defer any of these tags.
  DO NOT add async or defer attributes — the load order is synchronous
  by design to guarantee globals exist when later scripts execute.

  DEPENDENCY GRAPH:
  ─────────────────
  supabase.min.js   → registers window.supabase (client library)
       ↓
  auth.js           → creates window.sb = supabase.createClient(...)
       ↓
  auth-guard.js     → registers AUTH_GUARD; reads window.sb + UE_CONFIG
       ↓
  ┌── storage.js           ┐
  ├── skill_questions.js   ├── Skill Chamber dependency chain:
  ├── curriculum.js        │   each reads the previous module's globals.
  └── intervention_modal.js┘   Load order within this group also matters.
       ↓
  gsheet-curriculum.js  → registers GSHEET_CURRICULUM; reads UE_CONFIG.
                           Must load BEFORE classroom.js because classroom.js
                           does NOT call GSHEET_CURRICULUM.init() internally (classroom.html handles it).
       ↓
  gdrive-video.js       → registers GDRIVE_VIDEO.embedUrl().
                           Must load BEFORE classroom.js AND before
                           gsheet-curriculum.js runs at runtime
                           (gsheet-curriculum uses it during normaliseVideoUrl).
       ↓
  classroom.js          → registers CLASSROOM; reads AUTH_GUARD, GSHEET_CURRICULUM,
                           GDRIVE_VIDEO, window.sb, CURRICULUM, TOPIC_BLUEPRINT.
                           This is the FINAL CONSUMER of the pipeline.
       ↓
  skill_chamber.js      → monkey-patches CLASSROOM.loadTopic.
                           Must load AFTER classroom.js so CLASSROOM exists.

  ═══════════════════════════════════════════════════════════════════════
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>

<!--

  gsheet-curriculum.js must still load before classroom.js so the global exists.
-->
<script src="js/gsheet-curriculum.js"></script>

<!--
  ⚠️  gdrive-video.js MUST come before classroom.js.
  classroom.js calls GDRIVE_VIDEO.embedUrl() inside renderLesson().
  gsheet-curriculum.js also calls it at runtime (inside normaliseVideoUrl).
  Both require GDRIVE_VIDEO to be registered before they execute.
-->
<script src="js/gdrive-video.js"></script>
<script src="js/classroom.js"></script>

<!--
  ⚠️  skill_chamber.js MUST come after classroom.js.
  It wraps (monkey-patches) CLASSROOM.loadTopic.
  If loaded before classroom.js, CLASSROOM is undefined and the patch fails.
-->
<script src="js/skill_chamber.js"></script>

<script>
function toast(msg, dur = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ═══════════════════════════════════════════════════════════════════
   CLASSROOM — INIT SEQUENCE
   ─────────────────────────────────────────────────────────────────
   Auth + sheet fetch run in parallel (Promise.all) to minimise
   the time between page load and first sidebar render.

   After both resolve:
     1. mergeSheetIntoCurriculum() — sheet topics → CURRICULUM
     2. window._ueProfile           — set for video watermark
     3. CLASSROOM.init()            — render sidebar + first video
═══════════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', async () => {
  /* Fire auth + sheet fetch in parallel — both are independent network
     requests. This shaves ~300-400ms off the time to first sidebar render
     compared to the previous sequential approach. */
  const [authData] = await Promise.all([
    AUTH_GUARD.init(),
    GSHEET_CURRICULUM.init(),   // runs concurrently with auth
  ]);

  /* Auth failed — AUTH_GUARD already redirected to login.html. */
  if (!authData) return;

  /* Both auth and sheet data are ready. Merge sheet topics into
     CURRICULUM before CLASSROOM.init() renders the sidebar. */
  CLASSROOM.mergeSheetIntoCurriculum();

  /* Store profile globally for video watermark (injectIframe reads it). */
  if (authData.profile) window._ueProfile = authData.profile;

  /* Render — CURRICULUM is fully merged, profile is set. */
  await CLASSROOM.init(authData); // authData already fetched above — no second auth round-trip

  // Step 5: Float video when scrolled out of view
  // Uses a stable sentinel div — NOT the placeholder — to avoid observer loop blinking
  const videoArea   = document.getElementById('video-area');
  const placeholder = document.getElementById('video-placeholder-box');
  const sentinel    = document.getElementById('video-sentinel');

  if (videoArea && sentinel && 'IntersectionObserver' in window) {
    let isFloating = false;
    const videoOuter = document.getElementById('video-outer');

    function activateFloat() {
      if (isFloating) return;
      isFloating = true;
      // Lock container height so page doesn't collapse/fold
      if (videoOuter) {
        videoOuter.style.minHeight = videoOuter.getBoundingClientRect().height + 'px';
      }
      // Suppress any CSS transition so the video doesn't animate/slide
      videoArea.style.cssText = 'transition:none';
      videoArea.classList.add('floating');
      // Reinforce position via inline styles — overrides any cascade or leftover drag styles
      videoArea.style.position  = 'fixed';
      videoArea.style.bottom    = (window.innerWidth <= 720 ? '72' : '20') + 'px';
      videoArea.style.right     = (window.innerWidth <= 720 ? '10' : '16') + 'px';
      videoArea.style.top       = 'auto';
      videoArea.style.left      = 'auto';
      videoArea.style.width     = (window.innerWidth <= 720 ? '260' : '280') + 'px';
      videoArea.style.transition = '';
      if (placeholder) placeholder.classList.add('visible');
      enableDrag(videoArea); // enable drag-to-reposition once floating
    }

    function deactivateFloat() {
      if (!isFloating) return;
      isFloating = false;
      // Wipe ALL inline styles so the element returns to its natural in-flow styling
      videoArea.removeAttribute('style');
      videoArea.classList.remove('floating');
      if (placeholder) placeholder.classList.remove('visible');
      if (videoOuter) videoOuter.style.minHeight = '';
    }

    const obs = new IntersectionObserver((entries) => {
      const visible = entries[0].isIntersecting;
      if (!videoArea.querySelector('iframe')) return;
      if (!visible) activateFloat();
      else deactivateFloat();
    }, { threshold: 0.15, rootMargin: '0px' });

    obs.observe(sentinel);
  }
});

function enableDrag(el) {
  // Drag is desktop-only — on touch devices, pointer events from
  // scrolling would accidentally move the floating video.
  if (el._dragEnabled) return;
  el._dragEnabled = true;
  let sX, sY, oX, oY, dragging = false;

  el.addEventListener('pointerdown', e => {
    // Skip: touch input (would fight with scroll), iframes, close button
    if (e.pointerType === 'touch') return;
    if (e.target.closest('iframe') || e.target.closest('.video-float-close')) return;
    sX = e.clientX; sY = e.clientY;
    const r = el.getBoundingClientRect();
    oX = r.left; oY = r.top;
    dragging = false;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - sX, dy = e.clientY - sY;
    // Only start drag after a small threshold to avoid accidental moves
    if (!dragging && Math.hypot(dx, dy) < 6) return;
    dragging = true;
    el.style.transition = 'none';
    el.style.left   = Math.max(0, oX + dx) + 'px';
    el.style.top    = Math.max(0, oY + dy) + 'px';
    el.style.right  = 'auto';
    el.style.bottom = 'auto';
  });

  el.addEventListener('pointerup', () => {
    dragging = false;
    el.style.transition = '';
  });
}
</script>
