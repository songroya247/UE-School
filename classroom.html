<!DOCTYPE html>

<!-- ╔══════════════════════════════════════════════════════╗
     ║  INSTANT SESSION CHECK — must be the very first script  ║
     ╚══════════════════════════════════════════════════════╝ -->
<script>
(function(){
  var LOGIN = 'login.html';
  var page  = window.location.pathname.split('/').pop() || '';
  var h = window.location.hash || '', s = window.location.search || '';
  if (h.indexOf('access_token=') !== -1 || h.indexOf('type=') !== -1 ||
      /[?&](code|token_hash|token)=/.test(s)) return;
  var hasSession = false;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
        var val = localStorage.getItem(k);
        if (val && val.length > 10) { hasSession = true; break; }
      }
    }
  } catch(e) {}
  if (!hasSession) {
    window.location.replace(LOGIN + '?next=' + encodeURIComponent(page));
  }
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════ */
:root {
  --bg:          #f6f8fc;
  --surface:     #ffffff;
  --surface2:    #f0f3fb;
  --surface3:    #e4eaf8;
  --border:      rgba(15,30,80,.08);
  --border2:     rgba(15,30,80,.14);
  --accent:      #1a4ef5;
  --accent-dark: #1340d4;
  --accent-glow: rgba(26,78,245,.18);
  --sky:         #0ea5e9;
  --orange:      #f97316;
  --green:       #10b981;
  --purple:      #7c3aed;
  --text:        #0b1529;
  --text2:       #2c3e6b;
  --muted:       #64748b;
  --muted2:      #94a3b8;
  --sidebar-w:   288px;
  --header-h:    60px;
  --radius:      10px;
  --radius-lg:   16px;
  --font-head:   'Inter',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --font-body:   'DM Sans',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --font-mono:   'DM Mono',"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 8px rgba(0,0,0,.04);
  --shadow:      0 2px 12px rgba(0,0,0,.08), 0 4px 28px rgba(0,0,0,.05);
  --shadow-lg:   0 8px 40px rgba(0,0,0,.12), 0 16px 60px rgba(0,0,0,.07);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── DEFAULTER BANNER ─────────────────────────────── */
#defaulter-banner {
  display: none;
  flex-shrink: 0;
  background: #991b1b;
  color: #fef2f2;
  font-family: var(--font-body);
  font-size: .78rem;
  font-weight: 600;
  text-align: center;
  padding: 9px 20px;
  letter-spacing: .01em;
}
#defaulter-banner a {
  color: #fecaca;
  font-weight: 700;
  text-decoration: underline;
  margin-left: 6px;
}

/* ═══════════════════════════════════════════════════════
   HEADER / NAV
═══════════════════════════════════════════════════════ */
header {
  flex-shrink: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  position: relative;
  z-index: 50;
  box-shadow: var(--shadow-sm);
}
.nav-inner {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
}

/* Left zone — sidebar toggle + logo */
.nav-left {
  width: var(--sidebar-w);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  height: 100%;
}

/* Center zone — subject tabs */
.nav-center {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 20px;
  overflow: hidden;
  height: 100%;
}

/* Right zone — spacer for balance */
.nav-right-pad {
  width: 44px;
  flex-shrink: 0;
}

/* sidebar toggle (hamburger, mobile) */
#sidebar-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 1.05rem;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s;
}
#sidebar-toggle:hover { background: var(--surface3); }

/* back button */
.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 1.1rem;
  text-decoration: none;
  cursor: pointer;
  transition: background .18s, transform .18s;
  flex-shrink: 0;
}
.btn-icon:hover { background: var(--surface3); transform: translateX(-2px); }

/* logo */
.nav-logo {
  font-family: var(--font-head);
  font-size: .88rem;
  font-weight: 900;
  letter-spacing: .07em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--accent);
}

/* subject tabs */
.subject-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.subject-tabs::-webkit-scrollbar { display: none; }
.subject-tab {
  font-family: var(--font-body);
  font-size: .8rem;
  font-weight: 500;
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
  letter-spacing: .01em;
}
.subject-tab:hover { color: var(--text); background: var(--surface2); }
.subject-tab.active {
  color: var(--accent);
  background: rgba(26,78,245,.08);
  border-color: rgba(26,78,245,.2);
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════
   MAIN LAYOUT — sidebar + content
═══════════════════════════════════════════════════════ */
.classroom-layout {
  flex: 1;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  overflow: hidden;
  min-height: 0;
}

/* ═══════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════ */
.classroom-sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-head h2 {
  font-family: var(--font-head);
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.01em;
  margin-bottom: 5px;
}
.sidebar-meta {
  font-size: .73rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sidebar-meta::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--sky);
  box-shadow: 0 0 6px var(--sky);
}

#topic-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--surface3) transparent;
}
#topic-list::-webkit-scrollbar { width: 4px; }
#topic-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

/* Topic row */
.topic-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 9px 10px;
  text-align: left;
  cursor: pointer;
  transition: all .18s;
  color: var(--text2);
  font-family: var(--font-body);
  font-size: .8rem;
  font-weight: 400;
  margin-bottom: 2px;
  position: relative;
}
.topic-item:hover:not(.locked) {
  background: var(--surface2);
  border-color: var(--border2);
  color: var(--text);
}
.topic-item.active {
  background: rgba(26,78,245,.07);
  border-color: rgba(26,78,245,.22);
  color: var(--accent);
  font-weight: 600;
}
.topic-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}
.topic-item.locked { opacity: .5; cursor: not-allowed; }
.topic-text { flex: 1; line-height: 1.4; }

/* ═══════════════════════════════════════════════════════
   MAIN CONTENT AREA
═══════════════════════════════════════════════════════ */
.classroom-main {
  overflow-y: auto;
  background: var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--surface3) transparent;
  display: flex;
  flex-direction: column;
}
.classroom-main::-webkit-scrollbar { width: 5px; }
.classroom-main::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

/* ── VIDEO WRAPPER ─────────────────────────────────── */
.video-outer {
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 40;
  background: #09111f;
  flex-shrink: 0;
}

/* Sentinel (never changes visibility — used only by IntersectionObserver) */
#video-sentinel {
  position: absolute;
  top: 0; left: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}

/* Placeholder shown while video is floating */
.video-placeholder-box {
  display: none;
  width: 100%;
  aspect-ratio: 16/9;
  background: rgba(26,78,245,.03);
  border: 2px dashed rgba(26,78,245,.12);
  border-radius: var(--radius-lg);
  align-items: center;
  justify-content: center;
  color: rgba(26,78,245,.35);
  font-size: .8rem;
  letter-spacing: .06em;
}
.video-placeholder-box.visible { display: flex; }

/* Main video container */
.video-area {
  width: 100%;
  aspect-ratio: 16/9;
  background: #09111f;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .3s;
}
.video-area:hover { box-shadow: 0 0 0 2px rgba(26,78,245,.3) inset; }

/* Floating PiP mode */
.video-area.floating {
  position: fixed !important;
  bottom: 20px !important;
  right: 18px !important;
  top: auto !important;
  left: auto !important;
  width: 284px !important;
  aspect-ratio: 16/9 !important;
  z-index: 9999 !important;
  border-radius: 12px !important;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(26,78,245,.25) !important;
  cursor: default !important;
  transition: none !important;
  will-change: transform !important;
  overflow: hidden !important;
}
@media (max-width: 720px) {
  .video-area.floating {
    width: 256px !important;
    bottom: 72px !important;
    right: 10px !important;
  }
}

/* Float bar (drag handle + close) */
.video-float-bar {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 30px;
  background: linear-gradient(180deg, rgba(9,17,31,.95) 0%, transparent 100%);
  z-index: 12;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  border-radius: 12px 12px 0 0;
}
.video-area.floating .video-float-bar { display: flex; }
.video-float-label {
  font-size: .58rem;
  color: rgba(255,255,255,.4);
  letter-spacing: .1em;
  text-transform: uppercase;
  font-family: var(--font-mono);
}
.video-float-close {
  background: none;
  border: none;
  color: rgba(255,255,255,.6);
  font-size: .85rem;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 4px;
  line-height: 1;
  transition: background .15s, color .15s;
}
.video-float-close:hover { background: rgba(255,255,255,.12); color: #fff; }

/* Drive "open in new tab" transparent blocker */
.video-drive-cover {
  position: absolute;
  top: 0; right: 0;
  width: 72px; height: 56px;
  z-index: 10;
  background: transparent;
  pointer-events: all;
}

/* Loading skeleton shimmer */
.video-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #0d1626 25%, #172140 50%, #0d1626 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s infinite;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
.video-skeleton-spinner {
  width: 34px; height: 34px;
  border: 2.5px solid rgba(26,78,245,.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
.video-skeleton-text {
  font-size: .72rem;
  color: rgba(255,255,255,.28);
  letter-spacing: .1em;
  font-family: var(--font-mono);
}

/* Tier badge */
.video-tier-badge {
  position: absolute;
  top: 14px; left: 14px;
  z-index: 8;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
}
.tier-foundation { background: rgba(249,115,22,.15); color: #fb923c; border: 1px solid rgba(249,115,22,.3); }
.tier-standard   { background: rgba(26,78,245,.15);  color: #6b9aff; border: 1px solid rgba(26,78,245,.3); }
.tier-mastery    { background: rgba(124,58,237,.15); color: #a78bfa; border: 1px solid rgba(124,58,237,.3); }

/* Video placeholder visuals (before any video loads) */
.video-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #0d1626, #172140, #0d1f3c);
  background-size: 300% 300%;
  animation: videoBgShift 9s ease infinite;
}
@keyframes videoBgShift { 0%,100% { background-position: 0% 50% } 50% { background-position: 100% 50% } }
.video-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(26,78,245,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,78,245,.06) 1px, transparent 1px);
  background-size: 44px 44px;
}
.video-play-btn {
  position: relative;
  z-index: 2;
  width: 68px; height: 68px;
  background: rgba(26,78,245,.85);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  color: #fff;
  box-shadow: 0 0 0 14px rgba(26,78,245,.1), 0 8px 28px rgba(26,78,245,.4);
  transition: transform .22s, box-shadow .22s;
  padding-left: 5px;
}
.video-area:hover .video-play-btn {
  transform: scale(1.1);
  box-shadow: 0 0 0 20px rgba(26,78,245,.08), 0 12px 36px rgba(26,78,245,.5);
}
.video-play-btn::before {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 2px solid rgba(26,78,245,.25);
  animation: pulse-ring 2.6s ease-out infinite;
}
@keyframes pulse-ring { 0% { transform: scale(1); opacity: .5 } 100% { transform: scale(1.65); opacity: 0 } }
.video-duration {
  position: absolute;
  bottom: 14px; right: 14px;
  z-index: 3;
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(8px);
  color: var(--text2);
  font-size: .7rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  font-family: var(--font-mono);
  letter-spacing: .04em;
}

/* Locked video overlay */
.video-locked {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgba(240,244,255,.92);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px;
}
.video-locked h3 {
  font-family: var(--font-head);
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 8px;
}
.video-locked p {
  color: rgba(11,21,41,.5);
  margin-bottom: 22px;
  font-size: .9rem;
}

/* ── LESSON PANEL ────────────────────────────────── */
.content-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 28px 48px;
  width: 100%;
  animation: fadeUp .4s ease both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }

/* Meta row: topic tag + duration */
.lesson-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.topic-tag {
  background: rgba(26,78,245,.09);
  color: var(--accent);
  font-size: .68rem;
  font-weight: 800;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid rgba(26,78,245,.18);
  letter-spacing: .07em;
  text-transform: uppercase;
}
.lesson-duration {
  color: var(--muted);
  font-size: .75rem;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
}
.lesson-duration::before {
  content: '◷';
  color: var(--muted2);
  font-size: .85rem;
}

/* Lesson title */
.topic-title {
  font-family: var(--font-head);
  font-size: 2rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1.12;
  letter-spacing: -.025em;
  margin-bottom: 22px;
}

/* Action button row */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
.btn {
  font-family: var(--font-body);
  font-size: .85rem;
  font-weight: 700;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  transition: all .18s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  letter-spacing: .01em;
  text-decoration: none;
}
.btn-lg { padding: 10px 22px; font-size: .88rem; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 3px 14px rgba(26,78,245,.28);
}
.btn-primary:hover {
  background: var(--accent-dark);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(26,78,245,.4);
}
.btn-outline {
  background: var(--surface);
  color: var(--text2);
  border: 1.5px solid var(--border2);
}
.btn-outline:hover {
  background: var(--surface2);
  border-color: rgba(26,78,245,.3);
  color: var(--accent);
}

/* ── LESSON CONTENT ─────────────────────────────── */
#lesson-content p {
  font-size: .97rem;
  line-height: 1.85;
  color: var(--text2);
  margin-bottom: 22px;
}
#lesson-content h3 {
  font-family: var(--font-head);
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 14px;
  margin-top: 4px;
  letter-spacing: -.01em;
}
#lesson-content ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 26px;
}
#lesson-content ul li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 14px;
  color: var(--text2);
  font-size: .9rem;
  line-height: 1.6;
  transition: border-color .18s, box-shadow .18s;
}
#lesson-content ul li:hover {
  border-color: rgba(26,78,245,.2);
  box-shadow: 0 2px 10px rgba(26,78,245,.06);
}
#lesson-content ul li .bullet {
  color: var(--accent);
  font-size: 1rem;
  margin-top: 2px;
  flex-shrink: 0;
}

/* Formula box */
.formula-box {
  background: linear-gradient(135deg, rgba(219,234,254,.8), rgba(191,219,254,.55));
  border: 1px solid rgba(26,78,245,.18);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
}
.formula-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;

<!--
  ═══════════════════════════════════════════════════════════════════════
  ⚠️  CRITICAL PATH — SCRIPT LOADING ORDER FOR GSHEETS → VIDEO PIPELINE
  ═══════════════════════════════════════════════════════════════════════

  DO NOT reorder, remove, combine, or defer any of these tags.
  DO NOT add async or defer attributes — load order is synchronous by design.

  DEPENDENCY GRAPH:
    supabase.min.js   → registers window.supabase
    auth.js           → creates window.sb
    auth-guard.js     → registers AUTH_GUARD
    storage.js        ┐
    skill_questions.js├ Skill Chamber dependency chain
    curriculum.js     │
    intervention_modal.js┘
    gsheet-curriculum.js → registers GSHEET_CURRICULUM
    gdrive-video.js      → registers GDRIVE_VIDEO.embedUrl()
    classroom.js         → registers CLASSROOM (FINAL CONSUMER)
    skill_chamber.js     → monkey-patches CLASSROOM.loadTopic (must be last)
  ═══════════════════════════════════════════════════════════════════════
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js?v=3"></script>

<script src="js/skill_questions.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/intervention_modal.js"></script>
<script src="js/gsheet-curriculum.js"></script>
<script src="js/gdrive-video.js"></script>

<script src="js/skill_chamber.js"></script>

<script>
/* ── Toast helper (global, used by classroom.js and inline onclick handlers) ── */
function toast(msg, dur) {
  dur = dur || 2800;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, dur);
}

/* ═══════════════════════════════════════════════════════════════════
   CLASSROOM INIT SEQUENCE
   ───────────────────────────────────────────────────────────────────
   Auth + sheet fetch run in parallel (Promise.all) to minimise the
   time between page load and first sidebar render.
   ─────────────────────────────────────────────────────────────────
   Order:
     1. AUTH_GUARD.init()          — session + premium check
     2. GSHEET_CURRICULUM.init()   — fetch + parse CSV sheets (parallel)
     3. CLASSROOM.mergeSheetIntoCurriculum() — sheet → CURRICULUM merge
     4. window._ueProfile set      — for video watermark
     5. CLASSROOM.init()           — render sidebar + first video
     6. IntersectionObserver       — floating PiP behaviour
═══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async function() {

  /* Fire auth + sheet fetch in parallel — both are independent network
     requests. Saves ~300-400ms vs sequential. */
  var results = await Promise.all([
    AUTH_GUARD.init(),
    GSHEET_CURRICULUM.init(),
  ]);
  var authData = results[0];

  /* Auth failed — AUTH_GUARD already redirected to login.html */
  if (!authData) return;

  /* Merge sheet topics into CURRICULUM before sidebar renders */
  CLASSROOM.mergeSheetIntoCurriculum();

  /* Store profile globally for video watermark */
  if (authData.profile) window._ueProfile = authData.profile;

  /* Render sidebar + first topic */
  await CLASSROOM.init(authData);

  /* ── Floating PiP: activate when video scrolls out of view ──────
     Uses the stable sentinel div (not the placeholder) to avoid the
     observer loop that caused the original "blinking" bug.          */
  var videoArea   = document.getElementById('video-area');
  var placeholder = document.getElementById('video-placeholder-box');
  var sentinel    = document.getElementById('video-sentinel');
  var videoOuter  = document.getElementById('video-outer');

  if (videoArea && sentinel && 'IntersectionObserver' in window) {
    var isFloating = false;

    function activateFloat() {
      if (isFloating) return;
      isFloating = true;
      if (videoOuter) {
        videoOuter.style.minHeight = videoOuter.getBoundingClientRect().height + 'px';
      }
      videoArea.style.cssText = 'transition:none';
      videoArea.classList.add('floating');
      videoArea.style.position  = 'fixed';
      videoArea.style.bottom    = (window.innerWidth <= 720 ? '72' : '20') + 'px';
      videoArea.style.right     = (window.innerWidth <= 720 ? '10' : '18') + 'px';
      videoArea.style.top       = 'auto';
      videoArea.style.left      = 'auto';
      videoArea.style.width     = (window.innerWidth <= 720 ? '256' : '284') + 'px';
      videoArea.style.transition = '';
      if (placeholder) placeholder.classList.add('visible');
      enableDrag(videoArea);
    }

    function deactivateFloat() {
      if (!isFloating) return;
      isFloating = false;
      videoArea.removeAttribute('style');
      videoArea.classList.remove('floating');
      if (placeholder) placeholder.classList.remove('visible');
      if (videoOuter) videoOuter.style.minHeight = '';
    }

    var obs = new IntersectionObserver(function(entries) {
      var visible = entries[0].isIntersecting;
      if (!videoArea.querySelector('iframe')) return;
      if (!visible) activateFloat();
      else deactivateFloat();
    }, { threshold: 0.15 });

    obs.observe(sentinel);
  }
});

/* ── Drag-to-reposition (desktop only) for floating PiP ── */
function enableDrag(el) {
  if (el._dragEnabled) return;
  el._dragEnabled = true;
  var sX, sY, oX, oY, dragging = false;

  el.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'touch') return;
    if (e.target.closest('iframe') || e.target.closest('.video-float-close')) return;
    sX = e.clientX; sY = e.clientY;
    var r = el.getBoundingClientRect();
    oX = r.left; oY = r.top;
    dragging = false;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', function(e) {
    if (!el.hasPointerCapture(e.pointerId)) return;
    var dx = e.clientX - sX, dy = e.clientY - sY;
    if (!dragging && Math.hypot(dx, dy) < 6) return;
    dragging = true;
    el.style.transition = 'none';
    el.style.left   = Math.max(0, oX + dx) + 'px';
    el.style.top    = Math.max(0, oY + dy) + 'px';
    el.style.right  = 'auto';
    el.style.bottom = 'auto';
  });

  el.addEventListener('pointerup', function() {
    dragging = false;
    el.style.transition = '';
  });
}
</script>
